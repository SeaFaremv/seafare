// Builds a summary (revenue, counts, per-island breakdown, paid/unpaid
// split) for shipments logged within the chosen date range and shows it
// in a popup, with a Download button that exports the same summary as a
// plain-text file.
function openGeneratedReportPopup(from, to){
  const inRange = state.shipments.filter(s => s.loadedAt && !s.voided && new Date(s.loadedAt) >= from && new Date(s.loadedAt) <= to);
  const invoiced = inRange.filter(s => s.items && s.items.length);
  let totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const paid = invoiced.filter(s => s.paid);
  const unpaid = invoiced.filter(s => !s.paid);
  let paidRevenue = paid.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaidRevenue = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  let invoicedCount = invoiced.length;
  let paidCount = paid.length;

  // Delivered+paid shipments older than 12 hours get folded into a
  // per-month total and removed (see cleanupCompletedShipments) -- merge
  // those archived totals back in here for any month fully covered by
  // this date range, so a report covering past months doesn't silently
  // undercount once the individual records are gone. A month only
  // partially covered by the range is skipped, since the archived total
  // can't be split by day -- so a partial-month report may run slightly
  // low on already-archived data specifically.
  const monthlyReports = state.settings.monthlyReports || {};
  let includedArchivedMonth = false;
  Object.keys(monthlyReports).forEach(key => {
    const [y,m] = key.split('-').map(Number);
    const monthStart = new Date(y, m-1, 1, 0,0,0);
    const monthEnd = new Date(y, m, 0, 23,59,59);
    if(monthStart >= from && monthEnd <= to){
      const agg = monthlyReports[key];
      totalRevenue += agg.revenue || 0;
      paidRevenue += agg.revenue || 0; // archived shipments were paid by definition
      invoicedCount += agg.shipmentCount || 0;
      paidCount += agg.shipmentCount || 0;
      includedArchivedMonth = true;
      Object.keys(agg.byIsland||{}).forEach(isl => {
        byIsland[isl] = byIsland[isl] || {count:0, revenue:0};
        byIsland[isl].count += agg.byIsland[isl].count;
        byIsland[isl].revenue += agg.byIsland[isl].revenue;
      });
    }
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);
  const rangeLabel = `${fmtDMY(from.toISOString())} \u2013 ${fmtDMY(to.toISOString())}`;

  closeGeneratedReportPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'generated-report-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="generated-report-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin-bottom:2px;">Report</h3>
        <button type="button" class="btn btn-ghost" id="generated-report-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:14px;">${escapeHtml(rangeLabel)}</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">Shipments</div><div class="sval">${invoicedCount}</div></div>
        <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${fmtMoney(paidRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${fmtMoney(unpaidRevenue)}</div></div>
      </div>
      ${includedArchivedMonth ? `<p class="note" style="margin-top:10px;">Includes archived totals for fully-covered past months \u2014 individual delivered &amp; paid records older than 12 hours are summarized here rather than kept in full.</p>` : ''}
      <h3 style="margin-top:18px;margin-bottom:8px;">By Island</h3>
      ${islandRows.length ? islandRows.map(isl => `
        <div class="rate-row">
          <div class="name">${escapeHtml(isl)}</div>
          <div class="price">${byIsland[isl].count} shipment${byIsland[isl].count===1?'':'s'}</div>
          <div class="amt">${fmtMoney(byIsland[isl].revenue)}</div>
        </div>
      `).join('') : `<div class="empty" style="padding:16px 0;">No shipments in this period.</div>`}
      <button class="btn btn-primary" id="generated-report-download-btn" style="width:100%;margin-top:18px;">Download Report</button>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeGeneratedReportPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('generated-report-popup-close-btn').addEventListener('click', closeGeneratedReportPopup);
  document.getElementById('generated-report-download-btn').addEventListener('click', async () => {
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || await getCurrentBoatName();
    const lines = [
      `${boatName} -- Report`,
      rangeLabel,
      '',
      `Total Revenue: ${fmtMoney(totalRevenue)}`,
      `Shipments: ${invoicedCount}`,
      `Paid: ${fmtMoney(paidRevenue)} (${paidCount})`,
      `Unpaid: ${fmtMoney(unpaidRevenue)} (${unpaid.length})`,
      '',
      'By Island:',
      ...islandRows.map(isl => `  ${isl}: ${byIsland[isl].count} shipment(s), ${fmtMoney(byIsland[isl].revenue)}`),
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report-${fromVal_(from)}-to-${fromVal_(to)}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
}
function fromVal_(d){ return d.toISOString().slice(0,10); }
function closeGeneratedReportPopup(){
  if(document.getElementById('generated-report-popup-overlay')) unlockBodyScroll();
  document.getElementById('generated-report-popup-overlay')?.remove();
}

    `<button class="${t.id===state.settingsTab?'active':''}" data-subtab="${t.id}">${t.label}</button>`

}

      <div class="view-field">

  body.innerHTML = `

      <h3>Trip Defaults</h3>
      <p class="sub" style="margin-bottom:12px;">Fixed details used on every trip announcement, since these rarely change. Set once here instead of retyping them each time you plan a trip.</p>
      ${tripField}
    </div>

    <div class="settings-block">
      <h3>Boat Routes</h3>
      <p class="sub" style="margin-bottom:12px;">The routes this boat mainly ferries. Once set, picking an origin on the New Trip form fills in destinations and the loading location automatically.</p>
      <div id="routes-list">
        ${routes.length === 0 ? '<div class="empty">No routes set up yet.</div>' : routes.map((r, idx) => `
          <div class="item-result-row" style="margin-bottom:6px;flex-wrap:wrap;">
            <span>${escapeHtml(r.origin)} \u2192 ${escapeHtml((r.destinations||[]).join(', '))}</span>
            <button class="btn btn-danger" data-del-route="${idx}" style="padding:6px 10px;font-size:12px;">Remove</button>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:12px;">
        <label>Origin</label>
        <input type="text" id="route-origin-input" placeholder="e.g. Male'">
        <label>Destinations (one per line)</label>
        <textarea id="route-dests-input" rows="2" placeholder="e.g. Maalhos&#10;Himandhoo&#10;Feridhoo"></textarea>
        <label>Loading location / jetty (optional)</label>
        <input type="text" id="route-location-input" placeholder="e.g. Male' T-Jetty Area">
        <button class="btn btn-primary" id="add-route-btn" style="width:100%;">+ Add Route</button>
      </div>
    </div>

    <div class="settings-block">
      <h3>Trip Manifest File</h3>

    </div>
  `;

  const byId = (id) => document.getElementById(id);

  byId('edit-trip-defaults-btn')?.addEventListener('click', () => { state.settingsEdit.trip = true; renderTripSettings(); });
  byId('cancel-trip-defaults-btn')?.addEventListener('click', () => { state.settingsEdit.trip = false; renderTripSettings(); });
  byId('save-trip-defaults-btn')?.addEventListener('click', async () => {
    const boatContacts = byId('trip-contacts-input').value.trim();
    const trackingLink = byId('trip-tracking-input').value.trim();
    const viberLink = byId('trip-viber-input').value.trim();

    state.settingsEdit.trip = false;
    renderTripSettings();
  });

  byId('add-route-btn').addEventListener('click', async () => {
    const origin = byId('route-origin-input').value.trim();
    const destinations = byId('route-dests-input').value.split('\n').map(s=>s.trim()).filter(Boolean);

    await withFreshSettings(fresh => {
      fresh.routes = fresh.routes || [];
      fresh.routes.push({ origin, destinations, location });

    renderTripSettings();
  });
  document.querySelectorAll('[data-del-route]').forEach(b => b.addEventListener('click', async () => {
    const idx = parseInt(b.dataset.delRoute, 10);
    if(!confirm('Remove this route?')) return;
    await withFreshSettings(fresh => {
      if(fresh.routes) fresh.routes.splice(idx, 1);
    });
    renderTripSettings();
  }));
}

async function loadGoogleSheetsStatus(){
  const el = document.getElementById('google-sheets-status');
  if(!el) return;
  try{
    const res = await fetch(`${API_BASE}/api/google/status?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
    const data = await res.json().catch(() => ({}));
    if(!document.getElementById('google-sheets-status')) return; // navigated away
    if(!data.configured){
      el.innerHTML = `<div class="empty">This feature isn't set up on the server yet. Ask your developer to add Google API credentials.</div>`;
      return;
    }
    if(data.connected){
      el.innerHTML = `
        <div class="view-field"><span class="vf-value" style="font-family:'Inter',sans-serif;">${escapeHtml(data.email)}</span></div>
        <button class="btn btn-ghost" id="google-disconnect-btn" style="width:100%;margin-top:8px;">Disconnect Google Account</button>
      `;
      document.getElementById('google-disconnect-btn').addEventListener('click', () => {
        if(!confirm('Disconnect this Google account? New trips will stop getting sheets until you reconnect.')) return;
        fetch(`${API_BASE}/api/google/disconnect`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatId: CURRENT_BOAT_ID })
        }).then(() => loadGoogleSheetsStatus());
      });
    } else {
      el.innerHTML = `<button class="btn btn-primary" id="google-connect-btn" style="width:100%;">Connect Google Account</button>`;
      document.getElementById('google-connect-btn').addEventListener('click', async () => {
        const r = await fetch(`${API_BASE}/api/google/auth-url?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
        const d = await r.json().catch(() => ({}));
        if(d.url) location.href = d.url;
        else alert('Could not start Google connection. Try again.');
      });
    }
  }catch(e){
    console.error('loadGoogleSheetsStatus failed', e);
    if(el) el.innerHTML = `<div class="empty">Could not check Google connection status.</div>`;
  }
}

// Customers aren't a separate saved list -- they're derived live from every
// shipment ever logged for this boat, deduplicated by mobile number (the
// true unique identifier, since two different senders can share a name).
// This keeps the directory always in sync with real activity with no extra
// data entry or storage needed.
function renderCustomerDirectory(){
  const body = document.getElementById('settings-body');
  const routes = state.settings.routes || [];
  const routeIslands = new Set();
  routes.forEach(r => (r.destinations||[]).forEach(d => routeIslands.add(d)));
  (state.shipments||[]).forEach(s => { if(s.island) routeIslands.add(s.island); });
  const islands = Array.from(routeIslands).sort();
  const selectedIsland = state.customerDirectoryIsland || '';

  const byMobile = new Map();
  (state.shipments||[]).forEach(s => {
    if(selectedIsland && s.island !== selectedIsland) return;
    if(s.mobile && s.name){
      const key = s.mobile;
      if(!byMobile.has(key)) byMobile.set(key, { name: s.name, mobile: s.mobile, islands: new Set() });
      if(s.island) byMobile.get(key).islands.add(s.island);
    }
  });
  const customers = Array.from(byMobile.values()).sort((a,b) => a.name.localeCompare(b.name));

  body.innerHTML = `
    <div class="settings-block">
      <h3>Customer Check-In Link</h3>
      <div class="url-box"><div><div class="tag-label">Put this on your QR code / share with customers</div><div class="u">${escapeHtml(baseUrl() + '#c/' + CURRENT_BOAT_ID)}</div></div></div>
      <div class="note">This is what your senders and receivers use to check in cargo and track shipments for THIS boat specifically.</div>

let lastRenderedTab = null;
function render(){
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    renderGate();
    return;
  }
  document.getElementById('gate-area').innerHTML = '';
  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('panel').style.display = 'block';

  if(state.entryMode === 'customer'){ renderModeToggle(); }
  else { document.getElementById('mode-toggle').style.display = 'none'; }

  renderTabs();

  const allowed = ROLE_TABS[state.role].map(t => t.id);
  if(!allowed.includes(state.tab)) state.tab = DEFAULT_TAB[state.role];
  if(!(state.tab === 'settings' && state.settingsTab === 'reports')){ state.reportTripView = null; state.reportIslandView = null; }

  // Every time the Dashboard is freshly opened (not on every re-render
  // while already there, e.g. from polling) it lands on whichever island
  // the boat has actually arrived at, per the Trips tab's "Boat arrived
  // at" selection -- staff don't have to re-tap the island chip each time
  // they switch back in.
  if(state.tab === 'dashboard' && lastRenderedTab !== 'dashboard'){
    const arrived = activeTripArrivedIsland();
    if(arrived) state.dashIslandView = arrived;
  }
  if(state.tab !== lastRenderedTab){
    document.querySelector('.shell')?.classList.remove('header-collapsed');
    _lastScrollTopForCollapse = 0;
    const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
    if(scrollable) scrollable.scrollTop = 0;
  }
  document.querySelector('.shell')?.classList.toggle('settings-active', state.tab === 'settings');
  lastRenderedTab = state.tab;

  // Cash popup can be opened from Dashboard, Invoices, or Reports -- only
  // clean it up when navigating to some other tab entirely, not on every
  // render (which includes background polling refreshes while it's open).
  if(!['dashboard','invoices','reports'].includes(state.tab)){
    if(document.getElementById('cash-popup-overlay')) unlockBodyScroll();
    document.getElementById('cash-popup-overlay')?.remove();
  }

  if(state.tab !== 'dashboard'){
    // Same three overlays as above -- if the person switches tabs while
    // one is open (rather than closing it first), it was being yanked out
    // of the DOM directly here without ever going through its close
    // function, which is exactly what left the scroll lock stuck on and
    // caused the same page-jump bug through a second path.
    if(document.getElementById('load-modal-overlay') || document.getElementById('invoice-popup-overlay') || document.getElementById('deliver-other-popup-overlay')) unlockBodyScroll();
    document.getElementById('load-modal-overlay')?.remove();
    document.getElementById('invoice-popup-overlay')?.remove();
    document.getElementById('deliver-other-popup-overlay')?.remove();
  }
  if(state.tab !== 'dashboard'){
    if(document.getElementById('finish-trip-popup-overlay') || document.getElementById('dest-picker-popup-overlay')) unlockBodyScroll();
    document.getElementById('finish-trip-popup-overlay')?.remove();
    document.getElementById('dest-picker-popup-overlay')?.remove();
  }
  if(state.tab !== 'invoices'){
    if(document.getElementById('invoice-list-popup-overlay')) unlockBodyScroll();
    document.getElementById('invoice-list-popup-overlay')?.remove();
  }

  if(state.tab === 'dashboard'){ renderDashboard(); wireLoadFormEvents(); }
  else if(state.tab === 'checkin'){ renderCheckin(); }
  else if(state.tab === 'track'){ renderTrack(); }
  else if(state.tab === 'invoices'){ renderInvoices(); }
  else if(state.tab === 'shipments'){ renderShipmentsTab(); }
  else if(state.tab === 'settings'){ renderSettings(); }
}

const _origRenderDashboard = renderDashboard;
renderDashboard = function(){
  const scrollY = window.scrollY;
  _origRenderDashboard();
  wireLoadFormEvents();
  // Restoring a stale scrollY blindly is unsafe whenever the re-render
  // makes the page shorter than before (a form collapsing, a card
  // finishing and shrinking, etc.) -- the browser just leaves the
  // viewport wherever that position lands, which can be past the actual
  // content, looking like the top of the page got cut off. Clamping to
  // the real scrollable height after the re-render fixes that generally,
  // for any case like this rather than one at a time.
  const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.min(scrollY, maxScroll));
};

async function openQrScanner(){
  loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js').catch(e => console.error('jsQR failed to load', e));
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
      <span style="color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;">Scan Boat QR Code</span>
      <button id="qr-scan-close" style="background:none;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;">\u00d7</button>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <video id="qr-scan-video" autoplay playsinline muted style="max-width:100%;max-height:100%;"></video>
      <div style="position:absolute;width:70%;aspect-ratio:1;border:2px solid var(--teal-light);border-radius:12px;pointer-events:none;"></div>
    </div>
    <div id="qr-scan-status" style="color:rgba(255,255,255,0.75);text-align:center;padding:14px;font-size:13.5px;">Point your camera at the boat's QR code.</div>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector('#qr-scan-video');
  const statusEl = overlay.querySelector('#qr-scan-status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let stopped = false;

  const cleanup = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    overlay.remove();
  };
  overlay.querySelector('#qr-scan-close').addEventListener('click', cleanup);

  const tick = () => {
    if(stopped) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = typeof jsQR === 'function' ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if(code && code.data){
        statusEl.textContent = 'Got it \u2014 opening...';
        try{
          const url = new URL(code.data, location.href);
          if(url.origin === location.origin){
            cleanup();
            location.hash = url.hash.replace('#','');
            return;
          }
        }catch(e){ /* not a valid URL, fall through */ }
        statusEl.textContent = "That doesn't look like a SeaFare QR code. Try again.";
      }
    }
    requestAnimationFrame(tick);
  };

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
      stream = s;
      video.srcObject = s;
      requestAnimationFrame(tick);
    })
    .catch(() => {
      statusEl.textContent = "Couldn't access the camera. Check your browser's camera permission for this site.";
    });
}

async function adminFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const creds = { username: state.adminUsername, passkey: state.adminPasskey };
  let url = `${API_BASE}${path}`;
  let body;
  if(method === 'GET'){
    url += (path.includes('?') ? '&' : '?') + `username=${encodeURIComponent(creds.username)}&passkey=${encodeURIComponent(creds.passkey)}`;
  } else {
    body = JSON.stringify(Object.assign({}, opts.body || {}, creds));
  }
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ state.adminAuthed = false; clearAdminSession(); state.adminError = 'Session expired. Log in again.'; renderAdmin(); throw new Error('unauthorized'); }
  return data;
}

const SIGNUP_FIELD_IDS = ['su-boat-name','su-owner-name','su-contact','su-mobile','su-gmail','su-bank-name','su-bank-number','su-routes','su-tracking','su-viber','su-social','su-passkey'];
function clearFieldErrors(ids){ ids.forEach(id => document.getElementById(id)?.classList.remove('field-error')); }
function markFieldError(id, clearValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('field-error');
  if(clearValue) el.value = '';
}

async function submitSignup(){
  const val = (id) => (document.getElementById(id).value || '').trim();
  const errorEl = document.getElementById('su-error');
  const btn = document.getElementById('su-submit-btn');
  clearFieldErrors(SIGNUP_FIELD_IDS);

  const body = {
    boatName: val('su-boat-name'),
    ownerName: val('su-owner-name'),
    contactNumber: val('su-contact'),
    mobile: val('su-mobile'),
    gmail: val('su-gmail'),
    bankAccountName: val('su-bank-name'),
    bankAccountNumber: val('su-bank-number'),
    routes: val('su-routes').split('\n').map(s=>s.trim()).filter(Boolean),
    trackingLink: val('su-tracking'),
    viberLink: val('su-viber'),
    socialLinks: val('su-social').split('\n').map(s=>s.trim()).filter(Boolean),
    passkey: val('su-passkey'),
  };

  const requiredMap = { boatName:'su-boat-name', ownerName:'su-owner-name', contactNumber:'su-contact', mobile:'su-mobile', passkey:'su-passkey' };
  const missing = Object.keys(requiredMap).filter(k => !body[k]);
  if(missing.length){
    missing.forEach(k => markFieldError(requiredMap[k], false));
    errorEl.textContent = 'Please fill in all fields marked *.';
    return;
  }
  if(body.passkey.length < 6){
    markFieldError('su-passkey', true);
    errorEl.textContent = 'PIN must be at least 6 characters.';
    return;
  }
  if(!isValidMaldivesMobile(body.mobile)){
    markFieldError('su-mobile', false);
    errorEl.textContent = 'Invalid mobile number \u2014 must start with 7 or 9 and have 7 digits.';
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  try{
    const res = await fetch(`${API_BASE}/api/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = 'Create My Boat';
    if(res.ok && data.ok){
      state.orgSignupTotpSecret = data.totpSecret;
      state.orgAuthed = true;
      state.orgPasskey = body.passkey;
      state.orgData = {
        id: data.organizationId, boatName: body.boatName, ownerName: body.ownerName,
        contactNumber: body.contactNumber, gmail: body.gmail, mobile: body.mobile,
        bankAccountName: body.bankAccountName, bankAccountNumber: body.bankAccountNumber,
        trackingLink: body.trackingLink, viberLink: body.viberLink,
        socialLinks: body.socialLinks, routes: body.routes,
      };
      state.orgBoats = [{ id: data.boatId, name: body.boatName, is_primary: true, status: 'active' }];
      renderOrgArea();
    } else {
      const msg = (data && data.error) || 'Could not create your account.';
      errorEl.textContent = msg;
      if(/boat name/i.test(msg)) markFieldError('su-boat-name', true);
    }
  }catch(e){
    console.error('signup failed', e);
    btn.disabled = false; btn.textContent = 'Create My Boat';
    errorEl.textContent = 'Something went wrong. Try again.';
  }
}

          const parts = [(data && data.error) || 'This account has been suspended.'];
          if(data && data.note) parts.push(`Reason given: "${data.note}"`);

          showMessageBox('Account Suspended', parts.join('\n\n'));

          errorEl.textContent = (data && data.error) || 'Login failed.';
        }
        markFieldError('ol-boat-name', false);
        markFieldError('ol-passkey', true);
      }
    }catch(e){
      console.error('org login failed', e);
      btn.disabled = false; btn.textContent = 'Log In';
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  };
  document.getElementById('ol-submit-btn').addEventListener('click', submit);
  document.getElementById('ol-passkey').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });
  document.getElementById('ol-signup-instead-btn').addEventListener('click', () => { state.orgScreen = 'signup'; state.orgError=''; renderOrgArea(); });

/* ---------------- Routing ---------------- */
function handleHash(){
  const h = (location.hash || '').replace('#','');

  if(h === 'admin' || h.startsWith('admin/')){
    state.entryMode = 'admin';
    renderAdmin();
    return;
  }

  if(h === 'signup'){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'signup';
    renderOrgArea();
    return;
  }
  if(h === 'org' || h.startsWith('org/')){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;
  }

  if(h.startsWith('reset-pin/')){
    const token = decodeURIComponent(h.slice('reset-pin/'.length));
    state.entryMode = 'internal'; state.gateRole = 'owner'; state.role = null;
    state.gateStage = 'reset-confirm'; state.resetToken = token;
    state.resetMsg = ''; state.resetError = '';
    render();
    return;
  }

  if(h === OWNER_HASH || h.startsWith(OWNER_HASH + '/')){
    // The numeric Owner PIN gate is retired -- Owners authenticate
    // exclusively through #org (boat name + passkey) now, which is real
    // authentication rather than a light PIN gate. Any #owner link just
    // sends them to the real login screen.
    location.hash = 'org';
    return;
  }
  if(h === INTERNAL_HASH || h.startsWith(INTERNAL_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This staff link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'staff')){
      state.entryMode = 'internal'; state.gateRole = 'staff'; state.role = null; state.gateStage = 'pick'; state.gateMode = 'signin';
      if(switchingBoat) clearSession();
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }
  if(h === MANAGER_HASH || h.startsWith(MANAGER_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This manager link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'manager')){
      state.entryMode = 'internal'; state.gateRole = 'manager'; state.role = null; state.gateStage = 'pick';
      if(switchingBoat) clearSession();
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  // Customer entry (senders/receivers) is boat-scoped via #c/<boatId>, same
  // as owner/staff links -- each boat needs its own QR code / shared link
  // now that this is a multi-boat platform.
  if(h === 'c' || h.startsWith('c/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This link is missing a boat reference. Ask the boat owner for the correct customer check-in link.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    state.entryMode = 'customer';
    if(!state.role || switchingBoat){ state.role = 'sender'; state.tab = 'checkin'; }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  if(state.entryMode === 'internal' && INTERNAL_ROLES.includes(state.role)){
    if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    render();
    return;
  }

  // Continuing navigation within an already-active customer session (tab
  // clicks, mode toggle, etc all just set location.hash to a plain tab id).
  if(state.entryMode === 'customer' && state.role){
    if(ROLE_TABS[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }

  // Anything else unrecognized -- including the bare URL -- shows the
  // landing page rather than guessing at a boat to drop the visitor into.
  renderLandingPage();
}

// Tap-to-copy for every link box shown anywhere in the app (Owner Links,
// Staff Links, Manager Links, Customer Check-In Link, etc) -- one delegated
// listener covers all of them regardless of which screen renders them.
document.body.addEventListener('click', (e) => {
  const box = e.target.closest('.url-box');
  if(!box) return;
  const linkEl = box.querySelector('.u');
  if(!linkEl) return;
  const text = linkEl.textContent;
  const showCopied = () => {
    const label = box.querySelector('.tag-label');
    if(!label) return;
    const original = label.dataset.originalText || label.textContent;
    label.dataset.originalText = original;
    label.textContent = 'Copied!';
    label.style.color = 'var(--teal)';
    setTimeout(() => { label.textContent = original; label.style.color = ''; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showCopied(); }catch(err){}
      ta.remove();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showCopied(); }catch(err){}
    ta.remove();
  }
});

// Polling is the main data cost on a slow connection -- shipments carry
// embedded loading photos, so re-fetching them every few seconds on 3G
// both burns data and, worse, can queue up requests faster than 3G can
// finish them, which is what actually made the app feel broken rather
// than just slow. This: (1) skips starting a new poll while one is still
// in flight, (2) backs off the interval on a detected slow connection,
// and (3) skips entirely while offline instead of firing a doomed request.
//
// startPolling() is safe to call from any entry point that lands someone
// in the dispatch view, not just the bottom of init() -- it's idempotent
// (a second call is a no-op), which matters because several entry points
// (a returning owner's session resumed directly, and the org dashboard's
// "Open Dispatch" button that every freshly-signed-up boat goes through)
// used to skip polling setup entirely, leaving those sessions with no
// live updates from other devices until a manual reload.
let pollInFlight = false;
let pollingStarted = false;
let pollCycleCount = 0;
function currentPollIntervalMs(){
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const type = conn && conn.effectiveType;
  if(type === 'slow-2g' || type === '2g') return 45000;
  if(type === '3g') return 20000;
  return 8000;
}
async function pollCycle(){
  if(pollInFlight || !navigator.onLine){ scheduleNextPoll(); return; }
  pollInFlight = true;
  pollCycleCount++;
  try{
    // Settings (routes, staff PINs, bank details, social links) change far
    // less often than shipments do -- checking it on every single poll
    // wastes a request almost every time for data that's usually
    // identical to what's already known. Only check every 5th cycle
    // (roughly every 40s on a fast connection, up to a few minutes on a
    // slow one) -- shipments still poll every cycle unchanged, since that
    // data genuinely does change often during active dispatch.
    const shouldCheckSettings = pollCycleCount % 5 === 1;
    const [liteShipments, freshSettings] = await Promise.all([
      loadShipmentsLite(),
      shouldCheckSettings ? loadSettings() : Promise.resolve(state.settings)
    ]);
    // The lite fetch deliberately omits photos -- merge in whatever
    // we already have locally before comparing/adopting, otherwise
    // every shipment would look "changed" purely because its photo
    // field is missing, not because anything real changed. The
    // tradeoff: if someone retakes a photo on another device, this
    // device won't pick up the new one via polling alone -- only a
    // full reload or an action that specifically re-fetches that
    // shipment will. Acceptable given how rarely photos get retaken
    // versus how often polling runs.
    const localPhotosById = {};
    state.shipments.forEach(s => { if(s.photo) localPhotosById[s.id] = s.photo; });
    const freshShipments = liteShipments.map(s => localPhotosById[s.id] ? Object.assign({}, s, { photo: localPhotosById[s.id] }) : s);
    const shipmentsChanged = JSON.stringify(freshShipments) !== JSON.stringify(state.shipments);
    const settingsChanged = shouldCheckSettings && JSON.stringify(freshSettings) !== JSON.stringify(state.settings);
    if(shipmentsChanged) state.shipments = freshShipments;
    if(settingsChanged) state.settings = freshSettings;
    if(shipmentsChanged || settingsChanged){
      const typingInField = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.getElementById('panel').contains(document.activeElement);
      const hasOpenForm = typingInField || state.addCustomerOpen;
      if(state.role && !hasOpenForm && (state.tab === 'dashboard' || state.tab === 'track' || state.tab === 'settings')){ render(); }
      else if(state.role){ renderTabs(); }
    }
    // Roughly every 20th poll cycle (a few minutes, not every single poll
    // -- checking timestamps doesn't need to happen that often for a
    // 3-hour threshold) check whether any delivered shipment's photo
    // retention window has passed.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 3){
      cleanupExpiredDeliveryPhotos().catch(e => console.error('photo cleanup failed', e));
    }
    // Same idea, offset to a different cycle so the two don't both fire at
    // once -- checks whether any delivered+paid shipment has passed its
    // 12-hour retention window and folds/removes it if so.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 13){
      cleanupCompletedShipments().catch(e => console.error('completed-shipment cleanup failed', e));
    }
  } finally {
    pollInFlight = false;
    scheduleNextPoll();
  }
}
function scheduleNextPoll(){
  setTimeout(pollCycle, currentPollIntervalMs());
}
function startPolling(){
  if(pollingStarted) return;
  pollingStarted = true;
  scheduleNextPoll();
}

async function init(){
  // In-app browsers (Viber, WhatsApp, Messenger, etc. opening a shared
  // link) run their own embedded webview with its own toolbar chrome,
  // which behaves differently from Safari/Chrome and can leave the page
  // scrolled to a stale position on first load, or settle its own chrome
  // height a moment after the page first paints. Both get corrected here.
  window.scrollTo(0, 0);

  const session = loadSession();
  const rawHash = (location.hash || '').replace('#','');

  // Figure out which boat's data to load BEFORE fetching anything -- from
  // the URL if it names one (#owner/<boatId> or #staff/<boatId>), else from
  // a saved session, else the default fallback set above.
  let boatIdFromHash = null;
  if(rawHash.startsWith(OWNER_HASH + '/')) boatIdFromHash = rawHash.slice(OWNER_HASH.length + 1);
  else if(rawHash.startsWith(INTERNAL_HASH + '/')) boatIdFromHash = rawHash.slice(INTERNAL_HASH.length + 1);
  else if(rawHash.startsWith(MANAGER_HASH + '/')) boatIdFromHash = rawHash.slice(MANAGER_HASH.length + 1);
  else if(rawHash.startsWith('c/')) boatIdFromHash = rawHash.slice(2);
  if(boatIdFromHash) CURRENT_BOAT_ID = boatIdFromHash;
  else if(session && session.boatId) CURRENT_BOAT_ID = session.boatId;

  await refreshData();
  hideStartupLoading();

  const initialHash = rawHash;
  if(initialHash === 'admin' || initialHash.startsWith('admin/')){
    state.entryMode = 'admin';
    const adminSession = loadAdminSession();
    if(adminSession && adminSession.username && adminSession.passkey){
      state.adminAuthed = true;
      state.adminUsername = adminSession.username;
      state.adminPasskey = adminSession.passkey;
    }
    renderAdmin();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  // A refresh should never log someone out. If we're about to show the
  // org login/landing screen but a valid owner session already exists for
  // a specific boat, resume straight into that boat's app instead.
  if((initialHash === 'org' || initialHash === '') && session && session.role === 'owner' && session.boatId){
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    history.replaceState(null,'','#'+OWNER_HASH+'/'+session.boatId);
    render();
    tickClock();
    setInterval(tickClock, 30000);
    startPolling();
    return;
  }

  if(initialHash === 'signup' || initialHash === 'org' || initialHash.startsWith('org/')){
    state.entryMode = 'org';
    state.orgScreen = initialHash === 'signup' ? 'signup' : 'login';
    renderOrgArea();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  const isResetLink = rawHash.startsWith('reset-pin/');
  const isCustomerLink = rawHash === 'c' || rawHash.startsWith('c/');
  // A stored session must only auto-log-in if it's for the SAME boat being
  // requested -- otherwise clicking someone else's #owner/<boatId> link
  // while already signed into a different boat would silently grant owner
  // access to that other boat without ever checking its PIN. An explicit
  // #c/<boatId> customer link must always win regardless of any saved
  // internal session too -- otherwise testing your own customer check-in
  // link while logged in as Owner on the same browser silently redirects
  // straight to the Owner Dashboard instead of the customer form.
  const sessionMatchesRequestedBoat = !boatIdFromHash || (session && session.boatId === boatIdFromHash);
  if(!isResetLink && !isCustomerLink && session && (session.role === 'owner' || session.role === 'staff' || session.role === 'manager') && sessionMatchesRequestedBoat){
    // Re-check the session still makes sense (e.g. a staff/manager PIN
    // could have been removed from another device while this one stayed
    // logged in).
    const stillValid = session.role === 'owner'
      ? true
      : session.role === 'manager'
        ? !session.staffName || (state.settings.managerUsers||[]).some(u => u.name === session.staffName)
        : !session.staffName || (state.settings.staffUsers||[]).some(u => u.name === session.staffName);
    if(stillValid){
      state.entryMode = 'internal';
      state.gateRole = session.gateRole || session.role;
      state.role = session.role;
      state.staffName = session.staffName;
      const h = rawHash;
      const tabs = ROLE_TABS[state.role].map(t => t.id);
      state.tab = tabs.includes(h) ? h : DEFAULT_TAB[state.role];
      if(('#'+state.tab) !== location.hash) history.replaceState(null,'','#'+state.tab);
      render();
    } else {
      clearSession();
      handleHash();
    }
  } else {
    if(!sessionMatchesRequestedBoat) clearSession();
    handleHash();
  }
  window.scrollTo(0, 0);
  setTimeout(() => { window.scrollTo(0, 0); setAppHeight(); }, 300);

  tickClock();
  setInterval(tickClock, 30000);
  startPolling();
}
// iOS Safari's address bar/toolbar showing or hiding changes the actual
// visible viewport height in ways 100vh (and even 100dvh, inconsistently)
// don't always track correctly, which is what caused the app shell to
// leave a blank gap above the bottom tab bar. Computing it directly and
// keeping it updated is the reliable fix. window.innerHeight alone isn't
// enough, though -- on iOS Safari it often doesn't change at all when the
// on-screen keyboard opens or closes (only the *visual* viewport does),
// which is exactly the moment that left vertically-centered screens like
// the login/gate forms looking shifted after typing. visualViewport
// tracks that correctly where it's available.
function setAppHeight(){
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

// Most save actions (logging items, marking delivered, adding a customer,
// etc.) don't have their own try/catch around withFreshShipments/
// withFreshTrips -- on a total connection failure (after apiSet's own
// retries are exhausted) they'd fail completely silently: no error, no
// indication anything went wrong, the tap just seems to do nothing. This
// is a last-resort net so that never happens. It won't double up with
// spots that already catch their own errors (like the off-island delivery
// form), since a caught rejection never reaches here.
window.addEventListener('unhandledrejection', (event) => {
  console.error('Unhandled promise rejection:', event.reason);
  alert('Something didn\'t save. Check your connection and try again.');
});

// Tapping the logo reloads the page at the exact URL currently open --
// since the logged-in session (owner/staff/manager/customer) lives in the
// URL hash, a plain reload lands back in the same place, signed in, rather
// than resetting to a generic default screen.
function handleLogoTap(){
  const shell = document.querySelector('.shell');
  if(shell && (shell.classList.contains('header-collapsed') || shell.classList.contains('settings-active'))){
    const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
    if(scrollable && scrollable.scrollTop > 0){
      scrollable.scrollTo({ top: 0, behavior: 'smooth' });
      shell.classList.remove('header-collapsed');
      return;
    }
  }
  window.location.reload();
}
document.getElementById('brand-logo-btn')?.addEventListener('click', handleLogoTap);
document.getElementById('settings-corner-logo')?.addEventListener('click', handleLogoTap);

init();
</script>
