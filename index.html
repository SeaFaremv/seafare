/* ---------------- Admin notification polling + banner ----------------
   There's no push-notification backend here -- no service worker, no
   Web Push subscriptions, nothing that could wake a fully closed browser
   or app. What this DOES cover: any device where the Super Admin is
   currently logged in with this tab open (foreground or backgrounded,
   not closed) gets checked every ~25s, and a genuinely new unread
   notification triggers both an in-page banner (always works) and a
   real OS-level Notification via the browser's Notification API (works
   on desktop and Android Chrome; iOS Safari only honors this inside an
   installed home-screen PWA, not a normal browser tab -- there's no way
   around that from here, it's a platform restriction). A real "wakes a
   closed app" push would need a service worker + Web Push backend this
   project doesn't have yet. */
let adminNotifPollTimer = null;
let adminKnownNotifIds = new Set();
let adminNotifPollPrimed = false;
let _adminBaseTitle = null;

function startAdminNotificationPolling(){
  if(adminNotifPollTimer) return;
  adminNotifPollPrimed = false;
  adminKnownNotifIds = new Set();
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    Notification.requestPermission().catch(() => {});
  }
  pollAdminNotificationsOnce();
  adminNotifPollTimer = setInterval(pollAdminNotificationsOnce, 25000);
}
function stopAdminNotificationPolling(){
  if(adminNotifPollTimer){ clearInterval(adminNotifPollTimer); adminNotifPollTimer = null; }
  updateAdminTabTitleBadge(0);
}
async function pollAdminNotificationsOnce(){
  if(!state.adminAuthed){ stopAdminNotificationPolling(); return; }
  let notifs;
  try{
    const data = await adminFetch('/api/admin/notifications');
    notifs = data.notifications || [];
  }catch(e){ console.error('admin notification poll failed', e); return; }
  state.adminNotifications = notifs;
  const unread = notifs.filter(n => !n.read);
  if(!adminNotifPollPrimed){
    // First check after logging in -- just learn what's already there
    // silently, so existing unread notifications don't all bannered at
    // once the moment admin signs in.
    notifs.forEach(n => adminKnownNotifIds.add(n.id));
    adminNotifPollPrimed = true;
  } else {
    const newOnes = unread.filter(n => !adminKnownNotifIds.has(n.id));
    notifs.forEach(n => adminKnownNotifIds.add(n.id));
    newOnes.forEach(n => showAdminNotificationBanner(n));
  }
  updateAdminTabTitleBadge(unread.length);
  if(document.getElementById('admin-body') && state.adminTab === 'notifications' && !state.adminOrgDetailId){
    renderAdminDashboard();
  }
}
function updateAdminTabTitleBadge(unreadCount){
  if(_adminBaseTitle == null) _adminBaseTitle = document.title.replace(/^\(\d+\)\s*/, '');
  document.title = unreadCount > 0 ? `(${unreadCount}) ${_adminBaseTitle}` : _adminBaseTitle;
}
function createAdminBannerStack(){
  let stack = document.getElementById('admin-banner-stack');
  if(stack) return stack;
  stack = document.createElement('div');
  stack.id = 'admin-banner-stack';
  stack.style.cssText = 'position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3000;pointer-events:none;padding:0 16px;';
  document.body.appendChild(stack);
  return stack;
}
function showAdminNotificationBanner(n){
  const typeLabels = { new_signup: 'New Signup', new_boat: 'New Boat', pending_request: 'Pending Request', resignup_after_deletion: '\u26a0 Re-signup After Deletion', pro_request: 'Pro Upgrade Requested', pro_paid_via_swipe: '\u2705 Paid via Swipe' };
  const title = typeLabels[n.type] || n.type || 'New notification';
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try{
      const native = new Notification('SeaFare Super Admin \u2014 ' + title, { body: n.message || '', tag: 'seafare-admin-' + n.id });
      native.onclick = () => {
        window.focus();
        state.adminTab = 'notifications'; state.adminOrgDetailId = null;
        renderAdminDashboard();
        native.close();
      };
    }catch(e){ /* some browsers reject construction outside a user gesture in certain contexts */ }
  }
  const stack = createAdminBannerStack();
  const el = document.createElement('div');
  el.className = 'admin-notif-banner';
  el.innerHTML = `
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;font-size:13px;">${escapeHtml(title)}</div>
      ${n.message ? `<div style="font-size:12px;opacity:0.9;margin-top:2px;">${escapeHtml(n.message)}</div>` : ''}
    </div>
    <button type="button" aria-label="Dismiss" data-admin-banner-dismiss style="background:none;border:none;color:inherit;font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;">\u2715</button>
  `;
  el.addEventListener('click', (e) => {
    if(e.target.closest('[data-admin-banner-dismiss]')){ el.remove(); return; }
    state.adminTab = 'notifications'; state.adminOrgDetailId = null;
    renderAdminDashboard();
    el.remove();
  });
  stack.appendChild(el);
  setTimeout(() => {
    if(!el.isConnected) return;
    el.classList.add('admin-notif-banner-out');
    setTimeout(() => el.remove(), 300);
  }, 8000);
}

/* ---------------- Web Push (real notifications on a closed/backgrounded
   device) ----------------
   This is the piece that can reach a device even when this tab isn't
   open at all -- unlike the polling above, which only works while the
   tab is alive. Needs three things on the backend before it does
   anything (see BACKEND-CHANGES-NEEDED.md for the exact contract):
     1. A VAPID keypair -- the public half goes in ADMIN_PUSH_VAPID_PUBLIC_KEY
        below, the private half stays server-side only.
     2. POST /api/admin/push-subscribe to store a subscription.
     3. The backend actually calling web-push's sendNotification() to
        every stored subscription at the same moment it creates a new
        admin notification (boat request, org signup, pro request, etc).
   Until all three exist, subscribeAdminToPush() below will register the
   service worker and ask for permission, but the subscription it POSTs
   has nowhere real to go yet -- that call is written against the
   endpoint contract in the spec doc, ready to work the moment the
   backend implements it. */
const ADMIN_PUSH_VAPID_PUBLIC_KEY = 'BOWeAWH_VWxCKgUB1gZDDWgTw27KWZqxGxndX45xxXPMio_9PIuFbdbY-_U2pZGveNblcWZWuZsyLWgj_axoqL0';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function subscribeAdminToPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert(t('Push notifications aren\u2019t supported in this browser.'));
    return false;
  }
  if(ADMIN_PUSH_VAPID_PUBLIC_KEY === 'REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY'){
    console.warn('Web Push not configured yet -- see BACKEND-CHANGES-NEEDED.md');
    alert(t('Push notifications aren\u2019t set up on the server yet.'));
    return false;
  }
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') return false;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(ADMIN_PUSH_VAPID_PUBLIC_KEY)
      });
    }
    await fetch(`${API_BASE}/api/admin/push-subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: state.adminUsername, passkey: state.adminPasskey, subscription: sub.toJSON() })
    });
    return true;
  }catch(e){
    console.error('subscribeAdminToPush failed', e);
    return false;
  }
}

// Every suspend/unsuspend/delete action in the admin dashboard routes
// through here first -- re-typing the password is a deliberate extra
// confirmation step on top of the fact that every admin API call already

const DEFAULT_SUSPEND_NOTE = 'Suspended due to unpaid payments.';

function showMessageBox(title, message){

  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `

  `;
  document.body.appendChild(overlay);

  document.getElementById('message-box-close').addEventListener('click', close);

function confirmAdminAction(label, onConfirm, withNote){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2400;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel admin-popup-panel" style="max-width:360px;width:100%;">
      <h3 style="margin-bottom:6px;">Confirm: ${escapeHtml(label)}</h3>
      ${withNote ? `
        <label>${t("Reason (shown to the organization)")}</label>
        <textarea id="admin-confirm-note" rows="2" placeholder="${t("e.g. Overdue payment for additional boat")}">${escapeHtml(DEFAULT_SUSPEND_NOTE)}</textarea>
      ` : ''}
      <p class="sub" style="margin-bottom:12px;">${t("Re-enter your Super Admin password to continue.")}</p>
      <input type="password" id="admin-confirm-password" placeholder="${t("Password")}">
      <div class="pin-error" id="admin-confirm-error"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-ghost" id="admin-confirm-cancel" style="flex:1;">${t("Cancel")}</button>
        <button class="btn btn-danger" id="admin-confirm-go" style="flex:1;">${t("Confirm")}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  if(withNote){
    const noteEl = document.getElementById('admin-confirm-note');
    noteEl.addEventListener('focus', () => {
      if(noteEl.value === DEFAULT_SUSPEND_NOTE) noteEl.value = '';
    }, { once: true });
  }
  const input = document.getElementById('admin-confirm-password');
  input.focus();
  const close = () => overlay.remove();
  document.getElementById('admin-confirm-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  const go = async () => {
    const errorEl = document.getElementById('admin-confirm-error');
    if(input.value !== state.adminPasskey){
      errorEl.textContent = 'Incorrect password.';
      return;
    }
    const btn = document.getElementById('admin-confirm-go');
    btn.disabled = true; btn.textContent = 'Working\u2026';
    const note = withNote ? document.getElementById('admin-confirm-note').value.trim() : undefined;
    try{
      await onConfirm(note);
      close();
    }catch(e){
      errorEl.textContent = 'Something went wrong. Try again.';
      btn.disabled = false; btn.textContent = t('Confirm');
    }
  };
  document.getElementById('admin-confirm-go').addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

// Pro status block shown once per organization (not repeated per boat --
// Pro is org-wide now) inside the org detail popup below.
function renderAdminOrgProBlock(orgId){
  const org = (state.adminOrgs || []).find(o => o.id === orgId);
  if(!org) return `<div class="tag-meta" style="color:var(--red);">Could not check Pro status.</div>`;
  const active = org.is_pro && (!org.pro_expires_at || new Date(org.pro_expires_at).getTime() > Date.now());
  const lapsed = org.is_pro && !active;
  const statusPill = active
    ? `<span class="status-pill status-delivered">Pro until ${escapeHtml(fmtDMY((org.pro_expires_at||'').slice(0,10)))}</span>`
    : `<span class="status-pill status-pending">Free</span>`;
  return `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      ${statusPill}
      ${lapsed ? `<span class="tag-meta" style="color:var(--red);">(expired)</span>` : ''}
    </div>
    <div style="display:flex;gap:6px;width:100%;margin-top:6px;">
      <button class="btn btn-primary" style="flex:1;padding:7px 10px;font-size:12px;" data-admin-approve-pro="${orgId}">${active ? 'Renew Pro (+30 days)' : 'Grant Pro (30 days)'}</button>
      ${active ? `<button class="btn btn-ghost" style="flex:1;padding:7px 10px;font-size:12px;" data-admin-revoke-pro="${orgId}">Revoke Pro</button>` : ''}
    </div>
  `;
}
function wireAdminOrgProButtons(){
  document.querySelectorAll('[data-admin-approve-pro]').forEach(btn => {
    if(btn._proWired) return; btn._proWired = true;
    btn.addEventListener('click', () => {
      const orgId = btn.dataset.adminApprovePro;
      confirmAdminAction('Grant/renew Pro for this organization (30 days) \u2014 shared by every boat, owner, manager, and staff under it, and this also clears any pending transfer-slip request', async () => {
        await adminApproveProForOrganization(orgId);
        state.adminOrgs = null; state.adminProRequests = null;
        await loadAdminOrgs();
        openAdminOrgPopup(orgId);
      });
    });
  });
  document.querySelectorAll('[data-admin-revoke-pro]').forEach(btn => {
    if(btn._proWired) return; btn._proWired = true;
    btn.addEventListener('click', () => {
      const orgId = btn.dataset.adminRevokePro;
      confirmAdminAction('Revoke Pro for this organization \u2014 every boat under it loses Pro access', async () => {
        await adminRevokeProForOrganization(orgId);
        state.adminOrgs = null;
        await loadAdminOrgs();
        openAdminOrgPopup(orgId);
      });
    });
  });
}

// Super Admin Settings popup -- login credentials, the bank account shown
// to owners in the Pro upgrade payment popup, and which notification types
// should reach the admin (now actually enforced server-side by
// notifyAdmin, not just stored).
const ADMIN_NOTIFY_TOGGLES = [
  { key: 'notifyNewSignups', label: 'New signups (and re-signups after deletion)' },
  { key: 'notifyBoatRequests', label: 'Additional-boat requests' },
  { key: 'notifyNewBoats', label: 'New boats created' },
  { key: 'notifyProRequests', label: 'Pro upgrade requests (bank transfer)' },
  { key: 'notifyProPayments', label: 'Pro paid via Swipe' },
];
function openAdminSettingsPopup(){
  closeAdminSettingsPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'admin-settings-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2300;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel admin-popup-panel" id="admin-settings-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:460px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;">
        <h3 style="margin-bottom:2px;">Super Admin Settings</h3>
        <button type="button" class="btn btn-ghost" id="admin-settings-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <div id="admin-settings-popup-body"><div class="note">Loading\u2026</div></div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeAdminSettingsPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('admin-settings-popup-close-btn').addEventListener('click', closeAdminSettingsPopup);
  renderAdminSettingsPopupBody();
}
function closeAdminSettingsPopup(){
  const overlay = document.getElementById('admin-settings-popup-overlay');
  if(overlay) unlockBodyScroll();
  overlay?.remove();
}
async function renderAdminSettingsPopupBody(){
  const body = document.getElementById('admin-settings-popup-body');
  if(!body) return;
  let settings;
  try{
    const data = await adminFetch('/api/admin/settings');
    if(!data.ok) throw new Error(data.error || 'Could not load settings.');
    settings = data.settings;
  }catch(e){
    console.error('load admin settings failed', e);
    body.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">Could not load settings. Try again.</div>`;
    return;
  }
  if(!document.getElementById('admin-settings-popup-body')) return; // popup closed while loading

  body.innerHTML = `
    <div class="tag-label" style="margin-bottom:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;">Login Credentials</div>
    <label style="margin-top:2px;">Username</label>
    <input type="text" id="as-username" value="${escapeHtml(settings.username || '')}">
    <label style="margin-top:6px;">New Password</label>
    <input type="password" id="as-password" placeholder="At least 6 characters">
    <p class="tag-meta" style="margin-top:4px;">Leave blank if you only want to change the username \u2014 but changing either one still requires typing a new password here (this is what the server checks against).</p>
    <button class="btn btn-primary" id="as-credentials-save-btn" style="width:100%;margin-top:8px;">Save Credentials</button>
    <div id="as-credentials-status" class="tag-meta" style="margin-top:6px;"></div>

    <div class="tag-label" style="margin:16px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;">Bank Account (shown to owners in the Pro payment popup)</div>
    <label>Account Name</label>
    <input type="text" id="as-bank-name" value="${escapeHtml(settings.bankAccountName || '')}">
    <label style="margin-top:6px;">Account Number</label>
    <input type="text" id="as-bank-number" value="${escapeHtml(settings.bankAccountNumber || '')}">
    <button class="btn btn-primary" id="as-bank-save-btn" style="width:100%;margin-top:8px;">Save Bank Account</button>
    <div id="as-bank-status" class="tag-meta" style="margin-top:6px;"></div>

    <div class="tag-label" style="margin:16px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;">Notify Me About</div>
    ${ADMIN_NOTIFY_TOGGLES.map(t => `
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:8px;">
        <input type="checkbox" id="as-notify-${t.key}" ${settings[t.key] ? 'checked' : ''} style="width:auto;">
        ${escapeHtml(t.label)}
      </label>
    `).join('')}
    <button class="btn btn-primary" id="as-notify-save-btn" style="width:100%;margin-top:4px;">Save Notification Preferences</button>
    <div id="as-notify-status" class="tag-meta" style="margin-top:6px;"></div>
  `;

  document.getElementById('as-credentials-save-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('as-credentials-status');
    const newUsername = document.getElementById('as-username').value.trim();
    const newPassword = document.getElementById('as-password').value;
    if(!newUsername){ statusEl.textContent = 'Username is required.'; return; }
    if(!newPassword || newPassword.length < 6){ statusEl.textContent = 'Type a new password (at least 6 characters) to save changes.'; return; }
    statusEl.textContent = 'Saving\u2026';
    try{
      const data = await adminFetch('/api/admin/settings/credentials', { method:'POST', body:{ newUsername, newPassword } });
      if(!data.ok) throw new Error(data.error || 'Could not save.');
      // The password just changed -- this device's saved admin session
      // needs the new one too, or the next request gets rejected as
      // unauthorized.
      state.adminUsername = newUsername;
      state.adminPasskey = newPassword;
      saveAdminSession(newUsername, newPassword);
      statusEl.textContent = 'Saved.';
      document.getElementById('as-password').value = '';
    }catch(e){
      console.error(e);
      statusEl.textContent = 'Could not save. Try again.';
    }
  });

  document.getElementById('as-bank-save-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('as-bank-status');
    const bankAccountName = document.getElementById('as-bank-name').value.trim();
    const bankAccountNumber = document.getElementById('as-bank-number').value.trim();
    statusEl.textContent = 'Saving\u2026';
    try{
      const data = await adminFetch('/api/admin/settings/bank', { method:'POST', body:{ bankAccountName, bankAccountNumber } });
      if(!data.ok) throw new Error(data.error || 'Could not save.');
      statusEl.textContent = 'Saved.';
    }catch(e){
      console.error(e);
      statusEl.textContent = 'Could not save. Try again.';
    }
  });

  document.getElementById('as-notify-save-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('as-notify-status');
    const body = {};
    ADMIN_NOTIFY_TOGGLES.forEach(t => { body[t.key] = document.getElementById(`as-notify-${t.key}`).checked; });
    statusEl.textContent = 'Saving\u2026';
    try{
      const data = await adminFetch('/api/admin/settings/notifications', { method:'POST', body });
      if(!data.ok) throw new Error(data.error || 'Could not save.');
      statusEl.textContent = 'Saved.';
    }catch(e){
      console.error(e);
      statusEl.textContent = 'Could not save. Try again.';
    }
  });
}

              ${!n.read ? `<span class="status-pill" style="background:var(--teal);color:#fff;">New</span>` : ''}

          </button>

      document.getElementById('admin-enable-push-btn').addEventListener('click', async () => {
        const btn = document.getElementById('admin-enable-push-btn');
        btn.disabled = true; btn.textContent = t('Enabling\u2026');

      });
      document.getElementById('admin-notif-mark-all-btn')?.addEventListener('click', async () => {
        state.adminNotifications.forEach(n => n.read = true);
        renderAdminDashboard();
        try{ await adminFetch('/api/admin/notifications/read-all', { method:'POST' }); }catch(e){ console.error(e); }
      });
      body.querySelectorAll('[data-notif-id]').forEach(btn => btn.addEventListener('click', async () => {
        const n = state.adminNotifications.find(x => x.id === btn.dataset.notifId);
        if(!n || n.read) return;
        n.read = true;
        renderAdminDashboard();
        try{ await adminFetch(`/api/admin/notifications/${btn.dataset.notifId}/read`, { method:'POST' }); }catch(e){ console.error(e); }
      }));
    })();
  }
}

const SIGNUP_FIELD_IDS = ['su-boat-name','su-owner-name','su-contact','su-mobile','su-gmail','su-bank-name','su-bank-number','su-routes','su-tracking','su-viber','su-social','su-passkey'];
function clearFieldErrors(ids){ ids.forEach(id => document.getElementById(id)?.classList.remove('field-error')); }
function markFieldError(id, clearValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('field-error');
  if(clearValue) el.value = '';
}

async function submitSignup(){
  const val = (id) => (document.getElementById(id).value || '').trim();
  const errorEl = document.getElementById('su-error');
  const btn = document.getElementById('su-submit-btn');
  clearFieldErrors(SIGNUP_FIELD_IDS);

  const body = {
    boatName: val('su-boat-name'),
    ownerName: val('su-owner-name'),
    contactNumber: val('su-contact'),
    mobile: val('su-mobile'),
    gmail: val('su-gmail'),
    bankAccountName: val('su-bank-name'),
    bankAccountNumber: val('su-bank-number'),
    routes: val('su-routes').split('\n').map(s=>s.trim()).filter(Boolean),
    trackingLink: val('su-tracking'),
    viberLink: val('su-viber'),
    socialLinks: val('su-social').split('\n').map(s=>s.trim()).filter(Boolean),
    passkey: val('su-passkey'),
  };

  const requiredMap = { boatName:'su-boat-name', ownerName:'su-owner-name', contactNumber:'su-contact', mobile:'su-mobile', passkey:'su-passkey' };
  const missing = Object.keys(requiredMap).filter(k => !body[k]);
  if(missing.length){
    missing.forEach(k => markFieldError(requiredMap[k], false));
    errorEl.textContent = 'Please fill in all fields marked *.';
    return;
  }
  if(body.passkey.length < 6){
    markFieldError('su-passkey', true);
    errorEl.textContent = 'PIN must be at least 6 characters.';
    return;
  }
  if(!isValidMaldivesMobile(body.mobile)){
    markFieldError('su-mobile', false);
    errorEl.textContent = 'Invalid mobile number \u2014 must start with 7 or 9 and have 7 digits.';
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  try{
    const res = await fetch(`${API_BASE}/api/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = t('Create My Boat');
    if(res.ok && data.ok){
      state.orgSignupTotpSecret = data.totpSecret;
      state.orgAuthed = true;
      state.orgPasskey = body.passkey;
      state.orgData = {
        id: data.organizationId, boatName: body.boatName, ownerName: body.ownerName,
        contactNumber: body.contactNumber, gmail: body.gmail, mobile: body.mobile,
        bankAccountName: body.bankAccountName, bankAccountNumber: body.bankAccountNumber,
        trackingLink: body.trackingLink, viberLink: body.viberLink,
        socialLinks: body.socialLinks, routes: body.routes,
      };
      state.orgBoats = [{ id: data.boatId, name: body.boatName, is_primary: true, status: 'active' }];
      renderOrgArea();
    } else {
      const msg = (data && data.error) || 'Could not create your account.';
      errorEl.textContent = msg;
      if(/boat name/i.test(msg)) markFieldError('su-boat-name', true);
    }
  }catch(e){
    console.error('signup failed', e);
    btn.disabled = false; btn.textContent = t('Create My Boat');
    errorEl.textContent = 'Something went wrong. Try again.';
  }
}

        renderOrgArea();
      } else {
        if(res.status === 403){
          errorEl.textContent = '';
          const warning = suspensionDeleteWarning(data && data.suspendedAt);
          const parts = [(data && data.error) || 'This account has been suspended.'];
          if(data && data.note) parts.push(`Reason given: "${data.note}"`);
          if(warning) parts.push(warning);
          showMessageBox('Account Suspended', parts.join('\n\n'));
        } else {
          errorEl.textContent = (data && data.error) || 'Login failed.';
        }
        markFieldError('ol-boat-name', false);
        markFieldError('ol-passkey', true);
      }
    }catch(e){
      console.error('org login failed', e);
      btn.disabled = false; btn.textContent = t('Log In');
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  };
  document.getElementById('ol-submit-btn').addEventListener('click', submit);
  document.getElementById('ol-passkey').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });
  document.getElementById('ol-signup-instead-btn').addEventListener('click', () => { state.orgScreen = 'signup'; state.orgError=''; renderOrgArea(); });
  document.getElementById('ol-back-btn').addEventListener('click', orgBackToStart);
}

/* ---------------- Routing ---------------- */
function handleHash(){
  renderLangToggle();
  applyStaticTranslations();
  const h = (location.hash || '').replace('#','');
  applyHomeScreenBranding(h);

  if(h === 'admin' || h.startsWith('admin/')){
    state.entryMode = 'admin';
    if(state.lang !== 'en'){
      state.lang = 'en';
      applyLangDirection();
      applyStaticTranslations();
    }
    renderAdmin();
    return;
  }

  if(h === 'signup'){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'signup';
    renderOrgArea();
    return;
  }
  if(h === 'org' || h.startsWith('org/')){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;
  }

  if(h.startsWith('reset-pin/')){
    const token = decodeURIComponent(h.slice('reset-pin/'.length));
    state.entryMode = 'internal'; state.gateRole = 'owner'; state.role = null;
    state.gateStage = 'reset-confirm'; state.resetToken = token;
    state.resetMsg = ''; state.resetError = '';
    render();
    return;
  }

  if(h === OWNER_HASH || h.startsWith(OWNER_HASH + '/')){
    // The numeric Owner PIN gate is retired -- Owners authenticate
    // exclusively through #org (boat name + passkey) now, which is real
    // authentication rather than a light PIN gate. Any #owner link just
    // sends them to the real login screen.
    location.hash = 'org';
    return;
  }
  if(h === INTERNAL_HASH || h.startsWith(INTERNAL_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This staff link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'staff')){
      state.entryMode = 'internal'; state.gateRole = 'staff'; state.role = null; state.gateStage = 'pick'; state.gateMode = 'signin';
      if(switchingBoat) clearSession('staff');
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }
  if(h === MANAGER_HASH || h.startsWith(MANAGER_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This manager link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'manager')){
      state.entryMode = 'internal'; state.gateRole = 'manager'; state.role = null; state.gateStage = 'pick';
      if(switchingBoat) clearSession('manager');
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  // Customer entry (senders/receivers) is boat-scoped via #c/<boatId>, same
  // as owner/staff links -- each boat needs its own QR code / shared link
  // now that this is a multi-boat platform.
  if(h === 'c' || h.startsWith('c/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This link is missing a boat reference. Ask the boat owner for the correct customer check-in link.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    state.entryMode = 'customer';
    if(!state.role || switchingBoat){ state.role = 'sender'; state.tab = 'checkin'; }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  if(state.entryMode === 'internal' && INTERNAL_ROLES.includes(state.role)){
    if(getRoleTabs()[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    render();
    return;
  }

  // Continuing navigation within an already-active customer session (tab
  // clicks, mode toggle, etc all just set location.hash to a plain tab id).
  if(state.entryMode === 'customer' && state.role){
    if(getRoleTabs()[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }

  // Anything else unrecognized -- including the bare URL -- shows the
  // landing page rather than guessing at a boat to drop the visitor into.
  renderLandingPage();
}

// Tap-to-copy for every link box shown anywhere in the app (Owner Links,
// Staff Links, Manager Links, Customer Check-In Link, etc) -- one delegated
// listener covers all of them regardless of which screen renders them.
document.body.addEventListener('click', (e) => {
  const box = e.target.closest('.url-box');
  if(!box) return;
  const linkEl = box.querySelector('.u');
  if(!linkEl) return;
  const text = linkEl.textContent;
  const showCopied = () => {
    const label = box.querySelector('.tag-label');
    if(!label) return;
    const original = label.dataset.originalText || label.textContent;
    label.dataset.originalText = original;
    label.textContent = 'Copied!';
    label.style.color = 'var(--teal)';
    setTimeout(() => { label.textContent = original; label.style.color = ''; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showCopied(); }catch(err){}
      ta.remove();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showCopied(); }catch(err){}
    ta.remove();
  }
});

// Polling is the main data cost on a slow connection -- shipments carry
// embedded loading photos, so re-fetching them every few seconds on 3G
// both burns data and, worse, can queue up requests faster than 3G can
// finish them, which is what actually made the app feel broken rather
// than just slow. This: (1) skips starting a new poll while one is still
// in flight, (2) backs off the interval on a detected slow connection,
// and (3) skips entirely while offline instead of firing a doomed request.
//
// startPolling() is safe to call from any entry point that lands someone
// in the dispatch view, not just the bottom of init() -- it's idempotent
// (a second call is a no-op), which matters because several entry points
// (a returning owner's session resumed directly, and the org dashboard's
// "Open Dispatch" button that every freshly-signed-up boat goes through)
// used to skip polling setup entirely, leaving those sessions with no
// live updates from other devices until a manual reload.
let pollInFlight = false;
let pollingStarted = false;
let pollCycleCount = 0;
function currentPollIntervalMs(){
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const type = conn && conn.effectiveType;
  if(type === 'slow-2g' || type === '2g') return 45000;
  if(type === '3g') return 20000;
  return 8000;
}
async function pollCycle(){
  if(pollInFlight || !navigator.onLine){ scheduleNextPoll(); return; }
  pollInFlight = true;
  pollCycleCount++;
  try{
    // Settings (routes, staff PINs, bank details, social links) change far
    // less often than shipments do -- checking it on every single poll
    // wastes a request almost every time for data that's usually
    // identical to what's already known. Only check every 5th cycle
    // (roughly every 40s on a fast connection, up to a few minutes on a
    // slow one) -- shipments still poll every cycle unchanged, since that
    // data genuinely does change often during active dispatch.
    const shouldCheckSettings = pollCycleCount % 5 === 1;
    const [liteShipments, freshSettings] = await Promise.all([
      loadShipmentsLite(),
      shouldCheckSettings ? loadSettings() : Promise.resolve(state.settings)
    ]);
    // The lite fetch deliberately omits photos -- merge in whatever
    // we already have locally before comparing/adopting, otherwise
    // every shipment would look "changed" purely because its photo
    // field is missing, not because anything real changed. The
    // tradeoff: if someone retakes a photo on another device, this
    // device won't pick up the new one via polling alone -- only a
    // full reload or an action that specifically re-fetches that
    // shipment will. Acceptable given how rarely photos get retaken
    // versus how often polling runs.
    const localPhotosById = {};
    state.shipments.forEach(s => { if(s.photo) localPhotosById[s.id] = s.photo; });
    const freshShipments = liteShipments.map(s => localPhotosById[s.id] ? Object.assign({}, s, { photo: localPhotosById[s.id] }) : s);
    const shipmentsChanged = JSON.stringify(freshShipments) !== JSON.stringify(state.shipments);
    const settingsChanged = shouldCheckSettings && JSON.stringify(freshSettings) !== JSON.stringify(state.settings);
    if(shipmentsChanged) state.shipments = freshShipments;
    if(settingsChanged) state.settings = freshSettings;
    if(shipmentsChanged || settingsChanged){
      const typingInField = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.getElementById('panel').contains(document.activeElement);
      const hasOpenForm = typingInField || state.addCustomerOpen;
      if(settingsChanged) updateHeaderProBadge();
      if(state.role && !hasOpenForm && (state.tab === 'dashboard' || state.tab === 'track' || state.tab === 'settings')){ render(); }
      else if(state.role){ renderTabs(); }
    }
    // Roughly every 20th poll cycle (a few minutes, not every single poll
    // -- checking timestamps doesn't need to happen that often for a
    // 3-hour threshold) check whether any delivered shipment's photo
    // retention window has passed.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 3){
      cleanupExpiredDeliveryPhotos().catch(e => console.error('photo cleanup failed', e));
    }
    // Same idea, offset to a different cycle so the two don't both fire at
    // once -- checks whether any delivered+paid shipment has passed its
    // 12-hour retention window and folds/removes it if so.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 13){
      cleanupCompletedShipments().catch(e => console.error('completed-shipment cleanup failed', e));
    }
  } finally {
    pollInFlight = false;
    scheduleNextPoll();
  }
}
function scheduleNextPoll(){
  setTimeout(pollCycle, currentPollIntervalMs());
}
function startPolling(){

  pollingStarted = true;
  scheduleNextPoll();
}

async function init(){
  // In-app browsers (Viber, WhatsApp, Messenger, etc. opening a shared
  // link) run their own embedded webview with its own toolbar chrome,
  // which behaves differently from Safari/Chrome and can leave the page
  // scrolled to a stale position on first load, or settle its own chrome
  // height a moment after the page first paints. Both get corrected here.
  window.scrollTo(0, 0);

  // Which role, if any, does the current hash itself name? Direct role
  // links only ever resume from that same role's own saved session --
  // never another role's, even if one happens to be saved on this device.
  // A hash that doesn't name a role at all (e.g. #dashboard/#settings,
  // which only occur mid-session -- reaching one on a fresh load means a
  // refresh happened while an internal tab was open) falls back to
  // whichever role was last active, since there's nothing else to go on.
  const rawHash = (location.hash || '').replace('#','');
  let hashRole = null;
  if(rawHash === OWNER_HASH || rawHash.startsWith(OWNER_HASH + '/')) hashRole = 'owner';
  else if(rawHash === INTERNAL_HASH || rawHash.startsWith(INTERNAL_HASH + '/')) hashRole = 'staff';
  else if(rawHash === MANAGER_HASH || rawHash.startsWith(MANAGER_HASH + '/')) hashRole = 'manager';
  const resumeRole = hashRole || loadLastActiveRole();
  const session = resumeRole ? loadSession(resumeRole) : null;
  applyHomeScreenBranding(rawHash);

  // Figure out which boat's data to load BEFORE fetching anything -- from
  // the URL if it names one (#owner/<boatId> or #staff/<boatId>), else from
  // a saved session, else the default fallback set above.
  let boatIdFromHash = null;
  if(rawHash.startsWith(OWNER_HASH + '/')) boatIdFromHash = rawHash.slice(OWNER_HASH.length + 1);
  else if(rawHash.startsWith(INTERNAL_HASH + '/')) boatIdFromHash = rawHash.slice(INTERNAL_HASH.length + 1);
  else if(rawHash.startsWith(MANAGER_HASH + '/')) boatIdFromHash = rawHash.slice(MANAGER_HASH.length + 1);
  else if(rawHash.startsWith('c/')) boatIdFromHash = rawHash.slice(2);
  if(boatIdFromHash) CURRENT_BOAT_ID = boatIdFromHash;
  else if(session && session.boatId) CURRENT_BOAT_ID = session.boatId;

  await refreshData();
  hideStartupLoading();
  resumeGpsTrackingIfAny();

  const initialHash = rawHash;
  if(initialHash === 'admin' || initialHash.startsWith('admin/')){
    state.entryMode = 'admin';
    state.lang = 'en';
    applyLangDirection();
    applyStaticTranslations();
    const adminSession = loadAdminSession();
    if(adminSession && adminSession.username && adminSession.passkey){
      state.adminAuthed = true;
      state.adminUsername = adminSession.username;
      state.adminPasskey = adminSession.passkey;
      startAdminNotificationPolling();
    }
    renderAdmin();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  // A refresh should never log someone out. If we're about to show the
  // org login/landing screen but a valid owner session already exists for
  // a specific boat, resume straight into that boat's app instead. Always
  // checks the OWNER session specifically here (never staff/manager) --
  // this is the org login screen, so only an owner session is relevant.
  const ownerSessionForOrgResume = (initialHash === 'org' || initialHash === '') ? loadSession('owner') : null;
  if(ownerSessionForOrgResume && ownerSessionForOrgResume.boatId){
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    history.replaceState(null,'','#'+OWNER_HASH+'/'+ownerSessionForOrgResume.boatId);
    render();
    tickClock();
    setInterval(tickClock, 30000);
    startPolling();
    return;
  }

  if(initialHash === 'signup' || initialHash === 'org' || initialHash.startsWith('org/')){
    state.entryMode = 'org';
    state.orgScreen = initialHash === 'signup' ? 'signup' : 'login';
    renderOrgArea();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  const isResetLink = rawHash.startsWith('reset-pin/');
  const isCustomerLink = rawHash === 'c' || rawHash.startsWith('c/');
  // A stored session must only auto-log-in if it's for the SAME boat being
  // requested -- otherwise clicking someone else's #owner/<boatId> link
  // while already signed into a different boat would silently grant owner
  // access to that other boat without ever checking its PIN. An explicit
  // #c/<boatId> customer link must always win regardless of any saved
  // internal session too -- otherwise testing your own customer check-in
  // link while logged in as Owner on the same browser silently redirects
  // straight to the Owner Dashboard instead of the customer form.
  const sessionMatchesRequestedBoat = !boatIdFromHash || (session && session.boatId === boatIdFromHash);
  if(!isResetLink && !isCustomerLink && session && (session.role === 'owner' || session.role === 'staff' || session.role === 'manager') && sessionMatchesRequestedBoat){
    // Re-check the session still makes sense (e.g. a staff/manager PIN
    // could have been removed from another device while this one stayed
    // logged in).
    const stillValid = session.role === 'owner'
      ? true
      : session.role === 'manager'
        ? !session.staffName || (state.settings.managerUsers||[]).some(u => u.name === session.staffName)
        : !session.staffName || (state.settings.staffUsers||[]).some(u => u.name === session.staffName);
    if(stillValid){
      state.entryMode = 'internal';
      state.gateRole = session.gateRole || session.role;
      state.role = session.role;
      state.staffName = session.staffName;
      const h = rawHash;
      const tabs = getRoleTabs()[state.role].map(t => t.id);
      state.tab = tabs.includes(h) ? h : DEFAULT_TAB[state.role];
      if(('#'+state.tab) !== location.hash) history.replaceState(null,'','#'+state.tab);
      render();
    } else {
      clearSession(resumeRole);
      handleHash();
    }
  } else {
    if(!sessionMatchesRequestedBoat) clearSession(resumeRole);
    handleHash();
  }

  setTimeout(() => { window.scrollTo(0, 0); setAppHeight(); }, 300);

  tickClock();
  setInterval(tickClock, 30000);
  startPolling();
}
// iOS Safari's address bar/toolbar showing or hiding changes the actual
// visible viewport height in ways 100vh (and even 100dvh, inconsistently)
// don't always track correctly, which is what caused the app shell to
// leave a blank gap above the bottom tab bar. Computing it directly and
// keeping it updated is the reliable fix. window.innerHeight alone isn't
// enough, though -- on iOS Safari it often doesn't change at all when the
// on-screen keyboard opens or closes (only the *visual* viewport does),

// the login/gate forms looking shifted after typing. visualViewport

// etc.) don't have their own try/catch around withFreshShipments/

// Every <select> in the app opens this themed bottom-sheet list instead of
// the browser's own native picker popup (which can't be restyled to match
// the app -- that's an OS-drawn overlay, not something CSS reaches). This
// is wired once globally via event delegation on document, rather than
// per-element, since selects get torn down and recreated by innerHTML on
// every re-render -- delegation means new ones are covered automatically
// with no re-wiring needed anywhere else in the app.
// Shared by every dropdown in the app (both the plain <select> menus below
// and the island search popup further down): scrolls whichever field was
// tapped up to the top of the scrollable area first -- so there's room
// for the list (and, for text fields, the keyboard) underneath it -- then
// pins the dropdown directly below that field at the same width, sized to
// fit in whatever space is actually left above the keyboard/screen edge.
function scrollFieldToTop(field){
  const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
  if(!scrollable) return;
  const fieldRect = field.getBoundingClientRect();
  const scrollableRect = scrollable.getBoundingClientRect();
  const offset = fieldRect.top - scrollableRect.top - 14;
  if(Math.abs(offset) > 2) scrollable.scrollTop += offset;

let _anchoredDropdownMenu = null;

function positionAnchoredDropdown(menu, field){
  const r = field.getBoundingClientRect();

  menu.style.left = Math.max(8, r.left) + 'px';
  menu.style.width = r.width + 'px';
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.maxHeight = Math.max(120, vh - (r.bottom + 6) - 10) + 'px';

      input.value = `${String(h).padStart(2,'0')}:${String(_timePickerMinute).padStart(2,'0')}`;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      closeTimePicker();
    });
    // Jump each column to its current selection rather than always
    // starting scrolled to the top -- most of the time the field already
    // has a value, and hunting for it near the bottom of a 60-row minute
    // list every time it opens would be tedious.
    requestAnimationFrame(() => {
      menu.querySelectorAll('.tp-col').forEach(colEl => {
        const sel = colEl.querySelector('.tp-selected');
        if(sel) sel.scrollIntoView({ block: 'center' });
      });
    });
  };
  redraw();
  positionPicker();
  _timePickerResizeHandler = positionPicker;
  window.addEventListener('resize', _timePickerResizeHandler);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', _timePickerResizeHandler);
}
function closeTimePicker(){
  document.getElementById('time-picker-overlay')?.remove();
  if(_timePickerResizeHandler){
    window.removeEventListener('resize', _timePickerResizeHandler);
    if(window.visualViewport) window.visualViewport.removeEventListener('resize', _timePickerResizeHandler);
    _timePickerResizeHandler = null;
  }
}

// touchstart is what actually needs intercepting on iOS Safari -- calling
// preventDefault here (before the browser has decided to focus/open the
// native picker) is what stops that native popup from ever appearing, and
// also suppresses the synthetic mousedown/click that would otherwise
// follow, so this alone covers real devices.
document.addEventListener('touchstart', (e) => {
  const sel = isEnhanceableSelect(e.target);
  if(sel){ e.preventDefault(); openCustomSelectMenu(sel); return; }
  const dateInput = isEnhanceableDateInput(e.target);
  if(dateInput){ e.preventDefault(); openDatePicker(dateInput); return; }
  const timeInput = isEnhanceableTimeInput(e.target);
  if(timeInput){ e.preventDefault(); openTimePicker(timeInput); return; }
}, { passive: false, capture: true });
// mousedown covers non-touch input (desktop browser, trackpad, mouse) --
// touch devices won't also fire this once touchstart above has already
// preventDefault-ed the gesture, so the two don't double-open the menu.
document.addEventListener('mousedown', (e) => {
  const sel = isEnhanceableSelect(e.target);
  if(sel){ e.preventDefault(); openCustomSelectMenu(sel); return; }
  const dateInput = isEnhanceableDateInput(e.target);
  if(dateInput){ e.preventDefault(); openDatePicker(dateInput); return; }
  const timeInput = isEnhanceableTimeInput(e.target);
  if(timeInput){ e.preventDefault(); openTimePicker(timeInput); return; }
}, true);

// Themed popup for the two "type to search & add an island" fields (New
// Trip's origin and destinations). Same anchored, field-width look as the
// <select> dropdowns above. With nothing typed it browses the full island
// list grouped by atoll (tap an atoll to expand its islands); typing
// anything switches to a flat, filtered list of matching islands across
// all atolls.
function flatIslandList(){
  return Object.keys(MALDIVES_ATOLLS).flatMap(atoll => MALDIVES_ATOLLS[atoll].map(island => ({ island, atoll })));
}
let _islandSearchExpandedAtoll = null;
function openIslandSearchPopup(input, onPick, opts){
  closeIslandSearchPopup();
  const closeOnPick = !opts || opts.closeOnPick !== false;
  scrollFieldToTop(input);
  const overlay = document.createElement('div');
  overlay.className = 'custom-select-overlay';
  overlay.id = 'island-search-popup-overlay';
  const menu = document.createElement('div');
  menu.className = 'custom-select-menu';
  overlay.appendChild(menu);
  document.body.appendChild(overlay);
  positionAnchoredDropdown(menu, input);
  setAnchoredDropdown(menu, input);
  overlay.addEventListener('mousedown', (e) => {
    if(e.target !== overlay) return;
    e.preventDefault();
    input.blur();
    closeIslandSearchPopup();
  });

  const redraw = () => {
    const q = input.value.trim().toLowerCase();
    if(q){
      const matches = flatIslandList().filter(x => x.island.toLowerCase().includes(q));
      menu.innerHTML = matches.length ? matches.slice(0, 60).map(x => `
        <button type="button" class="custom-select-option" data-pick-island="${escapeHtml(x.island)}">
          <span>${escapeHtml(x.island)}</span><span style="color:rgba(244,249,255,0.55);font-size:12.5px;">${escapeHtml(x.atoll)}</span>
        </button>
      `).join('') : `<div class="custom-select-title" style="padding:16px 22px 20px;">No matching island \u2014 whatever you've typed will be used as-is.</div>`;
    } else {
      menu.innerHTML = Object.keys(MALDIVES_ATOLLS).map(atoll => {
        const open = _islandSearchExpandedAtoll === atoll;
        return `
          <button type="button" class="custom-select-option" data-toggle-atoll="${escapeHtml(atoll)}">
            <span>${escapeHtml(atoll)}</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.15s ease;transform:rotate(${open ? '180deg' : '0deg'});"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          ${open ? MALDIVES_ATOLLS[atoll].map(island => `
            <button type="button" class="custom-select-option" data-pick-island="${escapeHtml(island)}" style="padding-left:40px;background:rgba(255,255,255,0.06);color:rgba(244,249,255,0.88);">
              <span>${escapeHtml(island)}</span>
            </button>
          `).join('') : ''}
        `;
      }).join('');
    }
    menu.querySelectorAll('[data-pick-island]').forEach(b => b.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus/blur ordering predictable on tap
      onPick(b.dataset.pickIsland);
      if(closeOnPick){ input.blur(); closeIslandSearchPopup(); }
      else { redraw(); }
    }));
    menu.querySelectorAll('[data-toggle-atoll]').forEach(b => b.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const atoll = b.dataset.toggleAtoll;
      _islandSearchExpandedAtoll = _islandSearchExpandedAtoll === atoll ? null : atoll;
      redraw();
    }));
  };
  redraw();
  input._islandSearchRedraw = redraw;

  // Scrolling to browse the list means the keyboard's just in the way now
  // -- dismiss it so the list gets the room, matching how scrolling
  // elsewhere in the app already closes the keyboard. This blur is only
  // to drop the keyboard, though -- the list itself should stay put right
  // where it is, not close along with it, so a flag on the input tells
  // the blur handler in wireIslandSearchDropdown to skip its usual
  // close-the-popup behavior just this once. Once the keyboard actually
  // closes, the visualViewport resize listener above re-runs the anchored
  // positioning, which grows the list into the room the keyboard freed up.
  const dismissKeyboardOnly = () => { input._islandSearchScrollBlur = true; input.blur(); };
  let touchStartY = null;
  menu.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  menu.addEventListener('touchmove', (e) => {
    if(touchStartY === null) return;
    if(Math.abs(e.touches[0].clientY - touchStartY) > 8){ dismissKeyboardOnly(); touchStartY = null; }
  }, { passive: true });
  menu.addEventListener('wheel', dismissKeyboardOnly, { passive: true });
}
function closeIslandSearchPopup(){
  document.getElementById('island-search-popup-overlay')?.remove();
  _islandSearchExpandedAtoll = null;
  clearAnchoredDropdown();
}

applyLangDirection();
applyStaticTranslations();

init();
</script>
</body>
</html>
