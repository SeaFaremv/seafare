  document.body.appendChild(node);
  return node;
}

// Invoice popup -- opens right over whatever screen you're on (no
// navigation), with a fast pop-in animation. Tapping outside closes it and
// leaves you exactly where you were.
function openInvoicePopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeInvoicePopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'invoice-popup-overlay';
  overlay.dataset.shipmentId = shipmentId;
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="invoice-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      ${renderInvoicePopupContent(s)}
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeInvoicePopup(); });
  document.body.appendChild(overlay);
  wireInvoicePopupButtons(shipmentId);
}

// Wires up every button inside the invoice popup's current content --
// pulled out of openInvoicePopup so it can be re-run after refreshing the
// popup's content in place (e.g. right after collecting payment, so it
// flips from Unpaid to Paid without having to close and reopen it).
function wireInvoicePopupButtons(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  document.getElementById('invoice-popup-close-btn').addEventListener('click', closeInvoicePopup);
  document.querySelectorAll('#invoice-popup-overlay [data-copy-number]').forEach(el => el.addEventListener('click', async (e) => {
    e.stopPropagation();
    const number = el.dataset.copyNumber;
    if(!number) return;
    const original = el.textContent;
    try{
      await navigator.clipboard.writeText(number);
      el.textContent = 'Copied!';
    }catch(err){
      el.textContent = 'Could not copy';
    }
    setTimeout(() => { el.textContent = original; }, 1200);
  }));

  const markDeliveredBtn = document.getElementById('invoice-popup-mark-delivered-btn');
  if(markDeliveredBtn) markDeliveredBtn.addEventListener('click', async () => {
    markDeliveredBtn.disabled = true; markDeliveredBtn.textContent = 'Marking\u2026';
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.status = 'delivered'; t.deliveredAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    navigateToTabAfterPopup('shipments');
  });

  const keepUndeliveredBtn = document.getElementById('invoice-popup-keep-undelivered-btn');
  if(keepUndeliveredBtn) keepUndeliveredBtn.addEventListener('click', () => {
    document.getElementById('invoice-popup-undelivered-banner')?.remove();
  });

  const markUndeliveredBtn = document.getElementById('invoice-popup-mark-undelivered-btn');
  if(markUndeliveredBtn) markUndeliveredBtn.addEventListener('click', async () => {
    if(!confirm('Mark this shipment as not yet delivered? Use this if it was marked delivered by mistake.')) return;
    markUndeliveredBtn.disabled = true; markUndeliveredBtn.textContent = 'Undoing\u2026';
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      // Back to 'loaded' (not 'in_transit') -- delivery is always the last
      // step regardless of which state came right before it, and 'loaded'
      // is the safe, always-valid predecessor. Clearing deliveredAt also
      // cancels the 3-hour photo cleanup timer for this shipment, since
      // it's no longer actually delivered.
      if(t){ t.status = 'loaded'; t.deliveredAt = null; t.deliveredIsland = null; t.actualReceiverName = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshInvoicePopupInPlace(shipmentId);
    refreshAfterCashPopup();
  });

  const markUnpaidBtn = document.getElementById('invoice-popup-mark-unpaid-btn');
  if(markUnpaidBtn) markUnpaidBtn.addEventListener('click', async () => {
    if(!confirm('Mark this invoice as unpaid? Use this if a payment was collected by mistake or needs correcting.')) return;
    markUnpaidBtn.disabled = true; markUnpaidBtn.textContent = 'Undoing\u2026';
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.paid = false; t.paymentMethod = null; t.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshInvoicePopupInPlace(shipmentId);
    refreshAfterCashPopup();
  });

  const cashBtn = document.getElementById('invoice-popup-cash-btn');
  if(cashBtn) cashBtn.addEventListener('click', () => openCashPopup(shipmentId));

  const transferBtn = document.getElementById('invoice-popup-transfer-btn');
  if(transferBtn) transferBtn.addEventListener('click', async () => {
    transferBtn.disabled = true; transferBtn.textContent = 'Confirming\u2026';
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.paid = true; t.paymentMethod = 'transfer'; t.paidAt = new Date().toISOString(); }
    });
    state.expandedShipmentIds.delete(shipmentId);
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshAfterCashPopup();
    maybePromptMarkDeliveredAfterPayment(shipmentId);
  });

  // Start building the shareable image the moment the popup opens, in the
  // background -- iOS requires navigator.share() to be called synchronously
  // inside the actual tap, with nothing awaited first. By the time "Share
  // Invoice" is tapped, the file is (usually) already sitting ready to go.
  let shareFile = null;
  let shareFilePromise = prepareInvoiceShareFile(s).then(f => { shareFile = f; return f; });

  document.getElementById('invoice-popup-share-btn').addEventListener('click', async () => {
    if(shareFile){ shareFileNow(shareFile, s); return; }
    // Still generating (rare -- only if tapped within the first instant) --
    // wait for it, then share immediately once ready. This retry itself
    // still counts as inside the same tap's activation window on most
    // browsers as long as it's not an excessive delay.
    const btn = document.getElementById('invoice-popup-share-btn');
    btn.disabled = true; btn.textContent = 'Preparing\u2026';
    const f = await shareFilePromise;
    btn.disabled = false; btn.textContent = t('Share Invoice');
    if(f) shareFileNow(f, s);
    else alert(t('Could not generate the invoice image. Check your connection and try again.'));
  });
}

// Re-renders the invoice popup's content in place (e.g. after collecting
// payment) without closing/reopening it, so the person sees it flip to
// Paid immediately. No-ops if the popup isn't open for this shipment.
function refreshInvoicePopupInPlace(shipmentId){
  const overlay = document.getElementById('invoice-popup-overlay');
  if(!overlay || overlay.dataset.shipmentId !== shipmentId) return;
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  document.getElementById('invoice-popup-panel').innerHTML = renderInvoicePopupContent(s);
  wireInvoicePopupButtons(shipmentId);
}
function closeInvoicePopup(){
  if(document.getElementById('invoice-popup-overlay')) unlockBodyScroll();
  document.getElementById('invoice-popup-overlay')?.remove();
}
// Closes the invoice popup (and any list popup that might be open behind
// it) and navigates to the given tab -- used after an action that's
// "done" from the person's point of view (payment collected, delivery
// confirmed) so they land back on the relevant list instead of staring at
// a now-stale popup. Setting location.hash to its current value doesn't
// fire a hashchange event, so that case is handled with a direct
// re-render instead of relying on the hash to do it.
function navigateToTabAfterPopup(tabId){
  closeInvoicePopup();
  closeInvoiceListPopup();
  if(location.hash.replace('#','').split('/')[0] === tabId){
    state.tab = tabId;
    render();
  } else {
    location.hash = tabId;
  }
}

// Renders the invoice to an image and resolves to a File, or null on
// failure. Pure background work -- no gesture-gated APIs called here.
async function prepareInvoiceShareFile(s){
  try{ await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); }
  catch(e){ console.error('html2canvas failed to load', e); return null; }
  if(typeof html2canvas === 'undefined') return null;
  if(!_boatNameCache[CURRENT_BOAT_ID]) await getCurrentBoatName();
  const node = buildInvoiceImageNode(s);
  let canvas;
  try{
    canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff' });
  } catch(e){
    node.remove();
    console.error('invoice image generation failed', e);
    return null;
  }
  node.remove();
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      if(!blob){ resolve(null); return; }
      const filename = `invoice-${(s.invoiceId||s.id).replace(/[^a-z0-9-]/gi,'')}.png`;
      resolve(new File([blob], filename, { type: 'image/png' }));
    }, 'image/png');
  });
}

// Called synchronously (or as close to it as possible) from inside a real
// tap -- this is the only place navigator.share() is actually invoked.
function shareFileNow(file, s){
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    const bankBits = [];
    if(state.settings.bankAccountName) bankBits.push(`Acc. Name: ${state.settings.bankAccountName}`);
    if(state.settings.bankAccountNumber) bankBits.push(`Acc. No : ${state.settings.bankAccountNumber}`);
    const caption = (!s.paid && bankBits.length) ? `- BML Account -\n${bankBits.join('\n')}` : '';
    navigator.share(caption ? { files: [file], text: caption } : { files: [file] }).catch(e => {
      // Some browsers reject a files+text share together -- fall back to
      // file-only rather than silently dropping the whole share.
      if(caption && e && e.name !== 'AbortError'){
        navigator.share({ files: [file] }).catch(() => { /* user cancelled */ });
      }
    });
  } else {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    alert('Your browser can\'t open the share sheet directly, so the invoice image downloaded instead \u2014 attach it manually in WhatsApp or Viber.');
  }
}

async function shareInvoiceImage(s){
  const file = await prepareInvoiceShareFile(s);
  if(!file){ alert(t('Could not generate the invoice image. Try again.')); return; }
  shareFileNow(file, s);
}

function fmtDMY(dateStr){
  if(!dateStr) return '--/--/2026';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function activeTrip(list){
  return (list||[]).find(t => t.active) || null;
}
// The island the boat has actually arrived at, per the active trip's
// "Boat arrived at" selection in the Trips tab. Used to keep the Dashboard
// pinned to that island by default.
function activeTripArrivedIsland(){
  const t = activeTrip(state.trips);
  return (t && !t.finished && t.arrivedIsland) || null;
}
// The single gate every "mark delivered" path checks: a shipment can't be
// handed over until its own trip has arrived at ANY of its destinations
// (not necessarily the exact island this shipment is bound for -- that
// mismatch case is what the off-island delivery popup handles). Before
// that, trip.arrivedIsland is empty and nothing should be deliverable yet,
// no matter which button or popup someone taps.
function shipmentTripHasArrived(s){
  if(!s || !s.tripId) return true; // no trip on record (legacy data) -- don't block on something we can't check
  const trip = (state.trips||[]).find(x => x.id === s.tripId);
  return !!(trip && trip.arrivedIsland);
}

Thankyou \ud83d\ude0a${boatName ? `\n~${boatName}~` : ''}`;
}

      state.tab = DEFAULT_TAB[state.role];
      saveSession(state.gateRole, state.role, state.staffName, CURRENT_BOAT_ID);
      location.hash = state.tab;
      render();
    };
    const fail = () => { state.pinError = t('Incorrect PIN. Try again.'); renderGate(); };
    const tryPin = () => {
      const entered = input.value;
      if(state.pinTargetRole === 'staff'){
        const users = state.settings.staffUsers || [];
        const match = users.find(u => u.pin === entered);
        if(match){ grant(match.name); return; }
        // Legacy fallback: single staff PIN, only while no staff accounts exist yet.
        if(users.length === 0 && entered === state.settings.staffPin){ grant(null); return; }
        fail();
        return;
      }
      // Owner (and any other pinField role)
      if(entered === state.settings[r.pinField]){ grant(null); }
      else fail();
    };
    document.getElementById('pin-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
    document.getElementById('pin-back').addEventListener('click', () => {
      if(state.gateRole){ state.gateStage='signin'; } else { state.gateStage='pick'; }
      state.pinError=''; renderGate();
    });
    return;
  }

  if(state.gateStage === 'forgot'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">Reset Owner PIN</div>
          <p class="note" style="margin-top:0;text-align:left;">Enter the 6-digit code currently shown in your authenticator app.</p>
          <input type="text" inputmode="numeric" maxlength="6" id="forgot-totp-input" placeholder="123456" style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:4px;" ${state.forgotMsg ? 'disabled' : ''}>
          <div class="pin-error">${state.forgotError || ''}</div>
          ${state.forgotMsg ? `<div class="note" style="text-align:left;">${state.forgotMsg}</div>` : ''}
          <button class="btn btn-primary" id="forgot-totp-submit" style="width:100%;margin:10px 0;" ${state.forgotMsg ? 'disabled' : ''}>${t("Verify Code")}</button>
          <button class="btn btn-ghost" id="forgot-back" style="width:100%;">${t("Back to PIN")}</button>
        </div>
      </div>
    `;
    const totpInput = document.getElementById('forgot-totp-input');
    totpInput.focus();
    document.getElementById('forgot-totp-submit').addEventListener('click', async () => {
      const code = totpInput.value.trim();
      if(!/^\d{6}$/.test(code)){
        state.forgotError = 'Enter the 6-digit code from your authenticator app.'; renderGate(); return;
      }
      state.forgotError = ''; state.forgotMsg = 'Verifying\u2026';
      renderGate();
      try{
        const res = await fetch(`${API_BASE}/api/reset-pin/totp-verify`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ code, boatId: CURRENT_BOAT_ID })
        });
        const data = await res.json().catch(() => ({}));
        if(res.ok && data.ok && data.token){
          state.gateStage = 'reset-confirm'; state.resetToken = data.token;
          state.forgotMsg = ''; state.forgotError = '';
          renderGate();
        } else {
          state.forgotError = (data && data.error) || 'That code is incorrect or expired. Try again.';
          state.forgotMsg = '';
          renderGate();
        }
      }catch(e){
        console.error('totp-verify failed', e);
        state.forgotError = 'Something went wrong. Try again.';
        state.forgotMsg = '';
        renderGate();
      }
    });
    document.getElementById('forgot-back').addEventListener('click', () => {
      state.gateStage = 'pin'; state.pinTargetRole = 'owner';
      state.forgotMsg = ''; state.forgotError = '';
      renderGate();
    });
    return;
  }

  if(state.gateStage === 'reset-confirm'){
    area.innerHTML = `
      <div class="gate-wrap">
        <div class="pin-box">
          <div class="rname">Set New Owner PIN</div>
          <input type="password" inputmode="numeric" id="reset-pin-input" maxlength="6" placeholder="${t("New PIN")}" ${state.resetMsg ? 'disabled' : ''}>
          <div class="pin-error">${state.resetError || ''}</div>
          ${state.resetMsg ? `<div class="note" style="text-align:left;">${state.resetMsg}</div>` : ''}
          <button class="btn btn-primary" id="reset-submit" style="width:100%;margin-top:10px;" ${state.resetMsg ? 'disabled' : ''}>${t("Set New PIN")}</button>
        </div>
      </div>
    `;
    const pinInput = document.getElementById('reset-pin-input');
    pinInput.focus();
    document.getElementById('reset-submit').addEventListener('click', async () => {
      const newPin = pinInput.value.trim();
      if(!/^\d{4,6}$/.test(newPin)){
        state.resetError = 'PIN must be 4\u20136 digits.'; renderGate(); return;
      }
      state.resetError = ''; state.resetMsg = 'Saving\u2026';
      renderGate();
      try{
        const res = await fetch(`${API_BASE}/api/reset-pin/confirm`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token: state.resetToken, newPin })
        });
        const data = await res.json().catch(() => ({}));
        if(res.ok && data.ok){
          state.resetMsg = 'PIN updated. Taking you to sign in\u2026';
          renderGate();
          setTimeout(() => {
            state.gateStage = 'pin'; state.pinTargetRole = 'owner';
            state.resetMsg = ''; state.resetError = ''; state.resetToken = null;
            location.hash = OWNER_HASH;
            renderGate();
          }, 1400);
        } else {
          state.resetError = data.error || 'That link is invalid or expired. Request a new one.';
          state.resetMsg = '';
          renderGate();
        }
      }catch(e){
        console.error('reset-pin confirm failed', e);
        state.resetError = 'Something went wrong. Try again.';
        state.resetMsg = '';
        renderGate();
      }
    });
    return;
  }

  // Owner-specific link: go straight to the Owner PIN box, no picker.
  if(state.gateRole === 'owner'){
    state.pinTargetRole = 'owner';
    state.gateStage = 'pin';
    renderGate();
    return;
  }

  // Staff-specific link: Sign In / Request Access toggle, no Owner card.
  if(state.gateRole === 'staff'){
    renderStaffGate();
    return;
  }

  // Manager-specific link: PIN sign-in only -- managers are invited
  // directly by the owner, not self-requesting like staff can.
  if(state.gateRole === 'manager'){
    renderManagerGate();
    return;
  }

  // Fallback (shouldn't normally be reached, kept for safety): generic picker.
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-title">
          <h1>${t("Staff Sign-In")}</h1>
          <p>This link is for internal use only</p>
        </div>
        <div class="role-grid">
          ${INTERNAL_ROLES.map(key => {
            const r = getRoles()[key];
            return `
              <div class="role-card" data-role="${key}">
                <div class="ricon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.icon]}</svg></div>
                <div class="rname">${r.name}</div>
                <div class="rdesc">${r.desc}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  area.querySelectorAll('.role-card').forEach(c => c.addEventListener('click', () => {
    state.pinTargetRole = c.dataset.role; state.gateStage = 'pin'; state.pinError=''; renderGate();
  }));
}

      if(match || (users.length === 0 && entered === state.settings.staffPin)){
        state.role = 'staff';
        state.staffName = match ? match.name : null;
        state.tab = DEFAULT_TAB.staff;
        saveSession('staff', 'staff', state.staffName, CURRENT_BOAT_ID);
        location.hash = state.tab;
        render();
        return;
      }
      document.getElementById('staffgate-error').textContent = t('Incorrect PIN. Try again.');
    };
    document.getElementById('staffgate-submit').addEventListener('click', tryPin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryPin(); });
  } else {
    body.innerHTML = `
      <div class="gate-form-box">
        <label>${t("Your name")}</label>
        <input type="text" id="req-name" placeholder="${t("e.g. Ahmed")}">
        <label>${t("Email address")}</label>
        <input type="text" id="req-email" placeholder="${t("e.g. ahmed@example.com")}">
        <label>${t("Mobile number")}</label>
        <input type="tel" id="req-mobile" placeholder="${t("e.g. 771 2345")}">
        <button class="btn btn-primary" id="req-submit" style="width:100%;">${t("Request Access")}</button>
        <div class="note" style="margin-top:12px;">${t("An owner or manager will need to approve your request and share a sign-in PIN with you before you can get in.")}</div>
      </div>
    `;
    const checkReqMobile = wireMobileValidation('req-mobile');
    document.getElementById('req-submit').addEventListener('click', async () => {
      const name = document.getElementById('req-name').value.trim();
      const email = document.getElementById('req-email').value.trim();
      const mobile = document.getElementById('req-mobile').value.trim();

      await withFreshSettings(fresh => {

        list.push({id:'req-'+Date.now(), name, email, mobile, requestedAt:new Date().toISOString()});
      });
      state.gateMode = 'submitted';
      renderStaffGate();
    });

}

function logoutInternal(){
  clearSession(state.gateRole);
  state.role = null; state.gateStage='pick'; state.pinTargetRole=null; state.pinError=''; state.tab=null; state.staffName=null; state.gateMode='signin';
  state.lang = 'en';
  applyLangDirection();
  applyStaticTranslations();
  if(state.gateRole === 'owner'){
    history.replaceState(null,'','#org');
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;
  }
  const backHash = (state.gateRole === 'manager' ? MANAGER_HASH : INTERNAL_HASH) + '/' + CURRENT_BOAT_ID;

/* ---------------- Mode toggle (Sender / Receiver) ---------------- */
function renderModeToggle(){

  el.style.display = 'flex';
  el.innerHTML = `
    <button class="${state.role==='sender'?'active':''}" data-mode="sender">${t("I'm Sending Cargo")}</button>
    <button class="${state.role==='receiver'?'active':''}" data-mode="receiver">${t("I'm Receiving Cargo")}</button>

/* ---------------- Nav ---------------- */
function renderTabs(){
  const pending = state.shipments.filter(s => s.status === 'pending' && !isTripFinished(s.tripId)).length;
  const pendingStaffCount = (state.settings.pendingStaff || []).length;
  // Global attention counts, independent of which trip they belong to --
  // these mirror the Undelivered stat card on the Shipments tab and the
  // Unpaid stat on Invoices, so the nav badge always agrees with what
  // tapping into that tab actually shows.
  const undeliveredCount = state.shipments.filter(s => s.status !== 'pending' && s.status !== 'delivered').length;
  const unpaidCount = state.shipments.filter(s => s.invoiceId && !s.voided && !s.paid).length;
  const el = document.getElementById('tabs');
  el.style.display = 'flex';
  const tabs = (getRoleTabs()[state.role] || []).filter(tb => tb.id !== 'settings');
  el.innerHTML = tabs.map(tb => {
    const active = tb.id === state.tab ? 'active' : '';
    let badge = '';
    if(tb.id === 'dashboard' && pending > 0) badge = `<span class="badge">${pending}</span>`;
    if(tb.id === 'shipments' && undeliveredCount > 0) badge = `<span class="badge">${undeliveredCount}</span>`;
    if(tb.id === 'invoices' && unpaidCount > 0) badge = `<span class="badge">${unpaidCount}</span>`;
    return `<button class="${active}" data-tab="${tb.id}">${tb.label}${badge}</button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    // Tapping Home again while already on Home (the common case: the
    // header's collapsed/fullscreen from scrolling and this is how
    // someone gets back to the normal top-of-page view) does a real
    // reload rather than just a hash assignment -- setting location.hash
    // to its current value doesn't fire a hashchange event, so nothing
    // would happen otherwise. A full reload guarantees a clean slate:
    // scrolled to top, header expanded, exactly like tapping the logo.
    if(b.dataset.tab === 'dashboard' && state.tab === 'dashboard'){
      window.location.reload();
      return;
    }
    location.hash = b.dataset.tab;
  }));

  const settingsBtn = document.getElementById('header-settings-btn');
  const hasSettingsTab = (getRoleTabs()[state.role] || []).some(tb => tb.id === 'settings');
  if(hasSettingsTab){
    settingsBtn.style.display = 'flex';
    settingsBtn.style.background = state.tab === 'settings' ? 'var(--amber)' : 'rgba(255,255,255,0.08)';
    const svgStroke = settingsBtn.querySelector('svg');
    if(svgStroke) svgStroke.setAttribute('stroke', state.tab === 'settings' ? 'var(--navy-deep)' : '#F4F9FF');
    if(pendingStaffCount > 0 && !settingsBtn.querySelector('.badge')){
      settingsBtn.style.position = 'relative';
      settingsBtn.insertAdjacentHTML('beforeend', `<span class="badge" style="position:absolute;top:-2px;right:-2px;">${pendingStaffCount}</span>`);
    } else if(pendingStaffCount === 0){
      settingsBtn.querySelector('.badge')?.remove();
    }
    settingsBtn.onclick = () => { location.hash = (state.tab === 'settings') ? 'dashboard' : 'settings'; };
  } else {
    settingsBtn.style.display = 'none';
  }

  const pill = document.getElementById('role-pill');
  if(state.entryMode === 'internal'){
    pill.style.display = 'flex';
    const roleLabelEl = document.getElementById('role-label');
    const roleText = getRoles()[state.role].name + (state.staffName ? ' \u00b7 ' + state.staffName : '');
    if(_boatNameCache[CURRENT_BOAT_ID]){
      roleLabelEl.textContent = `${_boatNameCache[CURRENT_BOAT_ID]} ${roleText}`;
    } else {
      roleLabelEl.textContent = roleText;
      getCurrentBoatName().then(name => {
        const el = document.getElementById('role-label');
        if(el) el.textContent = `${name} ${roleText}`;
      });
    }
        document.getElementById('switch-role-btn').onclick = logoutInternal;
  } else {
    pill.style.display = 'none';
  }
}

/* ---------------- Dashboard (owner + staff) ---------------- */
// Compact trip-management strip shown at the top of Home (Dashboard) once
// a trip is open -- the same actions the old standalone Trips tab had
// (Mark In Transit, boat-arrived tracking, Finish Trip, Copy Announcement,
// Set Active if more than one open trip exists), just scoped to a single
// trip and rendered inline above the shipments list instead of requiring
// a separate tab. Refreshes via renderDashboard, not renderTrips, since
// this only ever shows up as part of Home now.
function renderActiveTripStrip(trip){
  const loadedCount = state.shipments.filter(s => s.tripId === trip.id && s.status === 'loaded').length;
  const statusClass = trip.departed ? 'status-in_transit' : (trip.active ? 'status-delivered' : 'status-pending');
  const statusLabel = trip.departed ? 'In Transit' : (trip.active ? 'Active' : 'Not Yet Active');
  return `
    <div class="tag" style="margin-bottom:16px;">
      <div class="tag-top">
        <div class="tag-top-main">
          <div class="tag-code">${escapeHtml(trip.origin)} \u2192 ${escapeHtml((trip.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(trip.date)} \u00b7 Load ${escapeHtml(trip.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(trip.departureTime||'--:--')}</div>
        </div>
        <div class="tag-status-col">
          <span class="status-pill ${statusClass}">${statusLabel}</span>
          ${trip.arrivedIsland ? `<span class="status-pill status-arrived">Boat Arrived ${escapeHtml(trip.arrivedIsland)}</span>` : ''}
        </div>
      </div>
      <div class="tag-meta">${escapeHtml(trip.location||'')}</div>
      ${trip.departed ? `
        <div style="margin-top:10px;">
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:4px;">Boat arrived at</label>
          <select data-home-arrived-select="${trip.id}">
            <option value="" ${!trip.arrivedIsland ? 'selected' : ''}>Not arrived yet</option>
            ${(trip.destinations||[]).map(isl => `<option value="${escapeHtml(isl)}" ${trip.arrivedIsland===isl ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      ${isGpsTrackingThisDevice(trip.id) ? `
        <div class="tag-meta" style="color:var(--teal);font-weight:700;margin-top:6px;">${t('\ud83d\udccd GPS tracking is on \u2014 keep this phone on the boat, charged, and this page open.')}</div>
      ` : ''}
      <div class="tag-actions">
        ${!trip.active ? `<button class="btn btn-amber" data-home-set-active="${trip.id}">${t("Set Active")}</button>` : ''}
        ${trip.active && !trip.departed ? `<button class="btn btn-primary" data-home-mark-transit="${trip.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${trip.departed ? `<button class="btn btn-primary" data-home-mark-finish="${trip.id}">${t("Mark Trip Finished")}</button>` : ''}
        <button class="btn btn-ghost" data-home-copy-ann="${trip.id}">${t("View & Copy Announcement")}</button>
        ${!trip.finished ? (isGpsTrackingThisDevice(trip.id)
          ? `<button class="btn btn-ghost" data-home-gps-stop="${trip.id}">${t('Stop GPS Tracking')}</button>`
          : `<button class="btn btn-ghost" data-home-gps-start="${trip.id}">${t('Start GPS Tracking')}</button>`
        ) : ''}
      </div>
    </div>
  `;
}
// Compact version shown directly on Home -- route + status only, tap to

          <div class="tag-meta">${fmtDMY(trip.date)} \u00b7 Load ${escapeHtml(trip.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(trip.departureTime||'--:--')}</div>

// Opens the full trip card (see renderActiveTripStrip) as a themed
// overlay+panel popup -- the same button data-attributes/handlers
// (wireActiveTripStripEvents) work unchanged whether that markup lives
// inline on Home or inside this popup, since they're wired via
// document-wide selectors rather than a specific container.
function openTripDetailsPopup(tripId){
  closeTripDetailsPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'trip-details-popup-overlay';
  overlay.dataset.tripId = tripId;
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
        <button type="button" class="btn btn-ghost" id="trip-details-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <div id="trip-details-popup-body"></div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeTripDetailsPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('trip-details-popup-close-btn').addEventListener('click', closeTripDetailsPopup);
  refreshTripDetailsPopupInPlace();
}
function closeTripDetailsPopup(){
  const overlay = document.getElementById('trip-details-popup-overlay');
  if(overlay) unlockBodyScroll();
  overlay?.remove();
}
// Called from renderDashboard() every time it runs, so any action taken
// inside the popup (which all end by calling renderDashboard() same as
// before) keeps the popup's own content in sync instead of going stale
// behind it.
function refreshTripDetailsPopupInPlace(){
  const overlay = document.getElementById('trip-details-popup-overlay');
  if(!overlay) return;
  const tripId = overlay.dataset.tripId;
  const trip = (state.trips||[]).find(t => t.id === tripId);
  if(!trip){ closeTripDetailsPopup(); return; }
  const body = document.getElementById('trip-details-popup-body');
  if(body){
    body.innerHTML = renderActiveTripStrip(trip);
    wireActiveTripStripEvents();
  }
}
function wireActiveTripStripEvents(){
  const markTransitBtn = document.querySelector('[data-home-mark-transit]');
  if(markTransitBtn) markTransitBtn.addEventListener('click', async () => {
    if(!confirm('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.')) return;
    const tripId = markTransitBtn.dataset.homeMarkTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    let moved;
    try{
      moved = await markTripInTransit(tripId);
    }catch(e){
      console.error('markTripInTransit failed', e);
      alert(t('Could not mark this trip in transit. Check your connection and try again.'));
      return;
    }
    if(trip) downloadTripManifest(trip, tripShipments);
    alert(`Trip marked in transit. ${moved} shipment(s) updated.`);
    renderDashboard();
  });

  const markFinishBtn = document.querySelector('[data-home-mark-finish]');
  if(markFinishBtn) markFinishBtn.addEventListener('click', () => {
    openFinishTripPopup(markFinishBtn.dataset.homeMarkFinish);
  });

  const arrivedSelect = document.querySelector('[data-home-arrived-select]');
  if(arrivedSelect) arrivedSelect.addEventListener('change', () => {
    const tripId = arrivedSelect.dataset.homeArrivedSelect;
    const island = arrivedSelect.value || null;
    const localTrip = (state.trips || []).find(t => t.id === tripId);
    if(localTrip){ localTrip.arrivedIsland = island; localTrip.arrivedAt = island ? new Date().toISOString() : null; }
    state.dashIslandView = island;
    renderDashboard();
    withFreshTrips(l => {
      const t = l.find(x => x.id === tripId);
      if(t){ t.arrivedIsland = island; t.arrivedAt = island ? new Date().toISOString() : null; }
    }).then(() => renderDashboard());
  });

  const setActiveBtn = document.querySelector('[data-home-set-active]');
  if(setActiveBtn) setActiveBtn.addEventListener('click', () => {
    const targetId = setActiveBtn.dataset.homeSetActive;
    state.trips.forEach(t => t.active = (t.id === targetId));
    renderDashboard();
    withFreshTrips(l => { l.forEach(t => t.active = (t.id === targetId)); }).then(() => renderDashboard());
  });

  const copyAnnBtn = document.querySelector('[data-home-copy-ann]');
  if(copyAnnBtn) copyAnnBtn.addEventListener('click', () => {
    openAnnouncementPopup(copyAnnBtn.dataset.homeCopyAnn);
  });

  const gpsStartBtn = document.querySelector('[data-home-gps-start]');
  if(gpsStartBtn) gpsStartBtn.addEventListener('click', () => {
    if(!isProAccount()){ openUpgradeToProPopup(); return; }
    startGpsTracking(gpsStartBtn.dataset.homeGpsStart);
  });
  const gpsStopBtn = document.querySelector('[data-home-gps-stop]');
  if(gpsStopBtn) gpsStopBtn.addEventListener('click', () => {
    stopGpsTracking();
    renderDashboard();
  });
}

function renderDashboard(){
  const panel = document.getElementById('panel');
  checkProExpiryWarning();
  const trips = state.trips || [];
  const hasOpenTrip = trips.some(t => !t.finished);
  // If every trip is finished (no new one started yet), the most recently
  // finished trip's still-undelivered shipments stay visible here for
  // staff, who only have Dashboard to work from (no Invoices/Shipments
  // tabs to fall back on) -- instead of disappearing the moment the trip
  // ends.
  let carryOverTripId = null;
  if(!hasOpenTrip){
    const finishedTrips = trips.filter(t => t.finished).sort((a,b) => new Date(b.finishedAt||0) - new Date(a.finishedAt||0));
    if(finishedTrips.length > 0) carryOverTripId = finishedTrips[0].id;
  }
  const active = state.shipments.filter(s => {
    // Fully done -- delivered AND paid -- never shows on Home once both
    // are true, regardless of whether its trip has finished yet. Home is
    // for what still needs attention; Invoices and Shipments still have
    // the full record for anyone who needs to look it up later.
    if(s.status === 'delivered' && s.paid) return false;
    if(!isTripFinished(s.tripId)) return true;
    return s.tripId === carryOverTripId && (s.status !== 'delivered' || !s.paid);
  });
  const carryOverCount = carryOverTripId ? active.filter(s => s.tripId === carryOverTripId).length : 0;

  // Home (owner/manager only) combines trip creation/management with the
  // shipments dashboard: with no open trip, always show the trip creation
  // form -- regardless of whether shipments are still pending from the
  // last trip. Those are already fully visible and actionable from their
  // own tabs (Invoices shows unpaid, Shipments shows undelivered, both
  // with their own nav badge counts, independent of which trip they
  // belong to), so there's no reason to block starting the next trip
  // until they're cleared. Once a trip exists, this falls through to the
  // shipments view with a compact trip-management strip prepended (see
  // renderActiveTripStrip) so Mark In Transit / Finish Trip / etc. stay
  // reachable without a separate tab. Staff is unaffected -- they never
  // had a Trips tab to begin with, and still see the carry-over list
  // computed above since it's their only route to it.
  if(!hasOpenTrip && (state.role === 'owner' || state.role === 'manager')){
    renderTrips();
    return;
  }
  // Effective filter category per shipment -- a carried-over shipment (its
  // trip already ended, still not delivered) is its own "undelivered"
  // bucket, separate from in_transit, so it doesn't get lost among items
  // still genuinely moving on an active trip.
  // Unloaded (still "pending") shipments always sort above everything
  // else, regardless of recency -- those are the ones needing action
  // right now. Within that group, and within the "everything else" group
  // below it, the most recently touched shipment (added, edited, or
  // loaded) sorts first, so a fresh add or a just-loaded item jumps to
  // the top of its own group instead of getting buried under older ones.
  const sortPriority = (s) => s.status === 'pending' ? 0 : 1;
  const filterCategory = (s) => (carryOverTripId && s.tripId === carryOverTripId && s.status !== 'delivered') ? 'undelivered' : s.status;
  const filtered = state.dashSearchOpenId
    ? state.shipments.filter(s => s.id === state.dashSearchOpenId)
    : active
        .filter(s => state.dashIslandView ? (s.island === state.dashIslandView || s.deliveredIsland === state.dashIslandView) : (state.filter === 'all' ? true : filterCategory(s) === state.filter))
        .sort((a,b) => (sortPriority(a) - sortPriority(b)) || (lastActivityTime(b) - lastActivityTime(a)));

  const counts = {
    all: active.length,
    pending: active.filter(s=>filterCategory(s)==='pending').length,
    loaded: active.filter(s=>filterCategory(s)==='loaded').length,
    in_transit: active.filter(s=>filterCategory(s)==='in_transit').length,
    delivered: active.filter(s=>filterCategory(s)==='delivered').length,
    undelivered: active.filter(s=>filterCategory(s)==='undelivered').length,
  };

  // Only trips that haven't departed yet are open for adding a customer --
  // once a trip is marked In Transit, its manifest is locked and new
  // customers can no longer be attached to it. Every non-finished,
  // non-departed trip is a valid route to add a manual customer onto --
  // never guess which one; ask. A shipment silently auto-attached to
  // "whatever's active" can otherwise end up tied to a trip that finishes
  // before the item is ever loaded, and vanish into Reports with no way to
  // act on it. If no trip exists at all, there's no route to pick from, so
  // this is Owner-only and the route is described by hand instead.
  const availableTrips = (state.trips||[]).filter(t => !t.finished && !t.departed);
  const hasAnyOpenTrip = (state.trips||[]).some(t => !t.finished);
  const canAddCustomer = availableTrips.length > 0 || ((state.role === 'owner' || state.role === 'manager') && !hasAnyOpenTrip);

  let tripField = '';
  if(availableTrips.length > 0){
    tripField = `
      <label>${t("Trip (which route is this for?)")}</label>
      <select id="ac-trip-select" required>
        ${availableTrips.map(t => `<option value="${t.id}">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} (${fmtDMY(t.date)})</option>`).join('')}
      </select>
      <label>${t("Destination island")}</label>
      <select id="ac-island-select" required>
        <option value="" disabled selected>Select destination</option>
        <option value="__other">Other</option>
      </select>
      <input type="text" id="ac-island-other" placeholder="${t("Type destination")}" style="display:none;">
    `;
  } else {
    tripField = `
      <div class="note" style="border-color:var(--red);color:var(--red);margin-bottom:12px;">${t("No trip exists yet, so this customer won't be tied to one — describe the route by hand below. Once a trip is created, load their items onto it as normal.")}</div>
      <label>${t("Origin")}</label>
      <input type="text" id="ac-origin" required placeholder="${t("e.g. Male'")}">
      <label>${t("Destination island")}</label>
      <input type="text" id="ac-island-other" required placeholder="${t("e.g. Maafushi")}">
    `;
  }

  const primaryTrip = hasOpenTrip ? (trips.find(t => t.active && !t.finished) || trips.find(t => !t.finished)) : null;
  const showTripStrip = primaryTrip && (state.role === 'owner' || state.role === 'manager');

  panel.innerHTML = `
    ${showTripStrip ? renderActiveTripSummary(primaryTrip) : ''}
    <h2>${showTripStrip ? t(t('Shipments')) : 'Dispatch Dashboard'}</h2>
    <p class="sub">${t("Customer check-ins, loading log, and delivery status.")}</p>
    ${carryOverCount > 0 ? `<div class="note" style="margin-bottom:16px;">${carryOverCount} shipment(s) from the last trip still need attention (not delivered and/or not paid) \u2014 shown here until the next trip is created.</div>` : ''}
    ${canAddCustomer ? `<button class="btn btn-amber" id="toggle-add-customer-btn" style="margin-bottom:16px;">${state.addCustomerOpen ? t('Cancel') : '+ Add Customer'}</button>` : ''}
    ${state.addCustomerOpen && canAddCustomer ? `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;background:#fff;margin-bottom:16px;">
        <h3>${t("Add Customer")}</h3>
        <label>${t("Sender name")}</label>
        <input type="text" id="ac-name" required>
        <label>${t("Sender mobile number")}</label>
        <input type="tel" id="ac-mobile" required>
        ${tripField}
        <label>${t("Receiver's name")}</label>
        <input type="text" id="ac-rname" required>
        <div id="ac-rname-suggestions"></div>
        <label>${t("Receiver's mobile number")}</label>
        <input type="tel" id="ac-rmobile" required>
        <label>${t("Cargo note (optional)")}</label>
        <textarea id="ac-note" rows="2" placeholder="${t("e.g. 3 sacks of rice, fragile")}"></textarea>
        <button class="btn btn-primary" id="ac-submit-btn">${t("Add Customer")}</button>
      </div>
    ` : ''}
    <div class="filter-scroll-row">
      <span class="filter-chip ${state.filter==='all'?'active':''}" data-f="all">All (${counts.all})</span>
      <span class="filter-chip ${state.filter==='pending'?'active':''}" data-f="pending">Awaiting load (${counts.pending})</span>
      <span class="filter-chip ${state.filter==='loaded'?'active':''}" data-f="loaded">Loaded (${counts.loaded})</span>
      <span class="filter-chip ${state.filter==='in_transit'?'active':''}" data-f="in_transit">In Transit (${counts.in_transit})</span>
      <span class="filter-chip ${state.filter==='delivered'?'active':''}" data-f="delivered">Delivered (${counts.delivered})</span>
      ${counts.undelivered > 0 ? `<span class="filter-chip ${state.filter==='undelivered'?'active':''}" data-f="undelivered" style="border-color:var(--red);color:var(--red);">Undelivered (${counts.undelivered})</span>` : ''}
    </div>

    ${!state.dashSearchOpenId ? `
      <div class="settings-block" style="margin-bottom:16px;">
        <label>${t("Search all shipments — name, mobile, or tracking code")}</label>
        <input type="text" id="dash-search-input" placeholder="${t("e.g. Ahmed, 7712345, CF-260801-91H9")}" value="${escapeHtml(state.dashSearchQuery||'')}">
        <div id="dash-search-results"></div>
      </div>
    ` : ''}

    ${(!state.dashSearchQuery && !state.dashSearchOpenId) ? (() => {
      const islandCounts = {};
      active.forEach(s => { if(s.island){ islandCounts[s.island] = (islandCounts[s.island]||0) + 1; } });
      const islands = Object.keys(islandCounts).sort();
      return islands.length === 0 ? '' : `
        <div class="settings-block" style="margin-bottom:16px;">
          <h3>${t("Islands")}</h3>
          <div class="filter-scroll-row">
            ${islands.map(isl => `<span class="filter-chip ${state.dashIslandView===isl?'active':''}" data-island="${escapeHtml(isl)}">${escapeHtml(isl)} (${islandCounts[isl]})</span>`).join('')}
          </div>
        </div>
      `;
    })() : ''}
    ${state.dashIslandView ? `<button class="btn btn-ghost" id="dash-island-back-btn" style="margin-bottom:12px;">${t("\u2190 Back to all shipments")}</button>` : ''}
    ${state.dashSearchOpenId ? `<button class="btn btn-ghost" id="dash-search-back-btn" style="margin-bottom:12px;">${t("\u2190 Back to search results")}</button>` : ''}

    <div id="list"></div>
  `;

  if(showTripStrip){
    document.getElementById('trip-summary-banner')?.addEventListener('click', () => {
      openTripDetailsPopup(primaryTrip.id);
    });
  }
  refreshTripDetailsPopupInPlace();

  const openLoadId = Object.keys(state.loadingDraft).find(id => state.loadingDraft[id].open);
  const openLoadShipment = openLoadId ? state.shipments.find(x => x.id === openLoadId) : null;
  let modalHost = document.getElementById('load-modal-overlay');
  if(openLoadShipment){
    if(!modalHost){
      modalHost = document.createElement('div');
      modalHost.id = 'load-modal-overlay';
      modalHost.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:flex-end;justify-content:center;';
      document.body.appendChild(modalHost);
      lockBodyScroll();
    }
    modalHost.innerHTML = `<div class="panel" style="height:92vh;max-height:92vh;overflow-y:auto;width:100%;max-width:600px;border-radius:16px 16px 0 0;margin:0;">${renderLoadForm(openLoadShipment)}</div>`;
    modalHost.onclick = (e) => { if(e.target === modalHost){ delete state.loadingDraft[openLoadId]; renderDashboard(); } };
  } else if(modalHost){
    modalHost.remove();
    unlockBodyScroll();
  }

  panel.querySelectorAll('.filter-chip[data-f]').forEach(c => c.addEventListener('click', () => { state.filter = c.dataset.f; state.dashIslandView = null; renderDashboard(); }));
  panel.querySelectorAll('[data-island]').forEach(c => c.addEventListener('click', () => {
    state.dashIslandView = state.dashIslandView === c.dataset.island ? null : c.dataset.island;
    renderDashboard();
  }));
  document.getElementById('dash-island-back-btn')?.addEventListener('click', () => { state.dashIslandView = null; renderDashboard(); });
  document.getElementById('dash-search-back-btn')?.addEventListener('click', () => { state.dashSearchOpenId = null; renderDashboard(); });

  const searchInput = document.getElementById('dash-search-input');
  const renderSearchResults = () => {
    const resultsEl = document.getElementById('dash-search-results');
    if(!resultsEl) return;
    const q = (state.dashSearchQuery||'').trim().toLowerCase();
    if(!q || state.dashSearchOpenId){ resultsEl.innerHTML = ''; return; }
    const matches = state.shipments.filter(s =>
      (s.name||'').toLowerCase().includes(q) ||
      (s.mobile||'').toLowerCase().includes(q) ||
      (s.receiverName||'').toLowerCase().includes(q) ||
      (s.receiverMobile||'').toLowerCase().includes(q) ||
      (s.id||'').toLowerCase().includes(q)
    ).slice(0, 30);
    resultsEl.innerHTML = matches.length === 0 ? `<div class="empty" style="margin-top:10px;">${t("No matches.")}</div>` : `
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        ${matches.map(s => `
          <button type="button" class="item-result-row" data-search-open="${s.id}" style="width:100%;text-align:left;">
            <span>${escapeHtml(s.name)} \u2192 ${escapeHtml(s.receiverName||'')}</span>
            <span class="rprice">${escapeHtml(s.island||'')}</span>
          </button>
        `).join('')}
      </div>
    `;
    resultsEl.querySelectorAll('[data-search-open]').forEach(b => b.addEventListener('click', () => {
      state.dashSearchOpenId = b.dataset.searchOpen;
      state.dashSearchQuery = '';
      renderDashboard();
    }));
  };
  searchInput?.addEventListener('input', () => {
    state.dashSearchQuery = searchInput.value;
    if(!state.dashSearchQuery){
      // Cleared -- back to the normal dashboard view (islands row, status
      // filters) instead of leaving a stale empty search state showing.
      renderDashboard();
    } else {
      renderSearchResults();
    }
  });
  renderSearchResults();
  

  document.getElementById('toggle-add-customer-btn')?.addEventListener('click', () => {
    state.addCustomerOpen = !state.addCustomerOpen;
    // Same reasoning as the submit handler below -- closing the form
    // (Cancel) collapses the layout back down, so reset scroll rather
    // than preserving a possibly keyboard-shifted position.
    if(!state.addCustomerOpen){
      document.activeElement?.blur();
      window.scrollTo(0, 0);
    }
    renderDashboard();
  });

  if(state.addCustomerOpen && canAddCustomer){
    const acTripSelect = document.getElementById('ac-trip-select');
    const acSelect = document.getElementById('ac-island-select');
    const acOther = document.getElementById('ac-island-other');

    document.getElementById('ac-mobile').addEventListener('blur', () => {
      runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
    });
    wireReceiverAutofill('ac-mobile', 'ac-rname', 'ac-rmobile', 'ac-rname-suggestions');

    const populateIslands = () => {
      if(!acSelect || !acTripSelect) return;
      const t = availableTrips.find(x => x.id === acTripSelect.value);
      const dests = t ? (t.destinations||[]) : [];
      const onlyOneDest = dests.length === 1;
      acSelect.innerHTML = `
        <option value="" disabled ${onlyOneDest ? '' : 'selected'}>Select destination</option>
        ${dests.map(d => `<option value="${escapeHtml(d)}" ${onlyOneDest ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
        <option value="__other">Other</option>
      `;
      acOther.style.display = 'none'; acOther.required = false; acOther.value = '';
      runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
    };
    if(acTripSelect){ populateIslands(); acTripSelect.addEventListener('change', populateIslands); }

    if(acSelect){
      acSelect.addEventListener('change', () => {
        if(acSelect.value === '__other'){ acOther.style.display = 'block'; acOther.required = true; }
        else { acOther.style.display = 'none'; acOther.required = false; acOther.value=''; }
        runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
      });
    }
    if(acOther){
      acOther.addEventListener('blur', () => {
        runReceiverAutofillForIsland('ac-mobile', 'ac-island-select', 'ac-island-other', 'ac-rname', 'ac-rmobile');
      });
    }
    const checkAcSenderMobile = wireMobileValidation('ac-mobile');
    const checkAcReceiverMobile = wireMobileValidation('ac-rmobile');
    document.getElementById('ac-submit-btn').addEventListener('click', async () => {
      try{
        const name = document.getElementById('ac-name').value.trim();
        const mobile = document.getElementById('ac-mobile').value.trim();
        const island = acSelect && acSelect.value && acSelect.value !== '__other' ? acSelect.value : (acOther.value||'').trim();
        const receiverName = document.getElementById('ac-rname').value.trim();
        const receiverMobile = document.getElementById('ac-rmobile').value.trim();
        const note = document.getElementById('ac-note').value.trim();
        const selectedTrip = acTripSelect ? availableTrips.find(x => x.id === acTripSelect.value) : null;
        const originInput = document.getElementById('ac-origin');
        if(!name || !mobile || !island || !receiverName || !receiverMobile){ alert(t('Fill in sender, receiver, and destination island.')); return; }
        if(!checkAcSenderMobile() || !checkAcReceiverMobile()) return;
        if(availableTrips.length > 0 && !selectedTrip){ alert(t('Pick which trip this customer is for.')); return; }
        if(availableTrips.length === 0 && !(originInput && originInput.value.trim())){ alert(t('Enter the origin.')); return; }
        const code = trackingCode();
        const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: selectedTrip ? selectedTrip.id : null, createdAt: new Date().toISOString() };
        await withFreshShipments(list => { list.push(shipment); });
        syncShipmentToSheet(shipment);
        state.addCustomerOpen = false;
        // The form (with its keyboard-focused inputs) collapses back down
        // to a much shorter list here -- the generic scroll-preserving
        // wrapper around renderDashboard would otherwise restore whatever
        // scroll position was last captured while the keyboard was open,
        // which no longer matches the now-much-shorter layout and leaves
        // the page looking cut off at the top. Blurring and resetting to
        // the top here, before that capture happens, avoids it.
        document.activeElement?.blur();
        window.scrollTo(0, 0);
        renderDashboard();
      }catch(err){
        console.error('Add Customer failed', err);
        alert(t('Something went wrong adding this customer. Please try again.'));
      }
    });
  }

  const list = panel.querySelector('#list');
  if(filtered.length === 0){ list.innerHTML = `<div class="empty">${t("No shipments here yet.")}</div>`; return; }
  list.innerHTML = filtered.map(s => renderTagCard(s, carryOverTripId && s.tripId === carryOverTripId && (s.status !== 'delivered' || !s.paid))).join('');

  list.querySelectorAll('[data-expand-shipment]').forEach(b => b.addEventListener('click', () => {
    state.expandedShipmentIds.add(b.dataset.expandShipment);
    renderDashboard();
  }));
  list.querySelectorAll('[data-collapse-shipment]').forEach(b => b.addEventListener('click', () => {
    state.expandedShipmentIds.delete(b.dataset.collapseShipment);
    renderDashboard();
  }));
  list.querySelectorAll('[data-load]').forEach(b => b.addEventListener('click', () => openLoadForm(b.dataset.load)));
  list.querySelectorAll('[data-deliver]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.deliver;
    const s = state.shipments.find(x => x.id === id);
    if(s && !shipmentTripHasArrived(s)){
      alert(t("Can't mark this delivered yet \u2014 the boat hasn't arrived at any destination island for this trip."));
      return;
    }
    const arrived = activeTripArrivedIsland();
    const trip = s ? (state.trips||[]).find(x => x.id === s.tripId) : null;
    const arrivedIsPlannedStop = !!(trip && (trip.destinations||[]).includes(arrived));
    // Only auto-detect a mismatch once the boat has actually been marked
    // arrived somewhere (Trips tab) -- otherwise every delivery would
    // trip the off-island popup before an arrival is even set. And only
    // treat it as a mismatch worth the extra popup if the arrived island
    // isn't even one of this trip's planned stops -- arriving at any
    // scheduled destination is a normal delivery, not an off-plan one,
    // even if it's not the exact island this shipment was checked in for.
    if(s && arrived && s.island !== arrived && !arrivedIsPlannedStop){
      openDeliverOtherPopup(id);
    } else {
      markDelivered(id);
    }
  }));
  list.querySelectorAll('[data-invoice]').forEach(b => b.addEventListener('click', () => {
    openInvoicePopup(b.dataset.invoice);
  }));
  list.querySelectorAll('[data-delete-shipment]').forEach(b => b.addEventListener('click', async () => {
    const target = state.shipments.find(x => x.id === b.dataset.deleteShipment);
    if(target && target.items && target.items.length && state.role !== 'owner' && state.role !== 'manager'){
      alert(t('Only the Owner or a Manager can delete a shipment once items have been logged.'));
      return;
    }
    if(!confirm('Delete this customer entry? This cannot be undone.')) return;
    try{
      await withFreshShipments(list => {
        const idx = list.findIndex(x => x.id === b.dataset.deleteShipment);
        if(idx > -1) list.splice(idx, 1);
      });
    }catch(e){
      console.error('delete shipment failed', e);
      alert(t('Could not delete this entry. Check your connection and try again.'));
      return;
    }
    renderDashboard();
  }));
  list.querySelectorAll('[data-take-photo]').forEach(b => b.addEventListener('click', () => {
    const input = document.querySelector(`[data-load-photo="${b.dataset.takePhoto}"]`);
    if(input) input.click();
  }));
  list.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.pay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    state.expandedShipmentIds.delete(b.dataset.pay);
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.pay));
    renderDashboard();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    openCashPopup(b.dataset.cashOpen);
  }));
}

function renderTagCard(s, isUndelivered){
  const statusClass = 'status-' + s.status;
  const statusLabel = STATUS_LABELS[s.status] || s.status;
  const pillHtml = isUndelivered
    ? `<span class="status-pill" style="background:var(--red);color:#fff;">Trip Ended</span>`
    : `<span class="status-pill ${statusClass}">${statusLabel}</span>`;
  const offIslandNote = (s.deliveredIsland && s.deliveredIsland !== s.island) ? `
    <div class="tag-meta" style="color:var(--amber);font-weight:600;">Delivered at ${escapeHtml(s.deliveredIsland)} (registered for ${escapeHtml(s.island)})</div>
    ${s.actualReceiverName ? `<div class="tag-meta">Received by ${escapeHtml(s.actualReceiverName)}${s.actualReceiverMobile ? ' \u00b7 '+telLink(s.actualReceiverMobile) : ''}</div>` : ''}
    ${s.deliveryNote ? `<div class="tag-meta">Reason: ${escapeHtml(s.deliveryNote)}</div>` : ''}
  ` : '';
  const paidBadge = s.invoiceId ? `<div class="tag-meta" style="font-weight:700;margin-top:6px;color:${s.paid?'#22A366':'#E5473B'};">${s.paid ? 'Paid' : 'Unpaid'} \u2014 ${s.status==='delivered' ? 'Delivered' : 'Not Delivered'}</div>` : '';
  const headerHtml = `
    <div style="flex:1;">
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${telLink(s.receiverMobile)}</div>` : ''}
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${telLink(s.mobile)}</div>
      <div class="tag-meta">${s.id} \u00b7 to <strong>${escapeHtml(s.island)}</strong></div>
      ${offIslandNote}
    </div>
    <div style="text-align:right;">
      ${pillHtml}
      ${paidBadge}
    </div>
  `;

  const isExpanded = state.expandedShipmentIds.has(s.id);
  if(!isExpanded){
    return `
      <div class="tag">
        <button type="button" data-expand-shipment="${s.id}" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;padding:0;font:inherit;color:inherit;">
          <div class="tag-top">${headerHtml}</div>
        </button>
      </div>
      <input type="file" accept="image/*" data-load-photo="${s.id}" style="display:none;">
    `;
  }

  const draft = state.loadingDraft[s.id];
  let actions = '';
  if(s.status === 'pending'){
    if(draft && draft.items.length){
      const pendingCount = draft.items.reduce((n,i)=>n+i.qty,0);
      actions = `<button class="btn btn-amber" data-load="${s.id}">Continue \u2014 ${pendingCount} item${pendingCount===1?'':'s'} pending</button>`;
    } else {
      actions = `<button class="btn btn-amber" data-load="${s.id}">${t("Log Items Loaded")}</button>`;
    }
  } else if(s.status === 'in_transit'){
    actions = shipmentTripHasArrived(s)
      ? `<button class="btn btn-primary" data-deliver="${s.id}">${t("Mark Delivered")}</button>`
      : `<div class="note" style="margin:0;">${t("Waiting for the boat to arrive at a destination island before this can be marked delivered.")}</div>`;
  }

  const photoControls = ((s.status === 'loaded' || s.status === 'in_transit') ? `<button class="btn btn-ghost" data-take-photo="${s.id}">${s.photo ? 'Retake Photo' : 'Add Photo'}</button>` : '')
    + `<input type="file" accept="image/*" data-load-photo="${s.id}" style="display:none;">`;
  const photoThumb = photoLinkHtml(s);

  const itemsSummary = (s.items && s.items.length) ? `
    <details class="items-details">
      <summary>Items (${s.items.reduce((n,i)=>n+i.qty,0)})</summary>
      <div class="items-body">
        ${s.items.map(i => `${i.qty}\u00d7 ${escapeHtml(i.name)}`).join('<br>')}
        <div style="margin-top:6px;font-weight:700;color:var(--navy-deep);">Total ${fmtMoney(s.total)}</div>
      </div>
    </details>
  ` : '';
  const invoiceLine = s.invoiceId ? `<button type="button" data-invoice="${s.id}" style="display:block;width:100%;text-align:left;background:none;border:none;padding:4px 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);">Invoice ${s.invoiceId} \u00b7 <span style="color:${s.paid?'#22A366':'#E5473B'};">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</span></button>` : '';
  const paymentActions = (s.invoiceId && !s.voided && !s.paid) ? `
    <button class="btn btn-primary" data-cash-open="${s.id}">${t("Collect — Cash")}</button>
    <button class="btn btn-primary" data-pay="${s.id}" data-method="transfer">${t("Collect \u2014 Transfer")}</button>
  ` : '';

  const hasItems = s.items && s.items.length > 0;
  const canDelete = !hasItems || state.role === 'owner' || state.role === 'manager';
  const deleteBtn = canDelete ? `<button class="btn btn-danger" data-delete-shipment="${s.id}">${t("Delete")}</button>` : '';

  return `
    <div class="tag">
      <button type="button" data-collapse-shipment="${s.id}" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;padding:0;font:inherit;color:inherit;">
        <div class="tag-top">${headerHtml}</div>
      </button>
      ${s.note ? `<div class="tag-meta">Note: ${escapeHtml(s.note)}</div>` : ''}
      ${itemsSummary}
      ${invoiceLine}
      ${photoThumb}
      <div class="tag-actions">${actions}${paymentActions}${photoControls}${deleteBtn}</div>
    </div>
  `;
}

// Cash payment popup -- same pop-in style as the invoice, off-island
// delivery, and finish-trip popups, opens over whatever screen you're on
// (Dashboard, Invoices, or Reports) instead of expanding inline within
// the card, and closes on tap-outside or the X.
function refreshAfterCashPopup(){
  if(state.tab === 'dashboard') renderDashboard();
  else if(state.tab === 'invoices') renderInvoices();
  else if(state.tab === 'shipments') renderShipmentsTab();
  else if(state.tab === 'settings' && state.settingsTab === 'reports') renderReportIslandDetail();
  const invoiceOverlay = document.getElementById('invoice-popup-overlay');
  if(invoiceOverlay) refreshInvoicePopupInPlace(invoiceOverlay.dataset.shipmentId);
  const listOverlay = document.getElementById('invoice-list-popup-overlay');
  if(listOverlay) refreshInvoiceListPopupInPlace();
}
function openCashPopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeCashPopup();
  lockBodyScroll();
  state.cashDraft[shipmentId] = { received: '' };
  const overlay = document.createElement('div');
  overlay.id = 'cash-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="cash-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:400px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
        <h3 style="margin-bottom:2px;">${t("Collect Cash")}</h3>
        <button type="button" class="btn btn-ghost" id="cash-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <div id="cash-popup-body"></div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeCashPopup(); });
  document.body.appendChild(overlay);
  renderCashPopupBody(shipmentId);
  document.getElementById('cash-popup-close-btn').addEventListener('click', closeCashPopup);
}
function closeCashPopup(){
  const overlay = document.getElementById('cash-popup-overlay');
  if(overlay){
    const id = overlay.dataset.shipmentId;
    if(id) delete state.cashDraft[id];
    unlockBodyScroll();
  }
  overlay?.remove();
}
function renderCashPopupBody(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  const cash = state.cashDraft[shipmentId];
  if(!s || !cash) return;
  const received = parseFloat(cash.received) || 0;
  const balance = received - (s.total || 0);
  const balanceLabel = balance > 0 ? 'Change to give back' : (balance < 0 ? 'Still owing' : 'Exact amount');
  const balanceColor = balance > 0 ? 'var(--green)' : (balance < 0 ? 'var(--red)' : 'var(--navy-deep)');
  document.getElementById('cash-popup-overlay').dataset.shipmentId = shipmentId;
  const body = document.getElementById('cash-popup-body');
  body.innerHTML = `
    <label style="margin-bottom:6px;">Amount received (\u0783)</label>
    <input type="text" inputmode="decimal" id="cash-popup-input" value="${escapeHtml(cash.received)}" placeholder="0.00" style="margin-bottom:8px;">
    <div class="tag-meta">Total due: ${fmtMoney(s.total)}</div>
    <div class="balance" id="cash-popup-balance" style="color:${balanceColor};">${balanceLabel}: ${fmtMoney(Math.abs(balance))}</div>
    <div class="tag-actions" style="margin-top:14px;">
      <button class="btn btn-primary" id="cash-popup-confirm-btn">${t("Confirm Cash Payment")}</button>
      <button class="btn btn-ghost" id="cash-popup-cancel-btn">${t("Cancel")}</button>
    </div>
  `;
  const input = document.getElementById('cash-popup-input');
  input.addEventListener('input', () => {
    cash.received = input.value;
    const r = parseFloat(input.value) || 0;
    const bal = r - (s.total || 0);
    const label = bal > 0 ? 'Change to give back' : (bal < 0 ? 'Still owing' : 'Exact amount');
    const color = bal > 0 ? 'var(--green)' : (bal < 0 ? 'var(--red)' : 'var(--navy-deep)');
    const balEl = document.getElementById('cash-popup-balance');
    balEl.textContent = `${label}: ${fmtMoney(Math.abs(bal))}`;
    balEl.style.color = color;
  });
  document.getElementById('cash-popup-cancel-btn').addEventListener('click', closeCashPopup);
  document.getElementById('cash-popup-confirm-btn').addEventListener('click', async () => {
    const receivedAmt = parseFloat(cash.received) || 0;
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){
        t.paid = true; t.paymentMethod = 'cash'; t.paidAt = new Date().toISOString();
        t.cashReceived = receivedAmt; t.cashChange = receivedAmt - (t.total||0);
      }
    });
    delete state.cashDraft[shipmentId];
    state.expandedShipmentIds.delete(shipmentId);
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    closeCashPopup();
    refreshAfterCashPopup();
    maybePromptMarkDeliveredAfterPayment(shipmentId);
  });
}

// Off-island delivery popup -- opens automatically from "Mark Delivered"
// when the boat's arrived island (set in Trips) doesn't match the
// shipment's registered island, instead of a separate button the person
// has to remember to tap. Same pop-in style as the invoice popup, closes
// on tap-outside or the X.
function openDeliverOtherPopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeDeliverOtherPopup();
  lockBodyScroll();
  const trip = (state.trips||[]).find(t => t.id === s.tripId);
  const arrived = activeTripArrivedIsland();
  const routeIslands = ((trip && trip.destinations) || []).filter(isl => isl !== s.island);
  const overlay = document.createElement('div');
  overlay.id = 'deliver-other-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="deliver-other-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      ${renderDeliverOtherPopupContent(s, routeIslands, arrived)}
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDeliverOtherPopup(); });
  document.body.appendChild(overlay);
  wireDeliverOtherPopup(s, routeIslands);
}
function closeDeliverOtherPopup(){

  document.getElementById('deliver-other-popup-overlay')?.remove();
}

// Finish-trip confirmation popup -- same pop-in style as the invoice and
// off-island delivery popups, opens right over whatever screen you're on
// and closes on tap-outside or the X, instead of expanding inline within
// the trip card.
// Destination picker for a return trip -- opens when the New Trip origin
// is a destination-only island (e.g. picking "Feridhoo" as origin, which
// only exists as a destination on the Male' route, not as its own saved
// route). Same pop-in popup style as the others. The islands that ARE
// saved route origins (most commonly the original starting point, e.g.
// "Male'") are shown in their own section at the bottom, since that's
// the most likely destination for a trip heading back.
function openDestinationPickerPopup(selectedOrigin, allKnownIslands, boatRoutes){
  closeDestinationPickerPopup();
  lockBodyScroll();
  const routeOrigins = new Set(boatRoutes.map(r => r.origin));
  const otherIslands = allKnownIslands.filter(isl => isl !== selectedOrigin && !routeOrigins.has(isl));
  const originIslands = allKnownIslands.filter(isl => isl !== selectedOrigin && routeOrigins.has(isl));
  const overlay = document.createElement('div');
  overlay.id = 'dest-picker-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  const checkboxRow = (isl) => `
    <label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;">
      <input type="checkbox" value="${escapeHtml(isl)}" style="width:18px;height:18px;">
      <span>${escapeHtml(isl)}</span>
    </label>
  `;
  overlay.innerHTML = `
    <div class="panel" id="dest-picker-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:420px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
        <h3 style="margin-bottom:2px;">Destinations from ${escapeHtml(selectedOrigin)}</h3>
        <button type="button" class="btn btn-ghost" id="dest-picker-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:10px;">${t("No saved route starts here — pick which islands this trip stops at.")}</p>
      ${otherIslands.length ? `
        <div style="margin-bottom:14px;">${otherIslands.map(checkboxRow).join('')}</div>
      ` : ''}
      ${originIslands.length ? `
        <label style="margin-bottom:4px;">Also available (usual starting points)</label>
        <div style="margin-bottom:14px;">${originIslands.map(checkboxRow).join('')}</div>
      ` : ''}
      <div class="tag-actions">
        <button class="btn btn-primary" id="dest-picker-confirm-btn">${t("Use Selected Islands")}</button>
        <button class="btn btn-ghost" id="dest-picker-cancel-btn">${t("Cancel")}</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDestinationPickerPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('dest-picker-close-btn').addEventListener('click', closeDestinationPickerPopup);
  document.getElementById('dest-picker-cancel-btn').addEventListener('click', closeDestinationPickerPopup);

  // Fills the destinations box in the order islands were actually checked,
  // not their fixed position in this list -- tapping Feridhoo then Maalhos
  // should give "Feridhoo, Maalhos", not the reverse just because Maalhos
  // happens to be listed first.
  const selectionOrder = [];
  overlay.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const idx = selectionOrder.indexOf(cb.value);
      if(cb.checked){
        if(idx === -1) selectionOrder.push(cb.value);
      } else if(idx !== -1){
        selectionOrder.splice(idx, 1);
      }
    });
  });

  document.getElementById('dest-picker-confirm-btn').addEventListener('click', () => {
    const destsField = document.getElementById('trip-dests');
    if(destsField) destsField.value = selectionOrder.join('\n');
    closeDestinationPickerPopup();
  });
}
function closeDestinationPickerPopup(){
  if(document.getElementById('dest-picker-popup-overlay')) unlockBodyScroll();
  document.getElementById('dest-picker-popup-overlay')?.remove();
}

// Builds/re-builds the popup's inner content and (re)wires its buttons --
// shared by the initial open and any later in-place refresh, so both stay
// perfectly consistent with each other.
function renderInvoiceListPopupContent(title, invoiceList){
  const panelEl = document.getElementById('invoice-list-popup-panel');
  if(!panelEl) return;
  const total = invoiceList.reduce((sum,s) => sum + (s.total||0), 0);
  const summaryLabel = title === 'Paid Invoices' ? 'total collected' : (title === 'Unpaid Invoices' ? 'total owing' : 'total value');
  const noun = title.toLowerCase().includes('shipment') ? 'shipment' : 'invoice';

  // Group by origin -> destination route so a long list is scannable at a
  // glance, rather than one flat scroll -- each route starts collapsed,
  // since most of the time you're looking for a specific island's
  // invoices, not browsing everything.
  const groups = {};
  const groupOrder = [];
  invoiceList.forEach(s => {
    const trip = state.trips.find(t => t.id === s.tripId);
    const routeKey = trip ? `${trip.origin} \u2192 ${s.island}` : `To ${s.island}`;
    if(!groups[routeKey]){ groups[routeKey] = []; groupOrder.push(routeKey); }
    groups[routeKey].push(s);
  });

  const rowHtml = (s) => `
    <button type="button" class="item-result-row" data-invoice-list-row="${s.id}" style="align-items:flex-start;flex-direction:column;height:auto;">
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span style="font-weight:700;">${escapeHtml(s.invoiceId)}</span>
        <span class="rprice">${fmtMoney(s.total)}</span>
      </div>
      <span class="tag-meta" style="margin-top:2px;">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.receiverName||'\u2014')}</span>
    </button>
  `;

  panelEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
      <h3 style="margin-bottom:2px;">${escapeHtml(title)}</h3>
      <button type="button" class="btn btn-ghost" id="invoice-list-popup-close-btn" style="padding:8px 14px;">\u2715</button>
    </div>
    <p class="sub" style="margin-bottom:14px;">${invoiceList.length} ${noun}${invoiceList.length===1?'':'s'} \u00b7 ${fmtMoney(total)} ${summaryLabel}</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${groupOrder.map(routeKey => {
        const rows = groups[routeKey];
        const groupTotal = rows.reduce((sum,s) => sum + (s.total||0), 0);
        return `
          <details class="items-details" style="border-top:none;padding-top:0;">
            <summary style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;">
              <span>${escapeHtml(routeKey)} <span class="tag-meta" style="font-weight:400;">(${rows.length})</span></span>
              <span class="rprice">${fmtMoney(groupTotal)}</span>
            </summary>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
              ${rows.map(rowHtml).join('')}
            </div>
          </details>
        `;
      }).join('')}
      ${invoiceList.length === 0 ? `<div class="empty" style="padding:16px 0;">${t("Nothing here right now.")}</div>` : ''}
    </div>
  `;
  document.getElementById('invoice-list-popup-close-btn').addEventListener('click', closeInvoiceListPopup);
  panelEl.querySelectorAll('[data-invoice-list-row]').forEach(b => b.addEventListener('click', () => {
    openInvoicePopup(b.dataset.invoiceListRow);
  }));
}

// Re-runs whichever regenerator function was supplied when this popup was
// opened (e.g. "give me the current list of undelivered shipments") and
// re-renders with the fresh result -- so marking something delivered or

function openFinishTripPopup(tripId){

  // function for this entire function body, so every ${t("...")} call below
  // was silently trying to call the trip object as a function instead
  // (TypeError, thrown and swallowed before the popup ever rendered). This
  // bug predates any of this conversation's changes.
  const trip = (state.trips||[]).find(x => x.id === tripId);
  if(!trip) return;
  closeFinishTripPopup();
  lockBodyScroll();
  const tripShipments = state.shipments.filter(s => s.tripId === tripId);
  const undelivered = tripShipments.filter(s => s.status !== 'delivered' && s.status !== 'pending');
  const overlay = document.createElement('div');
  overlay.id = 'finish-trip-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
