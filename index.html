  const panel = document.getElementById('panel');
  if(!_boatNameCache[CURRENT_BOAT_ID]){
    getCurrentBoatName().then(() => { if(state.tab === 'dashboard') renderDashboard(); });
  }
  const trips = (state.trips||[]).filter(t => !t.finished).slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const d = state.settings.tripDefaults || {};
  const hasDefaults = !!(d.boatContacts || d.trackingLink || d.viberLink);
  const ongoingTrip = trips.find(t => t.active && !t.finished);
  const boatRoutes = state.settings.routes || [];
  // Every island the boat is known to touch -- both explicit route origins
  // and every destination across every route -- so a return trip (e.g.
  // Feridhoo back to Male') can pick a destination island as its origin
  // too, not just the islands that have their own saved route.
  const allKnownIslands = [...new Set([
    ...boatRoutes.map(r => r.origin),
    ...boatRoutes.flatMap(r => r.destinations || [])
  ])];

  panel.innerHTML = `
    <h2>${t("Home")}</h2>
    <p class="sub">${t("Plan the next trip. The active trip's destinations show up on the customer check-in form automatically.")}</p>
    ${ongoingTrip ? `
      <div class="note" style="margin-bottom:16px;">A trip is currently in progress (${escapeHtml(ongoingTrip.origin)} \u2192 ${escapeHtml((ongoingTrip.destinations||[]).join(', '))}). Mark it finished before planning the next one.</div>
    ` : `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;background:#fff;">
        <h3>${t("New Trip")}</h3>
        ${boatRoutes.length === 0 ? `
          <div class="note" style="margin-bottom:12px;">No routes set up for this boat yet \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">add them in Trip Settings</a> to have destinations fill in automatically next time.</div>
        ` : ''}
        <label>${t("Origin")}</label>
        ${boatRoutes.length > 0 ? `
          <select id="trip-origin">
            <option value="" disabled selected>Select origin</option>
            ${allKnownIslands.map(origin => `<option value="${escapeHtml(origin)}">${escapeHtml(origin)}</option>`).join('')}
            <option value="__other">Other (type manually)</option>
          </select>
          <div style="position:relative;margin-top:6px;display:none;" id="trip-origin-other-wrap">
            <input type="text" id="trip-origin-other" placeholder="${t("Type to search islands…")}" autocomplete="off">
            <div class="item-results" id="trip-origin-results" style="display:none;"></div>
          </div>
        ` : `
          <div style="position:relative;">
            <input type="text" id="trip-origin-other" placeholder="${t("Type to search islands…")}" autocomplete="off">
            <div class="item-results" id="trip-origin-results" style="display:none;"></div>
          </div>
        `}
        <label>${t("Destinations (one per line)")}</label>
        <textarea id="trip-dests" rows="3" placeholder="${t("Fills in automatically once you pick an origin — edit if needed")}"></textarea>
        <div style="position:relative;margin-top:6px;margin-bottom:12px;">
          <input type="text" id="trip-dests-search" placeholder="${t("Type to search & add an island…")}" autocomplete="off">
          <div class="item-results" id="trip-dests-results" style="display:none;"></div>
        </div>
        <label>${t("Trip date")}</label>
        <input type="date" id="trip-date">
        <label>${t("Loading time")}</label>
        <input type="time" id="trip-loading">
        <label>${t("Estimated departure time")}</label>
        <input type="time" id="trip-departure">
        <label>${t("Loading location / jetty")}</label>
        <input type="text" id="trip-location" placeholder="${t("Fills in automatically once you pick an origin")}">
        ${hasDefaults ? `
          <div class="note">Boat contacts, tracking link, and Viber link are fixed and pulled in automatically from Owner Settings \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">edit them there</a> if they ever change.</div>
        ` : `
          <div class="note" style="border-color:var(--red);color:var(--red);">Boat contacts, tracking link, and Viber link aren't set yet \u2014 go to <a href="#settings" style="color:var(--red);font-weight:700;">Owner Settings</a> and add them first, or the announcement will show them blank.</div>
        `}
        <button class="btn btn-primary" id="create-trip-btn" style="margin-top:12px;">${t("Create Trip & Set Active")}</button>
      </div>
    `}
    <div id="trip-list" style="margin-top:20px;"></div>
  `;

  if(!ongoingTrip){
  if(boatRoutes.length > 0){
    document.getElementById('trip-origin').addEventListener('change', (e) => {
      const otherInput = document.getElementById('trip-origin-other');
      const otherWrap = document.getElementById('trip-origin-other-wrap');
      if(e.target.value === '__other'){
        otherWrap.style.display = '';
        otherInput.focus();
        return;
      }
      otherWrap.style.display = 'none';
      const rememberedLocations = state.settings.originLoadingLocations || {};
      const matchingRoutes = boatRoutes.filter(r => r.origin === e.target.value);
      if(matchingRoutes.length){
        // Known outbound route (e.g. Male' -> Maalhos, Himandhoo, Feridhoo)
        // -- fill in exactly as saved.
        const mergedDestinations = [...new Set(matchingRoutes.flatMap(r => r.destinations || []))];
        document.getElementById('trip-dests').value = mergedDestinations.join('\n');
        const routeWithLocation = matchingRoutes.find(r => r.location);
        document.getElementById('trip-location').value = routeWithLocation ? routeWithLocation.location : (rememberedLocations[e.target.value] || '');
      } else {
        // Origin is a destination-only island (e.g. Feridhoo, picked for a
        // return trip) -- there's no saved route to auto-fill from, so let
        // the owner pick which of the other known islands this return
        // trip stops at instead of leaving it blank. The loading location
        // still auto-fills here if this origin's been used before, even
        // without a full saved route.
        document.getElementById('trip-location').value = rememberedLocations[e.target.value] || '';
        openDestinationPickerPopup(e.target.value, allKnownIslands, boatRoutes);
      }
    });
  }

  // Same auto-fill as above, but for the free-text origin field -- used
  // either as the "Other" fallback within the dropdown, or as the only
  // origin field at all for a boat with no saved routes yet (the common
  // case early on). Fires on blur so it doesn't fight with typing, and
  // only fills in if the location field is still empty.
  const originOtherInput = document.getElementById('trip-origin-other');
  if(originOtherInput){
    originOtherInput.addEventListener('blur', () => {
      const typed = originOtherInput.value.trim();
      const locationField = document.getElementById('trip-location');
      const rememberedLocations = state.settings.originLoadingLocations || {};
      if(typed && locationField && !locationField.value.trim() && rememberedLocations[typed]){
        locationField.value = rememberedLocations[typed];
      }
    });
  }

  // Uses the themed island search popup (openIslandSearchPopup, wired
  // globally near the top of the script) instead of an inline dropdown --
  // gives the same atoll-grouped browse view and anchored-under-the-field
  // positioning as the New Trip form's other pickers.
  function wireIslandSearchDropdown(inputId, onPick, opts){
    const input = document.getElementById(inputId);
    if(!input) return;
    input.addEventListener('focus', () => openIslandSearchPopup(input, onPick, opts));
    input.addEventListener('input', () => { input._islandSearchRedraw && input._islandSearchRedraw(); });
    // Short delay so a tap on a result inside the popup (mousedown, below)
    // fires before this closes it -- standard pattern for this, works
    // reliably on touch.
    input.addEventListener('blur', () => {
      if(input._islandSearchScrollBlur){
        input._islandSearchScrollBlur = false;
        return; // scroll-triggered: just drop the keyboard, leave the list open
      }
      setTimeout(closeIslandSearchPopup, 150);
    });
  }
  wireIslandSearchDropdown('trip-origin-other', (islandName) => {
    const originSelect = document.getElementById('trip-origin');
    const otherInput = document.getElementById('trip-origin-other');
    if(originSelect){ originSelect.value = '__other'; }
    otherInput.value = islandName;
    otherInput.dispatchEvent(new Event('blur'));
    otherInput.blur();
  }, { closeOnPick: true });
  wireIslandSearchDropdown('trip-dests-search', (islandName) => {
    const destsField = document.getElementById('trip-dests');
    const existing = destsField.value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!existing.includes(islandName)) existing.push(islandName);
    destsField.value = existing.join('\n');
    document.getElementById('trip-dests-search').value = '';
  }, { closeOnPick: true });

  document.getElementById('create-trip-btn').addEventListener('click', async () => {
    const originSelect = document.getElementById('trip-origin');
    const origin = (originSelect && originSelect.value !== '__other' ? originSelect.value : document.getElementById('trip-origin-other').value).trim();
    const destinations = document.getElementById('trip-dests').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;
    const departureTime = document.getElementById('trip-departure').value;
    const location = document.getElementById('trip-location').value.trim();
    const fresh = state.settings.tripDefaults || {};
    const boatContacts = fresh.boatContacts || '';
    const trackingLink = fresh.trackingLink || '';
    const viberLink = fresh.viberLink || '';
    if(!origin || destinations.length === 0 || !date){ alert(t('Origin, at least one destination, and a date are required.')); return; }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    // Remember this loading location against this origin, regardless of
    // whether it came from a saved route or was typed by hand -- so next
    // time this origin is picked (including return trips with no saved
    // route at all), it's already filled in.
    if(location){
      const updatedSettings = Object.assign({}, state.settings, {
        originLoadingLocations: Object.assign({}, state.settings.originLoadingLocations || {}, { [origin]: location })
      });
      state.settings = updatedSettings;
      saveSettings(updatedSettings);
    }
    renderDashboard();
    createGoogleSheetForTrip(trip);
  });
  } // end ongoingTrip guard

  const list = panel.querySelector('#trip-list');
  if(trips.length === 0){ list.innerHTML = `<div class="empty">${t("No trips planned yet.")}</div>`; return; }

  list.innerHTML = trips.map(t => {
    const loadedCount = state.shipments.filter(s => s.tripId === t.id && s.status === 'loaded').length;
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    // 'pending' shipments were checked in but never actually loaded onto
    // the boat -- they aren't real cargo on this trip, so there's nothing
    // to warn about here (they're dropped entirely once the trip finishes,
    // see finishTrip).
    const undelivered = tripShipments.filter(s => s.status !== 'delivered' && s.status !== 'pending');
    const delivered = tripShipments.filter(s => s.status === 'delivered');
    const statusClass = t.finished ? 'status-delivered' : (t.departed ? 'status-in_transit' : (t.active?'status-delivered':'status-pending'));
    const statusLabel = t.finished ? 'Finished' : (t.departed ? 'In Transit' : (t.active?'Active':'Past'));
    return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill ${statusClass}">${statusLabel}</span>
          ${t.arrivedIsland && !t.finished ? `<span class="status-pill status-arrived">Boat Arrived ${escapeHtml(t.arrivedIsland)}</span>` : ''}
        </div>
      </div>
      <div class="tag-meta">${escapeHtml(t.location||'')}</div>
      ${t.finished ? `<div class="tag-meta">${delivered.length} delivered \u00b7 ${undelivered.length} undelivered</div>` : ''}
      ${t.departed && !t.finished ? `
        <div style="margin-top:10px;">
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:4px;">Boat arrived at</label>
          <select data-arrived-select="${t.id}">
            <option value="" ${!t.arrivedIsland ? 'selected' : ''}>Not arrived yet</option>
            ${(t.destinations||[]).map(isl => `<option value="${escapeHtml(isl)}" ${t.arrivedIsland===isl ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="tag-actions">
        ${!t.active && !t.finished ? `<button class="btn btn-amber" data-set-active="${t.id}">${t("Set Active")}</button>` : ''}
        ${t.active && !t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-transit="${t.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-finish="${t.id}">${t("Mark Trip Finished")}</button>` : ''}
        ${!t.finished ? `<button class="btn btn-ghost" data-copy-ann="${t.id}">${t("View & Copy Announcement")}</button>` : ''}
        <button class="btn btn-danger" data-del-trip="${t.id}">${t("Delete")}</button>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-mark-transit]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.')) return;
    const tripId = b.dataset.markTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    let moved;
    try{
      moved = await markTripInTransit(tripId);
    }catch(e){
      console.error('markTripInTransit failed', e);
      alert(t('Could not mark this trip in transit. Check your connection and try again.'));
      return;
    }
    if(trip) downloadTripManifest(trip, tripShipments);
    alert(`Trip marked in transit. ${moved} shipment(s) updated.`);
    renderTrips();
  }));

  list.querySelectorAll('[data-mark-finish]').forEach(b => b.addEventListener('click', () => {
    openFinishTripPopup(b.dataset.markFinish);
  }));

  list.querySelectorAll('[data-arrived-select]').forEach(sel => sel.addEventListener('change', () => {
    const tripId = sel.dataset.arrivedSelect;
    const island = sel.value || null;
    // Optimistic: apply the change locally and re-render immediately so it
    // feels instant, then persist safely (fetch-fresh + merge + save) in
    // the background. This is a simple find-by-id field update, so
    // applying it twice (once to the live state, once to the freshly
    // fetched copy inside withFreshTrips) is safe -- unlike an "add new
    // item" mutation, there's no risk of creating a duplicate.
    const localTrip = (state.trips || []).find(t => t.id === tripId);
    if(localTrip){ localTrip.arrivedIsland = island; localTrip.arrivedAt = island ? new Date().toISOString() : null; }
    state.dashIslandView = island;
    renderTrips();
    withFreshTrips(l => {
      const t = l.find(x => x.id === tripId);
      if(t){ t.arrivedIsland = island; t.arrivedAt = island ? new Date().toISOString() : null; }
    }).then(() => renderTrips());
  }));

  list.querySelectorAll('[data-set-active]').forEach(b => b.addEventListener('click', () => {
    const targetId = b.dataset.setActive;
    state.trips.forEach(t => t.active = (t.id === targetId));
    renderTrips();
    withFreshTrips(l => { l.forEach(t => t.active = (t.id === targetId)); }).then(() => renderTrips());
  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete this trip?')) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    openAnnouncementPopup(b.dataset.copyAnn);
  }));
}

/* ---------------- Invoices (owner only) ---------------- */
function renderShipmentsTab(){
  const panel = document.getElementById('panel');
  const all = state.shipments.filter(s => s.status !== 'pending');
  const delivered = all.filter(s => s.status === 'delivered');
  const undelivered = all.filter(s => s.status !== 'delivered');

  panel.innerHTML = `
    <h2>${t("Shipments")}</h2>
    <p class="sub">${t("Every shipment that's been loaded, whether or not it's been delivered or paid yet.")}</p>
    <div class="stat-grid">
      <button type="button" class="stat-card" id="delivered-stat-card" style="text-align:left;cursor:${delivered.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Delivered</div>
        <div class="sval" style="color:var(--green);">${delivered.length}</div>
      </button>
      <button type="button" class="stat-card" id="undelivered-stat-card" style="text-align:left;cursor:${undelivered.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Undelivered</div>
        <div class="sval" style="color:var(--red);">${undelivered.length}</div>
      </button>
    </div>
  `;
  if(delivered.length){
    document.getElementById('delivered-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Delivered Shipments', delivered,
      () => ({ title: 'Delivered Shipments', list: state.shipments.filter(s => s.status !== 'pending' && s.status === 'delivered') })
    ));
  }
  if(undelivered.length){
    document.getElementById('undelivered-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Undelivered Shipments', undelivered,
      () => ({ title: 'Undelivered Shipments', list: state.shipments.filter(s => s.status !== 'pending' && s.status !== 'delivered') })
    ));
  }
}

async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){ needsSave = true; }
  });
  if(needsSave){
    await withFreshShipments(list => {
      list.forEach(s => {
        if(s.items && s.items.length && !s.invoiceId){
          s.invoiceId = invoiceId();
          if(s.paid === undefined) s.paid = false;
        }
      });
    });
  }

  // The three summary stats cover every invoice ever generated, so the
  // numbers always add up (Total Invoiced = Paid + Unpaid) regardless of
  // whether the trip that carried them has since finished -- money owed
  // doesn't stop counting just because its trip moved to Reports. The
  // detailed list below stays focused on the current/active trip only,
  // matching "Invoices from finished trips move to Reports".
  const allInvoices = state.shipments.filter(s => s.invoiceId && !s.voided);
  const total = allInvoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = allInvoices.filter(s => !s.paid);
  const paid = allInvoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId && !isTripFinished(s.tripId)).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  const unpaidTotal = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const paidTotal = paid.reduce((sum,s) => sum + (s.total||0), 0);

  panel.innerHTML = `
    <h2>${t("Invoices")}</h2>
    <p class="sub">${t("Generated automatically when a shipment's items are logged. Invoices from finished trips move to Reports.")}</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <button type="button" class="stat-card" id="unpaid-stat-card" style="text-align:left;cursor:${unpaid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Unpaid${unpaid.length ? ` (${unpaid.length})` : ''}</div>
        <div class="sval" style="color:var(--red);">${unpaid.length ? fmtMoney(unpaidTotal) : '0'}</div>
      </button>
      <button type="button" class="stat-card" id="paid-stat-card" style="text-align:left;cursor:${paid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Paid${paid.length ? ` (${paid.length})` : ''}</div>
        <div class="sval" style="color:var(--green);">${paid.length ? fmtMoney(paidTotal) : '0'}</div>
      </button>
    </div>
    <div id="invoice-list"></div>
  `;

  if(unpaid.length){
    document.getElementById('unpaid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Unpaid Invoices', unpaid,
      () => ({ title: 'Unpaid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && !s.paid) })
    ));
  }
  if(paid.length){
    document.getElementById('paid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Paid Invoices', paid,
      () => ({ title: 'Paid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && s.paid) })
    ));
  }

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">${t("No invoices yet.")}</div>`; return; }

  list.innerHTML = sorted.map(s => {
    return `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">${t("Share")}</button>
        ${!s.voided && !s.paid ? `
          <button class="btn btn-primary" data-cash-open="${s.id}">${t("Collect — Cash")}</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">${t("Collect \u2014 Transfer")}</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">${t("Mark Unpaid")}</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">${t("Void")}</button>` : ''}
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { openInvoicePopup(b.dataset.invPrint); }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invPay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invPay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    openCashPopup(b.dataset.cashOpen);
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invUnpay);
      if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invUnpay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Void this invoice? It will be excluded from totals.')) return;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invVoid);
      if(s) s.voided = true;
    });
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  if(state.reportTripView && state.reportIslandView) return renderReportIslandDetail();
  if(state.reportTripView) return renderReportTripIslands();

  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided && s.paid);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.paidAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.paidAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

  const finishedTrips = (state.trips||[]).filter(t => t.finished).sort((a,b) => new Date(b.finishedAt) - new Date(a.finishedAt));

  panel.innerHTML = `
    <button type="button" class="btn btn-ghost" id="reports-back-to-settings-btn" style="margin-bottom:12px;">${t("\u2190 Back to Settings")}</button>
    <h2>${t("Revenue Reports")}</h2>
    <p class="sub">${t("Owner-only view. Revenue reflects collected (paid) payments only.")}</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat-card"><div class="slabel">${t("This Week")}</div><div class="sval">${fmtMoney(revWeek)}</div></div>
      <div class="stat-card"><div class="slabel">${t("Today")}</div><div class="sval">${fmtMoney(revToday)}</div></div>
      <div class="stat-card"><div class="slabel">Shipments Logged</div><div class="sval">${state.shipments.length}</div></div>
    </div>
    <div class="settings-block">
      <h3>${t("By Destination Island")}</h3>
      ${islandRows.length === 0 ? '<div class="empty">${t("No invoiced shipments yet.")}</div>' : `
        <div class="invoice" style="padding:14px 18px;">
          <table>
            <thead><tr><th>Island</th><th class="num">${t("Shipments")}</th><th class="num">Revenue</th></tr></thead>
            <tbody>
              ${islandRows.map(isl => `<tr><td>${escapeHtml(isl)}</td><td class="num">${byIsland[isl].count}</td><td class="num">${fmtMoney(byIsland[isl].revenue)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
    <div class="settings-block">
      <h3>${t("Trip Reports")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("Finished trips. Select one to see delivered/undelivered by destination island.")}</p>
      <div id="trip-report-list"></div>
    </div>
  `;

  document.getElementById('reports-back-to-settings-btn').addEventListener('click', () => {
    state.reportTripView = null; state.reportIslandView = null;
    renderSettings();
  });

  const listEl = panel.querySelector('#trip-report-list');
  if(finishedTrips.length === 0){
    listEl.innerHTML = `<div class="empty">${t("No finished trips yet.")}</div>`;
    return;
  }
  listEl.innerHTML = finishedTrips.map(t => {
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const delivered = tripShipments.filter(s => s.status === 'delivered').length;
    const undelivered = tripShipments.length - delivered;
    const unpaid = tripShipments.filter(s => !s.paid).length;
    return `
      <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:8px;">
        <button type="button" class="item-result-row" data-open-trip="${t.id}" style="flex:1;margin-bottom:0;">
          <span>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</span>
          <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
        </button>
      </div>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-trip]').forEach(b => b.addEventListener('click', () => {
    state.reportTripView = b.dataset.openTrip;
    state.reportIslandView = null;
    renderReports();
  }));
}

function renderReportTripIslands(){
  const panel = document.getElementById('panel');
  const t = (state.trips||[]).find(x => x.id === state.reportTripView);
  if(!t){ state.reportTripView = null; renderReports(); return; }
  const tripShipments = state.shipments.filter(s => s.tripId === t.id);

  panel.innerHTML = `
    <button class="btn btn-ghost" id="back-to-reports-btn" style="margin-bottom:14px;">${t("\u2190 Back to Reports")}</button>
    <h2>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</h2>
    <p class="sub">${fmtDMY(t.date)} \u00b7 Finished ${t.finishedAt ? fmtDate(t.finishedAt) : ''}</p>
    <div id="island-list"></div>
  `;
  document.getElementById('back-to-reports-btn').addEventListener('click', () => { state.reportTripView = null; renderReports(); });

  const islands = (t.destinations && t.destinations.length) ? t.destinations : [...new Set(tripShipments.map(s => s.island))];
  const listEl = document.getElementById('island-list');
  if(islands.length === 0){ listEl.innerHTML = `<div class="empty">${t("No destination islands on this trip.")}</div>`; return; }

    const undelivered = forIsland.length - delivered;
    const unpaid = forIsland.filter(s => !s.paid).length;

      <button type="button" class="item-result-row" data-open-island="${escapeHtml(isl)}" style="margin-bottom:8px;">

    state.reportIslandView = b.dataset.openIsland;
    renderReports();
  }));
}

function renderReportIslandDetail(){
  const panel = document.getElementById('panel');
  const t = (state.trips||[]).find(x => x.id === state.reportTripView);
  if(!t){ state.reportTripView = null; state.reportIslandView = null; renderReports(); return; }
  const island = state.reportIslandView;
  const shipments = state.shipments.filter(s => s.tripId === t.id && s.island === island);
  const delivered = shipments.filter(s => s.status === 'delivered');
  const undelivered = shipments.filter(s => s.status !== 'delivered');

  const daysSinceFinished = t.finishedAt ? (Date.now() - new Date(t.finishedAt).getTime()) / 86400000 : 0;
  const archiveEligible = daysSinceFinished >= 3;
  const toArchive = undelivered.filter(s => s.photo && !s.imageArchived);

  const renderUndeliveredRow = (s) => `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill" style="background:var(--red);color:#fff;">Undelivered</span>
      </div>
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span><br>${telLink(s.receiverMobile)}</div>` : ''}
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span><br>${telLink(s.mobile)}</div>
      ${s.items && s.items.length ? `<div class="tag-items">Items: ${s.items.map(i=>`${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ')}</div>` : ''}
      ${photoLinkHtml(s)}
      ${s.imageArchived ? `<div class="note" style="margin-top:8px;">${t("Image downloaded to owner's phone.")}</div>` : ''}
    </div>
  `;

  const renderDeliveredRow = (s) => `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${STATUS_LABELS[s.status]}</span>
      </div>
      ${s.receiverName ? `<div class="party-block"><span class="party-role">Receiver</span><span class="party-name">${escapeHtml(s.receiverName)}</span></div>` : ''}
      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span></div>
      ${s.items && s.items.length ? `<div class="tag-items">Items: ${s.items.map(i=>`${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ')}</div>` : ''}
    </div>

  const invoiced = shipments.filter(s => s.invoiceId);
  const paidInvoices = invoiced.filter(s => s.paid);
  const unpaidInvoices = invoiced.filter(s => !s.paid);
  const isOwner = state.role === 'owner' || state.role === 'manager';

  const renderInvoiceRow = (s) => {
    return `
    <div class="tag">
      ${isOwner ? `<button class="corner-delete" data-report-inv-delete="${s.id}" title="${t("Delete")}">\u00d7</button>` : ''}
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.paid ? 'status-delivered' : 'status-in_transit'}">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      ${isOwner ? `
        <div class="tag-actions">
          <button class="btn btn-ghost" data-report-inv-share="${s.id}">${t("Share")}</button>
          ${!s.paid ? `
            <button class="btn btn-primary" data-cash-open="${s.id}">${t("Collect — Cash")}</button>
            <button class="btn btn-primary" data-report-inv-pay="${s.id}" data-method="transfer">${t("Collect \u2014 Transfer")}</button>
          ` : ''}
          ${s.paid ? `<button class="btn btn-ghost" data-report-inv-unpay="${s.id}">${t("Mark Unpaid")}</button>` : ''}
        </div>
      ` : ''}
    </div>
  `;
  };

  const open = state.reportSectionsOpen;
  const section = (key, label, count, bodyHtml) => `
    <div class="settings-block" style="padding:0;overflow:hidden;">
      <button type="button" class="report-section-toggle" data-section-toggle="${key}" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:16px;cursor:pointer;text-align:left;">
        <h3 style="margin:0;">${label} (${count})</h3>
        <span style="font-size:14px;color:var(--ink-soft);transform:rotate(${open[key] ? '180deg' : '0deg'});transition:transform .15s;">\u25be</span>
      </button>
      ${open[key] ? `<div style="padding:0 16px 16px;">${bodyHtml}</div>` : ''}
    </div>
  `;

  panel.innerHTML = `
    <button class="btn btn-ghost" id="back-to-islands-btn" style="margin-bottom:14px;">${t("\u2190 Back to Islands")}</button>
    <h2>${escapeHtml(island)}</h2>
    <p class="sub">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</p>
    ${section('undelivered', 'Undelivered', undelivered.length, `
      ${(archiveEligible && toArchive.length) ? `
        <button class="btn btn-amber" id="archive-photos-btn" style="margin-bottom:14px;">Download &amp; Archive ${toArchive.length} Photo${toArchive.length===1?'':'s'} to This Phone</button>
      ` : ''}

    ${section('delivered', 'Delivered', delivered.length, `
      ${delivered.length === 0 ? '<div class="empty">${t("Nothing delivered yet for this island.")}</div>' : delivered.map(renderDeliveredRow).join('')}

    ${section('invoicesUnpaid', 'Invoices \u2014 Unpaid', unpaidInvoices.length, `
      ${!isOwner ? `<p class="sub" style="margin-bottom:12px;">${t("Owner-only.")}</p>` : ''}
      ${unpaidInvoices.length === 0 ? '<div class="empty">${t("No unpaid invoices for this island.")}</div>' : unpaidInvoices.map(renderInvoiceRow).join('')}
    `)}
    ${section('invoicesPaid', 'Invoices \u2014 Paid', paidInvoices.length, `
      ${!isOwner ? `<p class="sub" style="margin-bottom:12px;">${t("Owner-only.")}</p>` : ''}
      ${paidInvoices.length === 0 ? '<div class="empty">${t("No paid invoices for this island.")}</div>' : paidInvoices.map(renderInvoiceRow).join('')}
    `)}
  `;
  document.getElementById('back-to-islands-btn').addEventListener('click', () => { state.reportIslandView = null; renderReports(); });
  document.querySelectorAll('[data-section-toggle]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.sectionToggle;
    state.reportSectionsOpen[key] = !state.reportSectionsOpen[key];
    renderReportIslandDetail();
  }));

  document.getElementById('archive-photos-btn')?.addEventListener('click', async () => {
    for(const s of toArchive){ downloadPhoto(s); }
    const idsToArchive = new Set(toArchive.map(s => s.id));
    await withFreshShipments(list => {
      list.forEach(s => { if(idsToArchive.has(s.id)){ s.photo = null; s.imageArchived = true; } });
    });
    renderReportIslandDetail();
  });

  if(isOwner){
    panel.querySelectorAll('[data-report-inv-share]').forEach(b => b.addEventListener('click', () => { openInvoicePopup(b.dataset.reportInvShare); }));
    panel.querySelectorAll('[data-report-inv-pay]').forEach(b => b.addEventListener('click', async () => {
      await withFreshShipments(list => {
        const s = list.find(x => x.id === b.dataset.reportInvPay);
        if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
      });
      syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.reportInvPay));
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-report-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
      await withFreshShipments(list => {
        const s = list.find(x => x.id === b.dataset.reportInvUnpay);
        if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
      });
      syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.reportInvUnpay));
      renderReportIslandDetail();
    }));
    panel.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
      openCashPopup(b.dataset.cashOpen);
    }));
    panel.querySelectorAll('[data-report-inv-delete]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('Delete this invoice permanently? This cannot be undone.')) return;
      await withFreshShipments(list => {
        const idx = list.findIndex(x => x.id === b.dataset.reportInvDelete);
        if(idx > -1) list.splice(idx, 1);
      });
      renderReportIslandDetail();
    }));
  }
}

// Filenames use both parties' name + mobile, sanitized for the filesystem.
function safeFilenamePart(str){
  return (str||'').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'') || 'unknown';
}
function photoFilename(s){
  const senderPart = `${safeFilenamePart(s.name)}-${safeFilenamePart(s.mobile)}`;
  const receiverPart = `${safeFilenamePart(s.receiverName)}-${safeFilenamePart(s.receiverMobile)}`;
  return `${senderPart}_${receiverPart}.jpg`;
}
// Shows the photo as a tappable filename link rather than an inline image --
// nobody has to scroll past a photo they didn't ask to see; tapping expands
// it right here on the page instead of navigating away to a new tab.
function photoLinkHtml(s){
  if(!s.photo) return '';
  return `
    <details class="items-details" style="margin-top:8px;">
      <summary>\ud83d\udcf7 ${escapeHtml(photoFilename(s))}</summary>
      <div class="items-body">
        <img src="${s.photo}" alt="Loading photo" style="max-width:100%;border-radius:8px;margin-top:8px;display:block;">
      </div>
    </details>
  `;
}
function downloadPhoto(s){
  if(!s.photo) return;
  const a = document.createElement('a');
  a.href = s.photo;
  a.download = photoFilename(s);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari often ignores the download attribute for data URLs and just
  // navigates instead -- opening it in a new tab too means there's always a
  // way to save it (long-press -> Save Image) even if the click above does
  // nothing visible.
  window.open(dataUrl, '_blank');
}

// Trip manifest export -- a self-contained HTML report of every cargo item
// on the trip, including each shipment's loading photo (a CSV can't embed
// images meaningfully, so HTML is used instead -- it opens in any browser
// or photo viewer and saves straight to the device). No external service
// involved, whoever marks the trip in transit (owner or manager) gets this
// on their own phone.
function buildTripManifestHTML(trip, shipments){
  const rows = shipments.map(s => {
    const items = (s.items||[]).map(i => `${i.qty}x ${escapeHtml(i.name)}`).join(', ');
    return `
      <tr>
        <td>${escapeHtml(s.id)}</td>
        <td>${escapeHtml(s.name)}<br><span class="muted">${escapeHtml(s.mobile||'')}</span></td>
        <td>${escapeHtml(s.receiverName||'\u2014')}<br><span class="muted">${escapeHtml(s.receiverMobile||'')}</span></td>
        <td>${escapeHtml(s.island||'')}</td>
        <td>${items}</td>
        <td>${fmtMoney(s.total||0)}</td>
        <td>${s.paid ? 'Paid' : 'Unpaid'}</td>
        <td>${s.photo ? `<img src="${s.photo}" alt="Loading photo for ${escapeHtml(s.id)}">` : '<span class="muted">No photo</span>'}</td>
      </tr>
    `;
  }).join('');
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trip Manifest</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#1a2e22;}
  h1{font-size:20px;margin-bottom:2px;}
  p.sub{color:#6b7a70;margin-top:0;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;}
  th{background:#0f3d2e;color:#fff;}
  .muted{color:#888;font-size:12px;}
  img{max-width:140px;max-height:140px;border-radius:6px;display:block;}
</style></head>
<body>
  <h1>${escapeHtml(trip.origin)} \u2192 ${escapeHtml((trip.destinations||[]).join(', '))}</h1>
  <p class="sub">${escapeHtml(fmtDMY(trip.date))} \u00b7 ${shipments.length} shipment(s)</p>
  <table>
    <thead><tr><th>Tracking Code</th><th>Sender</th><th>Receiver</th><th>Island</th><th>Items</th><th>Total</th><th>Payment</th><th>Photo</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
</body></html>`;
}
function downloadTripManifest(trip, shipments){
  if(!shipments.length) return;
  const html = buildTripManifestHTML(trip, shipments);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const rawName = `${trip.origin}-to-${(trip.destinations||[]).join('-')}-${trip.date}-manifest.html`;
  const filename = rawName.replace(/[^a-zA-Z0-9.\-]+/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// translation at whatever state.lang was the moment this script first

      <button class="btn btn-ghost" id="report-view-detailed-btn" style="width:100%;">${t("View Detailed Reports →")}</button>
    </div>
  `;
  body.querySelectorAll('[data-report-preset]').forEach(b => b.addEventListener('click', () => {
    const now = new Date();
    const fromEl = document.getElementById('report-gen-from');

// Builds a summary (revenue, counts, per-island breakdown, paid/unpaid
// split) for shipments logged within the chosen date range and shows it
// in a popup, with a Download button that exports the same summary as a
// plain-text file.
function openGeneratedReportPopup(from, to){
  const inRange = state.shipments.filter(s => s.loadedAt && !s.voided && new Date(s.loadedAt) >= from && new Date(s.loadedAt) <= to);
  const invoiced = inRange.filter(s => s.items && s.items.length);
  let totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const paid = invoiced.filter(s => s.paid);
  const unpaid = invoiced.filter(s => !s.paid);
  let paidRevenue = paid.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaidRevenue = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  let invoicedCount = invoiced.length;
  let paidCount = paid.length;

  // Delivered+paid shipments older than 12 hours get folded into a
  // per-month total and removed (see cleanupCompletedShipments) -- merge
  // those archived totals back in here for any month fully covered by
  // this date range, so a report covering past months doesn't silently
  // undercount once the individual records are gone. A month only
  // partially covered by the range is skipped, since the archived total
  // can't be split by day -- so a partial-month report may run slightly
  // low on already-archived data specifically.
  const monthlyReports = state.settings.monthlyReports || {};
  let includedArchivedMonth = false;
  Object.keys(monthlyReports).forEach(key => {
    const [y,m] = key.split('-').map(Number);
    const monthStart = new Date(y, m-1, 1, 0,0,0);
    const monthEnd = new Date(y, m, 0, 23,59,59);
    if(monthStart >= from && monthEnd <= to){
      const agg = monthlyReports[key];
      totalRevenue += agg.revenue || 0;
      paidRevenue += agg.revenue || 0; // archived shipments were paid by definition
      invoicedCount += agg.shipmentCount || 0;
      paidCount += agg.shipmentCount || 0;
      includedArchivedMonth = true;
      Object.keys(agg.byIsland||{}).forEach(isl => {
        byIsland[isl] = byIsland[isl] || {count:0, revenue:0};
        byIsland[isl].count += agg.byIsland[isl].count;
        byIsland[isl].revenue += agg.byIsland[isl].revenue;
      });
    }
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);
  const rangeLabel = `${fmtDMY(from.toISOString())} \u2013 ${fmtDMY(to.toISOString())}`;

  closeGeneratedReportPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'generated-report-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="generated-report-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin-bottom:2px;">${t("Report")}</h3>
        <button type="button" class="btn btn-ghost" id="generated-report-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:14px;">${escapeHtml(rangeLabel)}</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">${t("Shipments")}</div><div class="sval">${invoicedCount}</div></div>
        <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${fmtMoney(paidRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${fmtMoney(unpaidRevenue)}</div></div>
      </div>
      ${includedArchivedMonth ? `<p class="note" style="margin-top:10px;">Includes archived totals for fully-covered past months \u2014 individual delivered &amp; paid records older than 12 hours are summarized here rather than kept in full.</p>` : ''}
      <h3 style="margin-top:18px;margin-bottom:8px;">${t("By Island")}</h3>
      ${islandRows.length ? islandRows.map(isl => `
        <div class="rate-row">
          <div class="name">${escapeHtml(isl)}</div>
          <div class="price">${byIsland[isl].count} shipment${byIsland[isl].count===1?'':'s'}</div>
          <div class="amt">${fmtMoney(byIsland[isl].revenue)}</div>
        </div>
      `).join('') : `<div class="empty" style="padding:16px 0;">${t("No shipments in this period.")}</div>`}
      <button class="btn btn-primary" id="generated-report-download-btn" style="width:100%;margin-top:18px;">${t("Download Report")}</button>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeGeneratedReportPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('generated-report-popup-close-btn').addEventListener('click', closeGeneratedReportPopup);
  document.getElementById('generated-report-download-btn').addEventListener('click', async () => {
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || await getCurrentBoatName();
    const lines = [
      `${boatName} -- Report`,
      rangeLabel,
      '',
      `Total Revenue: ${fmtMoney(totalRevenue)}`,
      `Shipments: ${invoicedCount}`,
      `Paid: ${fmtMoney(paidRevenue)} (${paidCount})`,
      `Unpaid: ${fmtMoney(unpaidRevenue)} (${unpaid.length})`,
      '',
      'By Island:',
      ...islandRows.map(isl => `  ${isl}: ${byIsland[isl].count} shipment(s), ${fmtMoney(byIsland[isl].revenue)}`),
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report-${fromVal_(from)}-to-${fromVal_(to)}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
}
function fromVal_(d){ return d.toISOString().slice(0,10); }
function closeGeneratedReportPopup(){
  if(document.getElementById('generated-report-popup-overlay')) unlockBodyScroll();
  document.getElementById('generated-report-popup-overlay')?.remove();
}

function renderSettings(){
  const panel = document.getElementById('panel');
  const isManager = state.role === 'manager';
  const SETTINGS_SUBTABS = getSettingsSubtabs();
  const visibleSubtabs = isManager ? SETTINGS_SUBTABS.filter(t => MANAGER_SETTINGS_SUBTABS.includes(t.id)) : SETTINGS_SUBTABS;
  if(!visibleSubtabs.some(t => t.id === state.settingsTab)) state.settingsTab = visibleSubtabs[0].id;
  const subtabs = visibleSubtabs.map(t =>
    `<button class="${t.id===state.settingsTab?'active':''}" data-subtab="${t.id}">${t.label}</button>`
  ).join('');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <h2 style="margin-bottom:4px;">${t("Settings")}</h2>
        <p class="sub" style="margin-bottom:0;">${isManager ? 'Manager access. Staff and trip settings for this boat.' : 'Owner-only. Manage staff access, item prices, and app links.'}</p>
      </div>
      <button type="button" id="settings-lang-toggle-btn" class="btn btn-ghost" style="flex-shrink:0;"></button>
    </div>
    <div class="sub-tabs" style="margin-top:18px;">${subtabs}</div>
    <div id="settings-body"></div>
  `;
  renderLangToggle();
  document.getElementById('settings-lang-toggle-btn').addEventListener('click', () => {
    const switchingToDhivehi = state.lang !== 'dv';
    // Switching back to English is always free -- only switching into
    // Dhivehi is the Pro-gated direction.
    if(switchingToDhivehi && !isProAccount()){
      openUpgradeToProPopup();
      return;
    }
    setLang(switchingToDhivehi ? 'dv' : 'en');
    // Belt-and-suspenders: setLang() already re-renders via handleHash(),
    // but calling renderSettings() directly here guarantees this screen
    // (sub-tabs, labels, and whichever settings section is open) is
    // rebuilt immediately with the new language, regardless of what hash
    // routing decides.
    renderSettings();
  });
  panel.querySelectorAll('[data-subtab]').forEach(b => b.addEventListener('click', () => {
    state.settingsTab = b.dataset.subtab;
    renderSettings();
  }));

  if(state.settingsTab === 'owner' && !isManager) renderOwnerSettings();
  else if(state.settingsTab === 'staff') renderStaffManagement();
  else if(state.settingsTab === 'trip') renderTripSettings();
  else if(state.settingsTab === 'customers' && !isManager) renderCustomerDirectory();
  else if(state.settingsTab === 'reports') renderReportsSettingsSection();
  else if(!isManager) renderRatesSetup();
}

            <button class="btn btn-primary" id="manager-invite-create-btn" style="flex:1;">${t("Add Manager")}</button>
          </div>
        </div>
      `;
      document.getElementById('manager-invite-cancel-btn').addEventListener('click', closeManagerInviteModal);
      const checkManagerMobile = wireMobileValidation('manager-invite-mobile');
      document.getElementById('manager-invite-create-btn').addEventListener('click', async () => {
        const name = document.getElementById('manager-invite-name').value.trim();
        const mobile = document.getElementById('manager-invite-mobile').value.trim();
        if(!name){ alert('Enter the manager\u2019s name.'); return; }
        if(!checkManagerMobile()) return;
        let newPin = '', newUsername = '';
        await withFreshSettings(async fresh => {
          const managers = fresh.managerUsers || (fresh.managerUsers = []);
          const staffPins = (fresh.staffUsers||[]).map(u => u.pin);
          const usedPins = new Set(managers.map(u => u.pin).concat(staffPins).concat([fresh.ownerPin]));
          do { newPin = String(Math.floor(1000 + Math.random()*9000)); } while(usedPins.has(newPin));
          const allUsernames = managers.map(u => u.username).concat((fresh.staffUsers||[]).map(u => u.username)).filter(Boolean);
          newUsername = await generateStaffUsername(name, allUsernames);
          managers.push({id:'manager-'+Date.now(), name, mobile, pin:newPin, username:newUsername});
        });
        closeManagerInviteModal();
        renderManagerList();
        openStaffSharePanel(name, newPin, managerUrl, newUsername);
      });
    });
  }
}

    <div class="settings-block">
      <h3>${t("Trip Defaults")}</h3>

            <label>${t("Destinations (one per line)")}</label>
            <textarea id="route-dests-input" rows="2" placeholder="e.g. Maalhos&#10;Himandhoo&#10;Feridhoo"></textarea>
          ` : `
            <label>${t("Destination")}</label>
            <input type="text" id="route-dests-input" placeholder="${t("e.g. Maalhos")}">
            <div class="note" style="margin:4px 0 0;">${t('Free plan: 1 origin, 1 destination. Upgrade to Pro for multiple routes and destinations.')}</div>

          <label>${t("Loading location / jetty (optional)")}</label>
          <input type="text" id="route-location-input" placeholder="${t("e.g. Male' T-Jetty Area")}">
          <button class="btn btn-primary" id="add-route-btn" style="width:100%;">${t("+ Add Route")}</button>
        </div>

    state.settingsEdit.tripContacts = false;

  byId('edit-trip-tracking-btn')?.addEventListener('click', () => { state.settingsEdit.tripTracking = true; renderTripSettings(); });
  byId('cancel-trip-tracking-btn')?.addEventListener('click', () => { state.settingsEdit.tripTracking = false; renderTripSettings(); });
  byId('save-trip-tracking-btn')?.addEventListener('click', async () => {
    const trackingLink = byId('trip-tracking-input').value.trim();
    await withFreshSettings(fresh => { fresh.tripDefaults = Object.assign({}, fresh.tripDefaults, { trackingLink }); });
    state.settingsEdit.tripTracking = false;
    renderTripSettings();
  });

  byId('edit-trip-viber-btn')?.addEventListener('click', () => { state.settingsEdit.tripViber = true; renderTripSettings(); });
  byId('cancel-trip-viber-btn')?.addEventListener('click', () => { state.settingsEdit.tripViber = false; renderTripSettings(); });
  byId('save-trip-viber-btn')?.addEventListener('click', async () => {

    // Free plan renders a single-line input for this field instead of the
    // Pro textarea, so there's nothing to split on newlines there -- just
    // take the one value. Either way, non-Pro accounts are hard-capped at
    // one destination and one route total here too, not just hidden in
    // the UI, in case this ever gets called from somewhere that skipped
    // the render-time gating above.
    let destinations = destsInput.tagName === 'TEXTAREA'
      ? destsInput.value.split('\n').map(s=>s.trim()).filter(Boolean)
      : [destsInput.value.trim()].filter(Boolean);
    if(!isProAccount()){
      if((state.settings.routes||[]).length >= 1){ openUpgradeToProPopup(); return; }
      destinations = destinations.slice(0, 1);
    }
    const location = byId('route-location-input').value.trim();
    if(!origin || destinations.length === 0){ alert(t('Enter an origin and at least one destination.')); return; }
    await withFreshSettings(fresh => {
      fresh.routes = fresh.routes || [];
      fresh.routes.push({ origin, destinations, location });
    });
    renderTripSettings();
  });
  byId('routes-upgrade-btn')?.addEventListener('click', () => openUpgradeToProPopup());
  document.querySelectorAll('[data-del-route]').forEach(b => b.addEventListener('click', async () => {
    const idx = parseInt(b.dataset.delRoute, 10);
    if(!confirm('Remove this route?')) return;
    await withFreshSettings(fresh => {
      if(fresh.routes) fresh.routes.splice(idx, 1);
    });
    renderTripSettings();
  }));

  document.querySelectorAll('[data-save-island-coord]').forEach(b => b.addEventListener('click', async () => {
    const island = b.dataset.saveIslandCoord;
    const input = document.querySelector(`[data-island-coord-input="${CSS.escape(island)}"]`);
    const parsed = parseLatLngFromText(input ? input.value : '');
    if(!parsed){ alert(t('Could not find coordinates in that \u2014 paste a Google Maps link or a "lat, lng" pair.')); return; }
    await withFreshSettings(fresh => {
      fresh.islandCoords = fresh.islandCoords || {};
      fresh.islandCoords[island] = parsed;
    });
    renderTripSettings();
  }));
  document.querySelectorAll('[data-clear-island-coord]').forEach(b => b.addEventListener('click', async () => {
    const island = b.dataset.clearIslandCoord;
    await withFreshSettings(fresh => {
      if(fresh.islandCoords) delete fresh.islandCoords[island];
    });
    renderTripSettings();
  }));
}

async function loadGoogleSheetsStatus(){
  const el = document.getElementById('google-sheets-status');
  if(!el) return;
  try{
    const res = await fetch(`${API_BASE}/api/google/status?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
    const data = await res.json().catch(() => ({}));
    if(!document.getElementById('google-sheets-status')) return; // navigated away
    if(!data.configured){
      el.innerHTML = `<div class="empty">${t("This feature isn't set up on the server yet. Ask your developer to add Google API credentials.")}</div>`;
      return;
    }
    if(data.connected){
      el.innerHTML = `
        <div class="view-field"><span class="vf-value" style="font-family:'Inter',sans-serif;">${escapeHtml(data.email)}</span></div>
        <button class="btn btn-ghost" id="google-disconnect-btn" style="width:100%;margin-top:8px;">${t("Disconnect Google Account")}</button>
      `;
      document.getElementById('google-disconnect-btn').addEventListener('click', () => {
        if(!confirm('Disconnect this Google account? New trips will stop getting sheets until you reconnect.')) return;
        fetch(`${API_BASE}/api/google/disconnect`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatId: CURRENT_BOAT_ID })
        }).then(() => loadGoogleSheetsStatus());
      });
    } else {
      el.innerHTML = `<button class="btn btn-primary" id="google-connect-btn" style="width:100%;">${t("Connect Google Account")}</button>`;
      document.getElementById('google-connect-btn').addEventListener('click', async () => {
        const r = await fetch(`${API_BASE}/api/google/auth-url?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
        const d = await r.json().catch(() => ({}));
        if(d.url) location.href = d.url;
        else alert(t('Could not start Google connection. Try again.'));
      });
    }
  }catch(e){
    console.error('loadGoogleSheetsStatus failed', e);
    if(el) el.innerHTML = `<div class="empty">${t("Could not check Google connection status.")}</div>`;
  }
}

// Customers aren't a separate saved list -- they're derived live from every
// shipment ever logged for this boat, deduplicated by mobile number (the
// true unique identifier, since two different senders can share a name).
// This keeps the directory always in sync with real activity with no extra
// data entry or storage needed.
function renderCustomerDirectory(){
  const body = document.getElementById('settings-body');
  const routes = state.settings.routes || [];
  const routeIslands = new Set();
  routes.forEach(r => (r.destinations||[]).forEach(d => routeIslands.add(d)));
  (state.shipments||[]).forEach(s => { if(s.island) routeIslands.add(s.island); });
  const islands = Array.from(routeIslands).sort();
  const selectedIsland = state.customerDirectoryIsland || '';

  const byMobile = new Map();
  (state.shipments||[]).forEach(s => {
    if(selectedIsland && s.island !== selectedIsland) return;
    if(s.mobile && s.name){
      const key = s.mobile;
      if(!byMobile.has(key)) byMobile.set(key, { name: s.name, mobile: s.mobile, islands: new Set() });
      if(s.island) byMobile.get(key).islands.add(s.island);
    }
  });
  const customers = Array.from(byMobile.values()).sort((a,b) => a.name.localeCompare(b.name));

  body.innerHTML = `
    <div class="settings-block">
      <h3>${t("Customer Check-In Link")}</h3>
      <div class="url-box"><div><div class="tag-label">Put this on your QR code / share with customers</div><div class="u">${escapeHtml(baseUrl() + '#c/' + CURRENT_BOAT_ID)}</div></div></div>
      <div class="note">${t("This is what your senders and receivers use to check in cargo and track shipments for THIS boat specifically.")}</div>
      <div style="text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(baseUrl() + '#c/' + CURRENT_BOAT_ID)}" alt="QR code for this boat's customer check-in link" width="220" height="220" style="max-width:100%;">
        <div class="note" style="margin-top:10px;">${t("Print this or display it on the boat -- customers scan it with their phone camera to check in cargo. Press and hold the image to save it to your phone.")}</div>
      </div>
    </div>

    <div class="settings-block">
      <h3>${t("Customers")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("Everyone who has sent cargo on this boat, one entry per mobile number (in case two senders share a name).")}</p>
      <label>${t("Filter by island")}</label>
      <select id="customer-island-filter">
        <option value="">All islands</option>
        ${islands.map(isl => `<option value="${escapeHtml(isl)}" ${selectedIsland===isl?'selected':''}>${escapeHtml(isl)}</option>`).join('')}
      </select>
      <div style="margin-top:14px;">
        ${customers.length === 0 ? '<div class="empty">${t("No customers yet.")}</div>' : customers.map(c => `
          <div class="item-result-row" style="margin-bottom:6px;">
            <span>${escapeHtml(c.name)} \u2014 ${escapeHtml(c.mobile)}</span>
            <span class="rprice">${escapeHtml(Array.from(c.islands).join(', '))}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('customer-island-filter').addEventListener('change', (e) => {
    state.customerDirectoryIsland = e.target.value;
    renderCustomerDirectory();
  });
}

    document.querySelectorAll('[data-rate-price]').forEach(inp => inp.addEventListener('change', async () => { state.rates[inp.dataset.ratePrice].price = parseFloat(inp.value) || 0; await saveRates(state.rates); }));
    document.querySelectorAll('[data-rate-del]').forEach(b => b.addEventListener('click', async () => {
      const idx = b.dataset.rateDel;
      const item = state.rates[idx];
      if(!item) return;
      if(!confirm(`Remove "${item.name}" from the item list? This can't be undone.`)) return;
      state.rates.splice(idx,1);
      await saveRates(state.rates);
      renderRatesList();
    }));
  };
  renderRatesList();

  document.getElementById('add-rate-btn').addEventListener('click', async () => {
    const name = document.getElementById('new-rate-name').value.trim();
    const price = parseFloat(document.getElementById('new-rate-price').value) || 0;
    if(!name) return;
    state.rates.push({id:'rate-'+Date.now(), name, price});
    await saveRates(state.rates);
    document.getElementById('new-rate-name').value=''; document.getElementById('new-rate-price').value='';
    renderRatesList();
  });

  document.getElementById('save-qr-btn').addEventListener('click', async () => {
    state.settings.qrUrl = document.getElementById('qr-url-input').value.trim();
    await saveSettings(state.settings);
    renderSettings();
  });
}

let lastRenderedTab = null;
function render(){
  renderLangToggle();
  updateHeaderProBadge();
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    renderGate();
    return;
  }
  document.getElementById('gate-area').innerHTML = '';
  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('panel').style.display = 'block';

  if(state.entryMode === 'customer'){ renderModeToggle(); }
  else { document.getElementById('mode-toggle').style.display = 'none'; }

  renderTabs();

  const allowed = getRoleTabs()[state.role].map(t => t.id);
  if(!allowed.includes(state.tab)) state.tab = DEFAULT_TAB[state.role];
  if(!(state.tab === 'settings' && state.settingsTab === 'reports')){ state.reportTripView = null; state.reportIslandView = null; }

  // Every time the Dashboard is freshly opened (not on every re-render
  // while already there, e.g. from polling) it lands on whichever island
  // the boat has actually arrived at, per the Trips tab's "Boat arrived
  // at" selection -- staff don't have to re-tap the island chip each time
  // they switch back in.
  if(state.tab === 'dashboard' && lastRenderedTab !== 'dashboard'){
    const arrived = activeTripArrivedIsland();
    if(arrived) state.dashIslandView = arrived;
  }
  if(state.tab !== lastRenderedTab){
    document.querySelector('.shell')?.style.setProperty('--tp', '0');
    document.querySelector('.shell')?.classList.remove('badge-tucked');
    const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
    if(scrollable) scrollable.scrollTop = 0;
  }
  lastRenderedTab = state.tab;

  // Cash popup can be opened from Dashboard, Invoices, or Reports -- only
  // clean it up when navigating to some other tab entirely, not on every
  // render (which includes background polling refreshes while it's open).
  if(!['dashboard','invoices','reports'].includes(state.tab)){
    if(document.getElementById('cash-popup-overlay')) unlockBodyScroll();
    document.getElementById('cash-popup-overlay')?.remove();
  }

  if(state.tab !== 'dashboard'){
    // Same three overlays as above -- if the person switches tabs while
    // one is open (rather than closing it first), it was being yanked out
    // of the DOM directly here without ever going through its close
    // function, which is exactly what left the scroll lock stuck on and
    // caused the same page-jump bug through a second path.
    if(document.getElementById('load-modal-overlay') || document.getElementById('invoice-popup-overlay') || document.getElementById('deliver-other-popup-overlay')) unlockBodyScroll();
    document.getElementById('load-modal-overlay')?.remove();
    document.getElementById('invoice-popup-overlay')?.remove();
    document.getElementById('deliver-other-popup-overlay')?.remove();
  }
  if(state.tab !== 'dashboard'){
    if(document.getElementById('finish-trip-popup-overlay') || document.getElementById('dest-picker-popup-overlay')) unlockBodyScroll();
    document.getElementById('finish-trip-popup-overlay')?.remove();
    document.getElementById('dest-picker-popup-overlay')?.remove();
  }
  if(state.tab !== 'invoices'){
    if(document.getElementById('invoice-list-popup-overlay')) unlockBodyScroll();
    document.getElementById('invoice-list-popup-overlay')?.remove();
  }

  if(state.tab === 'dashboard'){ renderDashboard(); wireLoadFormEvents(); }
  else if(state.tab === 'checkin'){ renderCheckin(); }
  else if(state.tab === 'track'){ renderTrack(); }
  else if(state.tab === 'invoices'){ renderInvoices(); }
  else if(state.tab === 'shipments'){ renderShipmentsTab(); }
  else if(state.tab === 'settings'){ renderSettings(); }
}

const _origRenderDashboard = renderDashboard;
renderDashboard = function(){
  const scrollY = window.scrollY;
  _origRenderDashboard();
  wireLoadFormEvents();
  // Restoring a stale scrollY blindly is unsafe whenever the re-render
  // makes the page shorter than before (a form collapsing, a card
  // finishing and shrinking, etc.) -- the browser just leaves the
  // viewport wherever that position lands, which can be past the actual
  // content, looking like the top of the page got cut off. Clamping to
  // the real scrollable height after the re-render fixes that generally,
  // for any case like this rather than one at a time.
  const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.min(scrollY, maxScroll));
};

async function openQrScanner(){
  loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js').catch(e => console.error('jsQR failed to load', e));
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;">
      <span style="color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;">${t("Scan Boat QR Code")}</span>
      <button id="qr-scan-close" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:8px 14px;border-radius:8px;flex-shrink:0;">\u00d7</button>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <video id="qr-scan-video" autoplay playsinline muted style="max-width:100%;max-height:100%;"></video>
      <div style="position:absolute;width:70%;aspect-ratio:1;border:2px solid var(--teal-light);border-radius:12px;pointer-events:none;"></div>
    </div>
    <div id="qr-scan-status" style="color:rgba(255,255,255,0.75);text-align:center;padding:14px;font-size:13.5px;">Point your camera at the boat's QR code.</div>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector('#qr-scan-video');
  const statusEl = overlay.querySelector('#qr-scan-status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let stopped = false;

  const cleanup = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    overlay.remove();
  };
  overlay.querySelector('#qr-scan-close').addEventListener('click', cleanup);

  const tick = () => {
    if(stopped) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = typeof jsQR === 'function' ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if(code && code.data){
        statusEl.textContent = 'Got it \u2014 opening...';
        try{
          const url = new URL(code.data, location.href);
          if(url.origin === location.origin){
            cleanup();
            location.hash = url.hash.replace('#','');
            return;
          }
        }catch(e){ /* not a valid URL, fall through */ }
        statusEl.textContent = "That doesn't look like a SeaFare QR code. Try again.";
      }
    }
    requestAnimationFrame(tick);
  };

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
      stream = s;
      video.srcObject = s;
      requestAnimationFrame(tick);
    })
    .catch(() => {
      statusEl.textContent = "Couldn't access the camera. Check your browser's camera permission for this site.";
    });
}

async function adminFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const creds = { username: state.adminUsername, passkey: state.adminPasskey };
  let url = `${API_BASE}${path}`;
  let body;
  if(method === 'GET'){
    url += (path.includes('?') ? '&' : '?') + `username=${encodeURIComponent(creds.username)}&passkey=${encodeURIComponent(creds.passkey)}`;
  } else {
    body = JSON.stringify(Object.assign({}, opts.body || {}, creds));
  }
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ state.adminAuthed = false; clearAdminSession(); stopAdminNotificationPolling(); state.adminError = 'Session expired. Log in again.'; renderAdmin(); throw new Error('unauthorized'); }
  return data;
}
