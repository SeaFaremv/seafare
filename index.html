function pickItem(sid, rateId){
  const d = state.loadingDraft[sid];
  const rate = state.rates.find(r => r.id === rateId);
  if(!d || !rate) return;
  const existing = d.items.find(i => i.id === rate.id);
  if(existing){ existing.qty += 1; }
  else { d.items.unshift({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }
  d.itemSearch = '';
  d.itemDropdownOpen = false;
  renderDashboard();
}

function renderItemResultsBox(sid){
  const d = state.loadingDraft[sid];
  if(!d) return;
  const box = document.querySelector(`[data-item-results="${sid}"]`);
  if(!box) return;
  const query = (d.itemSearch || '').trim().toLowerCase();
  const sortedRates = sortedRatesByUsage();
  const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
  box.style.display = 'flex';
  box.innerHTML = matches.length ? matches.map(r => `
    <button type="button" class="item-result-row" data-pick-item="${sid}" data-rate-id="${r.id}">
      <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
    </button>
  `).join('') : `<div class="empty" style="padding:10px 0;font-size:13px;">No matching items.</div>`;
  box.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
}

// Tracks in-flight "Confirm Loaded" saves by shipment id, so the
// photo-attach handler can wait for the matching save to finish before
// starting its own -- see the race-condition note in wireLoadFormEvents.
const pendingLoadConfirms = {};

function wireLoadFormEvents(){
  document.querySelectorAll('[data-item-search]').forEach(inp => {
    // Tapping into the field opens the full item list immediately (no
    // separate dropdown toggle needed); typing then filters it live.
    inp.addEventListener('focus', () => {
      const sid = inp.dataset.itemSearch;
      const d = state.loadingDraft[sid];
      if(!d) return;
      d.itemDropdownOpen = true;
      renderItemResultsBox(sid);
    });
    inp.addEventListener('input', () => {
      const sid = inp.dataset.itemSearch;
      const d = state.loadingDraft[sid];
      if(!d) return;
      d.itemSearch = inp.value;
      d.itemDropdownOpen = true;
      renderItemResultsBox(sid);
    });
    // A short delay so a tap on a dropdown row (or the custom-add button)
    // still registers its own click first -- otherwise this would close
    // the list out from under the tap before it counts as a pick. Scroll-
    // triggered blurs (see below) are flagged and skip this entirely --
    // scrolling through the list should never collapse it, only close the
    // keyboard.
    inp.addEventListener('blur', () => {
      if(inp.dataset.scrollDismiss === '1'){ inp.dataset.scrollDismiss = ''; return; }
      const sid = inp.dataset.itemSearch;
      setTimeout(() => {
        const d = state.loadingDraft[sid];
        if(d && d.itemDropdownOpen){ d.itemDropdownOpen = false; renderDashboard(); }
      }, 200);
    });
  });
  // Scrolling either list while the keyboard is up is awkward on a phone
  // (the keyboard eats most of the screen) -- dismissing it gives the full
  // screen back to browse with. This should ONLY close the keyboard, never
  // the list itself. The tricky part: iOS blurs the focused input the
  // moment you touch down on the list to start scrolling -- that blur
  // fires before any 'scroll' event does, so flagging on scroll alone was
  // too late and let the close-on-blur logic above fire anyway. Flagging
  // on touchstart/mousedown instead catches it before that native blur
  // happens.
  document.querySelectorAll('[data-item-results], [data-items-scroll]').forEach(box => {
    const flagActiveSearchInput = () => {
      const active = document.activeElement;
      if(active && active.tagName === 'INPUT' && active.dataset.itemSearch !== undefined){
        active.dataset.scrollDismiss = '1';
      }
    };
    box.addEventListener('touchstart', flagActiveSearchInput, { passive: true });
    box.addEventListener('mousedown', flagActiveSearchInput);
    box.addEventListener('scroll', () => {
      const active = document.activeElement;
      if(active && active.tagName === 'INPUT' && active.dataset.itemSearch !== undefined){
        active.dataset.scrollDismiss = '1';
        active.blur();
      }
    });
  });
  document.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.inc].qty++; renderDashboard();
  }));
  document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid];
    const idx = b.dataset.dec;
    d.items[idx].qty = Math.max(0, d.items[idx].qty - 1);
    if(d.items[idx].qty === 0) d.items.splice(idx,1);
    renderDashboard();
  }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items.splice(b.dataset.remove,1); renderDashboard();
  }));
  document.querySelectorAll('[data-custom-name]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customName].customName = inp.value; }));
  document.querySelectorAll('[data-custom-price]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customPrice].customPrice = inp.value; }));
  // Browsers don't reliably scroll a focused field into view above the
  // keyboard when it's inside a custom scroll container (like this
  // modal) -- doing it explicitly keeps the New Item row visible instead
  // of the keyboard covering it.
  document.querySelectorAll('[data-custom-name], [data-custom-price]').forEach(inp => {
    inp.addEventListener('focus', () => {
      setTimeout(() => inp.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250);
    });
  });
  document.querySelectorAll('[data-add-custom]').forEach(b => b.addEventListener('click', async () => {
    const d = state.loadingDraft[b.dataset.addCustom];
    const name = (d.customName||'').trim();
    const price = parseFloat(d.customPrice) || 0;
    if(!name) return;
    d.itemDropdownOpen = false; // synchronous, before any await -- avoids a race with the click-outside-closes-dropdown listener

    // Reuse an existing rate if one with this name already exists (case-insensitive),
    // otherwise persist it as a new rate so it shows up in the dropdown for every
    // future shipment entry, not just this one.
    let rate = state.rates.find(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if(!rate){
      rate = { id: 'custom-'+Date.now(), name, price };
      state.rates.push(rate);
      await saveRates(state.rates);
    }

    const existing = d.items.find(i => i.id === rate.id);
    if(existing){ existing.qty++; }
    else { d.items.unshift({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }

    d.customName=''; d.customPrice='';
    renderDashboard();
  }));
  document.querySelectorAll('[data-cancel-load]').forEach(b => b.addEventListener('click', () => { delete state.loadingDraft[b.dataset.cancelLoad]; renderDashboard(); }));

  document.querySelectorAll('[data-confirm-load]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.confirmLoad;
    const draft = state.loadingDraft[id];
    const items = draft.items.filter(i => i.qty > 0);
    if(items.length === 0){ alert('Add at least one item before confirming.'); return; }
    // Camera first, synchronously, inside this click -- browsers require a
    // file-input click to happen within a trusted user gesture, so any
    // await (like a network save) before this point makes them silently
    // ignore it. The save then runs right behind it without blocking.
    //
    // The save's promise is stashed so the photo-attach handler below can
    // await it before starting its own save -- without this, if the photo
    // comes back quickly, its save could fetch the shipment before this
    // one finishes writing the items, then save that stale pre-items copy
    // right back over it, silently wiping out the items that were just
    // added. Waiting here guarantees the photo save always starts from
    // the up-to-date, items-included copy.
    const photoInput = document.querySelector(`[data-load-photo="${id}"]`);
    if(photoInput) photoInput.click();
    pendingLoadConfirms[id] = completeLoadConfirm(id);
  }));

  document.querySelectorAll('[data-load-photo]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.loadPhoto;
    const file = inp.files && inp.files[0];
    if(!file) return;
    let photo = null;
    try{ photo = await compressImageToDataUrl(file, 700, 0.45); }
    catch(e){ console.error('Photo compression failed', e); }
    if(pendingLoadConfirms[id]){ await pendingLoadConfirms[id]; delete pendingLoadConfirms[id]; }
    if(photo) await attachPhoto(id, photo);
  }));
}

// Closes the floating item-search dropdown on any tap outside it or the
// search field itself -- attached once globally (not re-attached on every
// re-render, since wireLoadFormEvents runs each time the modal updates)
// so it can't stack up duplicate listeners over a session.
document.addEventListener('click', (e) => {
  // If the click target was already removed from the DOM by another
  // handler on this same click (e.g. tapping "Log Items Loaded" itself,
  // which re-renders the whole modal mid-bubble), there's no reliable way
  // to tell "inside" from "outside" -- and it's exactly the click that
  // just opened the dropdown in the first place, so leave it alone.
  if(!e.target.isConnected) return;
  document.querySelectorAll('[data-item-search]').forEach(inp => {
    const sid = inp.dataset.itemSearch;
    const d = state.loadingDraft[sid];
    if(!d || !d.itemDropdownOpen) return;
    const resultsBox = document.querySelector(`[data-item-results="${sid}"]`);
    if(inp.contains(e.target) || (resultsBox && resultsBox.contains(e.target))) return;
    d.itemDropdownOpen = false;
    renderDashboard();
  });
});

// Scrolling the page while the on-screen keyboard is open closes it --
// matches how most native/mobile apps behave, and avoids the keyboard
// staying up (covering half the screen) while browsing elsewhere on the
// page. Deliberately touch-drag-based rather than a generic 'scroll'
// listener -- the browser fires scroll events for all sorts of reasons
// that aren't the person scrolling (e.g. auto-scrolling to keep the
// cursor visible while typing), and a plain scroll listener was closing
// the keyboard on every single keystroke because of that. Only a real
// finger-drag of a meaningful distance on the content area counts.
let _scrollDismissTouchY = null;
let _scrollDismissTarget = null;
document.addEventListener('touchstart', (e) => {
  const target = e.target.closest && e.target.closest('#panel, #gate-area');
  if(target){ _scrollDismissTouchY = e.touches[0].clientY; _scrollDismissTarget = target; }
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if(_scrollDismissTouchY === null) return;
  const dy = Math.abs(e.touches[0].clientY - _scrollDismissTouchY);
  if(dy > 15){
    const active = document.activeElement;
    if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) active.blur();
    _scrollDismissTouchY = null; // only trigger once per gesture, not on every move
  }
}, { passive: true });
document.addEventListener('touchend', () => { _scrollDismissTouchY = null; _scrollDismissTarget = null; });

// Collapses the header down to just a small logo, and the bottom nav
// away entirely, while scrolling down through a long list -- giving the
// content more room -- then restores both on scrolling back up or
// reaching near the top. Uses a real 'scroll' listener (rather than the
// touch-drag approach above) since this needs the actual scroll
// position/direction, not just "did a drag happen" -- but guards against
// the same spurious-scroll-while-typing issue noted above by skipping
// the toggle while a text field is focused, so it can't fight with
// someone mid-form-entry.
let _lastScrollTopForCollapse = 0;
document.addEventListener('scroll', (e) => {
  const target = e.target;
  if(!target || (target.id !== 'panel' && target.id !== 'gate-area')) return;
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
  const shell = document.querySelector('.shell');
  if(!shell) return;
  if(state.tab === 'settings') return; // Settings screen: header & nav stay full-size, never collapse
  const scrollTop = target.scrollTop;
  const delta = scrollTop - _lastScrollTopForCollapse;
  // Once collapsed, it stays collapsed -- however far up you scroll --
  // until you're actually back near the top of the content (or the page
  // is refreshed). A small upward flick partway down a long list
  // shouldn't snap the header back open; only reaching the top should.
  if(scrollTop <= 12){
    shell.classList.remove('header-collapsed');
  } else if(delta > 6){
    shell.classList.add('header-collapsed');
  }
  _lastScrollTopForCollapse = scrollTop;
}, true);

// Resizes and re-compresses a captured photo before it ever touches the
// database -- raw camera photos are several MB each, and this data is stored
// inside one shared JSON blob for every shipment, so uncompressed photos
// would make the whole app slow to load for everyone, not just this record.
function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function completeLoadConfirm(id){
  const draft = state.loadingDraft[id];
  if(!draft) return;
  const items = draft.items.filter(i => i.qty > 0).map(i => ({name:i.name, qty:i.qty, price:i.price}));
  if(items.length === 0) return;
  const total = items.reduce((sum,i) => sum + i.qty*i.price, 0);
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'loaded'; s.items = items; s.total = total; s.loadedAt = new Date().toISOString();
    s.invoiceId = s.invoiceId || invoiceId();
    s.paid = s.paid || false;
  });
  delete state.loadingDraft[id];
  state.expandedShipmentIds.delete(id);
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
}

async function attachPhoto(id, photo){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(s){ s.photo = photo; s.imageArchived = false; }
  });
  state.expandedShipmentIds.delete(id);
  renderDashboard();
}

// Called from the Trips tab: moves every 'loaded' shipment tied to this trip
// into 'in_transit' together, since the boat either has departed or hasn't --
// individual shipments don't depart separately.
async function markTripInTransit(tripId){
  let moved = 0;
  const now = new Date().toISOString();
  await withFreshShipments(list => {
    list.forEach(s => {
      if(s.tripId === tripId && s.status === 'loaded'){ s.status = 'in_transit'; s.inTransitAt = now; moved++; }
    });
  });
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t) t.departed = true;
  });
  return moved;
}

function isTripFinished(tripId){
  if(!tripId) return false;
  const t = (state.trips||[]).find(x => x.id === tripId);
  return !!(t && t.finished);
}

// Proof-of-delivery photos are only useful for a short window after
// delivery -- long enough to catch and correct a wrong "delivered" tap,
// not indefinitely. Clears the photo (keeping everything else about the
// shipment intact) once 3 hours have passed since deliveredAt. If the
// owner undoes the delivery within that window (Mark as Undelivered),
// deliveredAt gets cleared too, which cancels this entirely -- the photo
// only ever gets cleared for something that's genuinely still marked
// delivered 3+ hours later.
const DELIVERY_PHOTO_RETENTION_MS = 3 * 60 * 60 * 1000;
async function cleanupExpiredDeliveryPhotos(){
  const now = Date.now();
  const expiredIds = new Set(
    state.shipments
      .filter(s => s.status === 'delivered' && s.photo && s.deliveredAt && (now - new Date(s.deliveredAt).getTime()) > DELIVERY_PHOTO_RETENTION_MS)
      .map(s => s.id)
  );
  if(expiredIds.size === 0) return;
  await withFreshShipments(list => {
    list.forEach(s => {
      if(expiredIds.has(s.id) && s.status === 'delivered' && s.photo){
        delete s.photo; s.imageArchived = true;
      }
    });
  });
}

// Once a shipment is BOTH delivered and paid, there's nothing left to do
// with it -- no follow-up needed, no payment to chase. Keeping the full
// record (photo already long gone by the 3-hour rule, but names, mobile
// numbers, item lists) forever adds up for a boat running for years. 12
// hours after both delivered and paid are true gives the owner/manager a
// real window to catch a mistake with the undo buttons in the invoice
// popup (which clear paid/delivered and so remove it from this list
// entirely) before the record is folded into that month's compact
// summary and removed for good.
//
// Runs as three separate steps rather than one big shipments+settings
// save, specifically to avoid double-counting revenue if this gets
// interrupted partway (e.g. a save fails, or two devices run cleanup at
// close to the same time): a shipment is marked foldedIntoReport in the
// live list FIRST (so a retry never re-counts it), only THEN added to the
// monthly aggregate, and only removed from the live list as a final step
// once its revenue is safely recorded elsewhere. Worst case on a failure
// partway through is a shipment sitting around marked-but-not-yet-removed
// a little longer -- never lost, never double-counted.
const COMPLETED_SHIPMENT_RETENTION_MS = 12 * 60 * 60 * 1000;
function monthKeyFor(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
async function cleanupCompletedShipments(){
  const now = Date.now();
  const isDueForCleanup = (s) => {
    if(s.status !== 'delivered' || !s.paid || s.foldedIntoReport) return false;
    const deliveredMs = s.deliveredAt ? new Date(s.deliveredAt).getTime() : 0;
    const paidMs = s.paidAt ? new Date(s.paidAt).getTime() : 0;
    const completedAt = Math.max(deliveredMs, paidMs);
    return completedAt > 0 && (now - completedAt) > COMPLETED_SHIPMENT_RETENTION_MS;
  };

  // Step 1: mark candidates, computing their monthly contribution from
  // this same fresh copy so nothing changes underneath us between here
  // and step 2.
  let contributions = null;
  await withFreshShipments(list => {
    const due = list.filter(isDueForCleanup);
    if(due.length === 0) return;
    contributions = {};
    due.forEach(s => {
      const key = monthKeyFor(s.loadedAt || s.createdAt);
      if(!contributions[key]) contributions[key] = { revenue: 0, shipmentCount: 0, byIsland: {} };
      const bucket = contributions[key];
      bucket.revenue += (s.total || 0);
      bucket.shipmentCount += 1;
      bucket.byIsland[s.island] = bucket.byIsland[s.island] || { count: 0, revenue: 0 };
      bucket.byIsland[s.island].count += 1;
      bucket.byIsland[s.island].revenue += (s.total || 0);
      s.foldedIntoReport = true;
    });
  });
  if(!contributions) return;

  // Step 2: fold into the compact per-month aggregate.
  await withFreshSettings(fresh => {
    const reports = fresh.monthlyReports || (fresh.monthlyReports = {});
    Object.keys(contributions).forEach(key => {
      const c = contributions[key];
      const existing = reports[key] || { revenue: 0, shipmentCount: 0, byIsland: {} };
      existing.revenue += c.revenue;
      existing.shipmentCount += c.shipmentCount;
      Object.keys(c.byIsland).forEach(isl => {
        const e = existing.byIsland[isl] || { count: 0, revenue: 0 };
        e.count += c.byIsland[isl].count;
        e.revenue += c.byIsland[isl].revenue;
        existing.byIsland[isl] = e;
      });
      reports[key] = existing;
    });
  });

  // Step 3: safe to remove now -- their revenue is recorded.
  await withFreshShipments(list => {
    const remaining = list.filter(s => !s.foldedIntoReport);
    list.length = 0;
    list.push(...remaining);
  });
}

async function finishTrip(tripId){
  let trip;
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t){ t.finished = true; t.finishedAt = new Date().toISOString(); trip = t; }
  });
  // Shipments that stayed 'pending' (checked in, but never actually
  // loaded onto the boat) are dropped entirely at this point -- they
  // never became real cargo on this trip, so there's nothing to report as
  // undelivered and no reason to keep the placeholder around.
  //
  // Delivered shipments' photos are NOT cleared here anymore -- that's now
  // handled by a 3-hour-after-delivery timer (see
  // cleanupExpiredDeliveryPhotos) regardless of whether the trip has
  // finished, which gives the owner a real window to catch and undo a
  // wrong "delivered" tap even after the trip itself has ended.
  await withFreshShipments(list => {
    const remaining = list.filter(s => !(s.tripId === tripId && s.status === 'pending'));
    list.length = 0;
    list.push(...remaining);
  });
  if(trip) finalizeGoogleSheetForTrip(trip);
}

async function markDelivered(id){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    // Photo is kept for now -- it's only cleaned up once the trip itself is
    // marked finished (see finishTrip), not the moment an individual
    // shipment is delivered mid-trip.
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
}

// Off-island delivery -- keeps s.island as the originally registered
// destination (for accounting/records), but records where it actually got
// handed over, why, and to whom. The originally registered receiver's
// details are left untouched; the manually-entered name/mobile go in
// separate fields so both are preserved.
async function markDeliveredOffIsland(id, { island, note, receiverName, receiverMobile }){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    s.deliveredIsland = island;
    s.deliveryNote = note;
    s.actualReceiverName = receiverName;
    s.actualReceiverMobile = receiverMobile;
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  // Off-island deliveries are typically done by browsing away from the
  // pinned "arrived" island to find the shipment elsewhere -- once it's
  // handed over, snap the Dashboard back to the boat's actual arrived
  // island instead of leaving it stranded on the island just browsed to.
  const arrived = activeTripArrivedIsland();
  if(arrived) state.dashIslandView = arrived;
  renderDashboard();
}

/* ---------------- Check-In (sender) ---------------- */
function renderCheckin(){
  const panel = document.getElementById('panel');
  const trip = activeTrip(state.trips);

  if(!trip){
    panel.innerHTML = `
      <h2>Cargo Check-In</h2>
      <div class="empty" style="padding:48px 20px;">Currently there are no trips scheduled. Please check back once the next trip is announced.</div>
    `;
    return;
  }

  if(trip.departed){
    panel.innerHTML = `
      <h2>Cargo Check-In</h2>
      <div class="empty" style="padding:48px 20px;">This trip has already departed and is no longer accepting check-ins. Please check back once the next trip is announced.</div>
    `;
    return;
  }

  const dests = trip.destinations || [];

  const islandField = dests.length ? `
      <label>Destination island</label>
      <select id="f-island-select" required>
        <option value="" disabled selected>Select destination</option>
        ${dests.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}
        <option value="__other">Other</option>
      </select>
      <input type="text" id="f-island-other" placeholder="Type destination" style="display:none;">
    ` : `
      <label>Destination island</label>
      <input type="text" id="f-island-other" required placeholder="e.g. Maafushi">
    `;

  panel.innerHTML = `
    <h2>Cargo Check-In</h2>
    <p class="sub">Enter your details and who's receiving the cargo. You'll get a tracking code to share.</p>
    ${trip ? `<div class="note" style="margin-bottom:16px;">Next trip: <strong>${escapeHtml(trip.origin)} \u2192 ${escapeHtml(dests.join(', '))}</strong> on ${fmtDMY(trip.date)}</div>` : ''}

    <form id="checkin-form">
      <label>Your name (sender)</label>
      <input type="text" id="f-name" required>
      <label>Your mobile number</label>
      <input type="tel" id="f-mobile" required>
      ${islandField}
      <label>Receiver's name</label>
      <input type="text" id="f-rname" required>
      <div id="f-rname-suggestions"></div>
      <label>Receiver's mobile number</label>
      <input type="tel" id="f-rmobile" required>
      <label>Cargo note (optional)</label>
      <textarea id="f-note" rows="2" placeholder="e.g. 3 sacks of rice, fragile"></textarea>
      <button type="submit" class="btn btn-primary">Submit Check-In</button>
    </form>
  `;

  const selectEl = document.getElementById('f-island-select');
  const otherEl = document.getElementById('f-island-other');
  if(selectEl){
    selectEl.addEventListener('change', () => {
      if(selectEl.value === '__other'){ otherEl.style.display = 'block'; otherEl.required = true; }
      else { otherEl.style.display = 'none'; otherEl.required = false; otherEl.value=''; }
      runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
    });
  }
  otherEl.addEventListener('blur', () => {
    runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
  });

  document.getElementById('f-mobile').addEventListener('blur', () => {
    runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
  });
  wireReceiverAutofill('f-mobile', 'f-rname', 'f-rmobile', 'f-rname-suggestions');
  const checkSenderMobile = wireMobileValidation('f-mobile');
  const checkReceiverMobile = wireMobileValidation('f-rmobile');

  document.getElementById('checkin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const mobile = document.getElementById('f-mobile').value.trim();
    const island = selectEl && selectEl.value && selectEl.value !== '__other' ? selectEl.value : (document.getElementById('f-island-other').value||'').trim();
    const receiverName = document.getElementById('f-rname').value.trim();
    const receiverMobile = document.getElementById('f-rmobile').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if(!name || !mobile || !island || !receiverName || !receiverMobile) return;
    if(!checkSenderMobile() || !checkReceiverMobile()) return;

    const code = trackingCode();
    const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: trip ? trip.id : null, createdAt: new Date().toISOString() };
    await withFreshShipments(list => { list.push(shipment); });
    syncShipmentToSheet(shipment);

    openTrackingCodePopup(code, receiverName);
    e.target.reset();
  });
}

// Shown right after check-in instead of an inline block appended below the
// form -- keeps the page from getting visually cluttered with the form and
// result stacked together, and centers the one thing the person actually
// needs to walk away with: the tracking code. Tapping the code copies it.
function openTrackingCodePopup(code, receiverName){
  closeTrackingCodePopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'tracking-code-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="confirm-code" style="width:100%;max-width:400px;animation:invoice-pop-in 0.18s ease-out;position:relative;">
      <button type="button" id="tracking-code-popup-close-btn" style="position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.12);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;">\u2715</button>
      <div>Check-in received. Save this tracking code:</div>
      <button type="button" id="tracking-code-copy-btn" class="big" style="background:none;border:none;cursor:pointer;color:inherit;font:inherit;padding:0;">${escapeHtml(code)}</button>
      <div id="tracking-code-copy-hint" style="font-size:11px;color:#D6E8F7;margin-top:-4px;">Tap the code to copy it</div>
      <div style="font-size:12.5px;color:#D6E8F7;">Share it with ${escapeHtml(receiverName)} so they can track it too.</div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeTrackingCodePopup(); });
  document.body.appendChild(overlay);
  document.getElementById('tracking-code-popup-close-btn').addEventListener('click', closeTrackingCodePopup);
  document.getElementById('tracking-code-copy-btn').addEventListener('click', async () => {
    const hint = document.getElementById('tracking-code-copy-hint');
    try{
      await navigator.clipboard.writeText(code);
      if(hint){ hint.textContent = 'Copied!'; }
    }catch(e){
      if(hint){ hint.textContent = 'Could not copy \u2014 tap and hold to select instead.'; }
    }
  });
}
function closeTrackingCodePopup(){
  if(document.getElementById('tracking-code-popup-overlay')) unlockBodyScroll();
  document.getElementById('tracking-code-popup-overlay')?.remove();
}

/* ---------------- Track (sender + receiver + staff + owner) ---------------- */
function renderTrack(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <h2>Track a Shipment</h2>
    <p class="sub">Search by tracking code, sender mobile, or receiver mobile.</p>
    <div class="search-row">
      <input type="text" id="track-input" placeholder="CF-260721-A3K9 or mobile number" value="${escapeHtml(state.trackQuery)}">
      <button class="btn btn-primary" id="track-btn">Search</button>
    </div>
    <div id="track-results"></div>
  `;
  const renderResults = () => {
    const q = document.getElementById('track-input').value.trim().toLowerCase();
    state.trackQuery = q;
    const results = state.shipments.filter(s =>
      s.id.toLowerCase() === q ||
      (s.mobile||'').toLowerCase().includes(q) ||
      (s.receiverMobile||'').toLowerCase().includes(q)
    );
    const box = document.getElementById('track-results');
    if(!q){ box.innerHTML = ''; return; }
    if(results.length === 0){ box.innerHTML = `<div class="empty">No shipment found for "${escapeHtml(q)}".</div>`; return; }
    box.innerHTML = results.map(renderTrackResult).join('');
    wireShareEvents(box, results);
    box.querySelectorAll('[data-view-items]').forEach(b => b.addEventListener('click', () => {
      const s = results.find(x => x.id === b.dataset.viewItems);
      if(s) openTrackItemsPopup(s);
    }));
  };
  document.getElementById('track-btn').addEventListener('click', renderResults);
  document.getElementById('track-input').addEventListener('keydown', (e) => { if(e.key==='Enter') renderResults(); });

  function wireShareEvents(box, results){
    box.querySelectorAll('[data-share-image]').forEach(b => b.addEventListener('click', () => {
      const s = results.find(x => x.id === b.dataset.shareImage);
      if(s) shareInvoiceImage(s);
    }));
  }

  if(state.trackQuery) renderResults();
}


function renderTrackResult(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = { pending:'Checked In', loaded:'Loaded', in_transit:'In Transit', delivered:'Delivered' };
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';

  const timeline = steps.map((step,i) => {
    let label = labels[step];
    let redLabel = false;
    if(tripEnded && step === s.status){ label = 'Trip Ended'; redLabel = true; }
    if(tripEnded && step === 'delivered'){ label = 'Not Delivered'; redLabel = true; }
    const endedClass = (tripEnded && i <= idx) ? ' trip-ended' : '';
    return `
    <div class="tl-step ${i<=idx?'done':''}${endedClass}">
      <div class="tl-dot"></div>
      <div class="tl-label"${redLabel ? ' style="color:var(--red);"' : ''}>${label}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `;
  }).join('');

  const isCustomer = !INTERNAL_ROLES.includes(state.role);

  const invoice = (!isCustomer && s.items && s.items.length) ? `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:15px;color:var(--navy-deep);">Invoice \u2014 ${s.id}</div>
        <button class="btn btn-ghost" data-share-image="${s.id}" style="padding:6px 12px;font-size:11px;">Share as Image</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">Sender: ${escapeHtml(s.name)} \u00b7 ${telLink(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">Receiver: ${escapeHtml(s.receiverName)} \u00b7 ${telLink(s.receiverMobile)}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">Invoice ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#22A366':'#E5473B'}">${s.paid?'Paid':'Unpaid'}</strong></div>` : ''}
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="total-line"><span>Total Due</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  ` : '';

  const itemsOnly = (isCustomer && s.items && s.items.length) ? `
    <button type="button" class="btn btn-ghost" data-view-items="${s.id}" style="width:100%;margin-top:10px;">View Items (${s.items.length})</button>
  ` : '';

  return `
    <div class="tag">
      <div class="tag-top">
        <div class="tag-code">${s.id}</div>
        <span class="status-pill status-${s.status}">${labels[s.status]}</span>
      </div>
      <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.island)} ${s.receiverName ? '(for '+escapeHtml(s.receiverName)+')' : ''}</div>
      <div class="timeline">${timeline}</div>
      ${invoice}
      ${itemsOnly}
    </div>
  `;
}

// Item list only -- no pricing -- shown to senders/receivers tracking a
// shipment. Deliberately separate from the owner/staff invoice popup,
// which shows full pricing and payment details that customers shouldn't
// see here.
function openTrackItemsPopup(s){

  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'track-items-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-height:80vh;overflow-y:auto;width:100%;max-width:400px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin-bottom:2px;">Items \u2014 ${escapeHtml(s.id)}</h3>
        <button type="button" class="btn btn-ghost" id="track-items-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:14px;">To ${escapeHtml(s.island)}${s.receiverName ? ' \u00b7 for ' + escapeHtml(s.receiverName) : ''}</p>
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th></tr></thead>

        </tbody>

}

/* ---------------- Trips (owner only) ---------------- */
function renderTrips(){
  const panel = document.getElementById('panel');
  if(!_boatNameCache[CURRENT_BOAT_ID]){
    getCurrentBoatName().then(() => { if(state.tab === 'dashboard') renderDashboard(); });
  }
  const trips = (state.trips||[]).filter(t => !t.finished).slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const d = state.settings.tripDefaults || {};
  const hasDefaults = !!(d.boatContacts || d.trackingLink || d.viberLink);
  const ongoingTrip = trips.find(t => t.active && !t.finished);
  const boatRoutes = state.settings.routes || [];
  // Every island the boat is known to touch -- both explicit route origins
  // and every destination across every route -- so a return trip (e.g.
  // Feridhoo back to Male') can pick a destination island as its origin
  // too, not just the islands that have their own saved route.
  const allKnownIslands = [...new Set([
    ...boatRoutes.map(r => r.origin),
    ...boatRoutes.flatMap(r => r.destinations || [])
  ])];

  panel.innerHTML = `
    <h2>Home</h2>
    <p class="sub">Plan the next trip. The active trip's destinations show up on the customer check-in form automatically.</p>
    ${ongoingTrip ? `
      <div class="note" style="margin-bottom:16px;">A trip is currently in progress (${escapeHtml(ongoingTrip.origin)} \u2192 ${escapeHtml((ongoingTrip.destinations||[]).join(', '))}). Mark it finished before planning the next one.</div>
    ` : `
      <div class="settings-block" style="border:1.5px solid var(--line);border-radius:10px;padding:16px;background:#fff;">
        <h3>New Trip</h3>
        ${boatRoutes.length === 0 ? `
          <div class="note" style="margin-bottom:12px;">No routes set up for this boat yet \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">add them in Trip Settings</a> to have destinations fill in automatically next time.</div>
        ` : ''}
        <label>Origin</label>
        ${boatRoutes.length > 0 ? `
          <select id="trip-origin">
            <option value="" disabled selected>Select origin</option>
            ${allKnownIslands.map(origin => `<option value="${escapeHtml(origin)}">${escapeHtml(origin)}</option>`).join('')}
            <option value="__other">Other (type manually)</option>
          </select>
          <div style="position:relative;margin-top:6px;display:none;" id="trip-origin-other-wrap">
            <input type="text" id="trip-origin-other" placeholder="Type to search islands\u2026" autocomplete="off">
            <div class="item-results" id="trip-origin-results" style="display:none;"></div>
          </div>
        ` : `
          <div style="position:relative;">
            <input type="text" id="trip-origin-other" placeholder="Type to search islands\u2026" autocomplete="off">
            <div class="item-results" id="trip-origin-results" style="display:none;"></div>
          </div>
        `}
        <label>Destinations (one per line)</label>
        <textarea id="trip-dests" rows="3" placeholder="Fills in automatically once you pick an origin \u2014 edit if needed"></textarea>
        <div style="position:relative;margin-top:6px;margin-bottom:12px;">
          <input type="text" id="trip-dests-search" placeholder="Type to search &amp; add an island\u2026" autocomplete="off">
          <div class="item-results" id="trip-dests-results" style="display:none;"></div>
        </div>
        <label>Trip date</label>
        <input type="date" id="trip-date">
        <label>Loading time</label>
        <input type="time" id="trip-loading">
        <label>Estimated departure time</label>
        <input type="time" id="trip-departure">
        <label>Loading location / jetty</label>
        <input type="text" id="trip-location" placeholder="Fills in automatically once you pick an origin">
        ${hasDefaults ? `
          <div class="note">Boat contacts, tracking link, and Viber link are fixed and pulled in automatically from Owner Settings \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">edit them there</a> if they ever change.</div>
        ` : `
          <div class="note" style="border-color:var(--red);color:var(--red);">Boat contacts, tracking link, and Viber link aren't set yet \u2014 go to <a href="#settings" style="color:var(--red);font-weight:700;">Owner Settings</a> and add them first, or the announcement will show them blank.</div>
        `}
        <button class="btn btn-primary" id="create-trip-btn" style="margin-top:12px;">Create Trip &amp; Set Active</button>
      </div>
    `}
    <div id="trip-list" style="margin-top:20px;"></div>
  `;

  if(!ongoingTrip){
  if(boatRoutes.length > 0){
    document.getElementById('trip-origin').addEventListener('change', (e) => {
      const otherInput = document.getElementById('trip-origin-other');
      const otherWrap = document.getElementById('trip-origin-other-wrap');
      if(e.target.value === '__other'){
        otherWrap.style.display = '';
        otherInput.focus();
        return;
      }
      otherWrap.style.display = 'none';
      const rememberedLocations = state.settings.originLoadingLocations || {};
      const matchingRoutes = boatRoutes.filter(r => r.origin === e.target.value);
      if(matchingRoutes.length){
        // Known outbound route (e.g. Male' -> Maalhos, Himandhoo, Feridhoo)
        // -- fill in exactly as saved.
        const mergedDestinations = [...new Set(matchingRoutes.flatMap(r => r.destinations || []))];
        document.getElementById('trip-dests').value = mergedDestinations.join('\n');
        const routeWithLocation = matchingRoutes.find(r => r.location);
        document.getElementById('trip-location').value = routeWithLocation ? routeWithLocation.location : (rememberedLocations[e.target.value] || '');
      } else {
        // Origin is a destination-only island (e.g. Feridhoo, picked for a
        // return trip) -- there's no saved route to auto-fill from, so let
        // the owner pick which of the other known islands this return
        // trip stops at instead of leaving it blank. The loading location
        // still auto-fills here if this origin's been used before, even
        // without a full saved route.
        document.getElementById('trip-location').value = rememberedLocations[e.target.value] || '';
        openDestinationPickerPopup(e.target.value, allKnownIslands, boatRoutes);
      }
    });
  }

  // Same auto-fill as above, but for the free-text origin field -- used
  // either as the "Other" fallback within the dropdown, or as the only
  // origin field at all for a boat with no saved routes yet (the common
  // case early on). Fires on blur so it doesn't fight with typing, and
  // only fills in if the location field is still empty.
  const originOtherInput = document.getElementById('trip-origin-other');
  if(originOtherInput){
    originOtherInput.addEventListener('blur', () => {
      const typed = originOtherInput.value.trim();
      const locationField = document.getElementById('trip-location');
      const rememberedLocations = state.settings.originLoadingLocations || {};
      if(typed && locationField && !locationField.value.trim() && rememberedLocations[typed]){
        locationField.value = rememberedLocations[typed];
      }
    });
  }

  // Same flat, searchable island list used by both dropdowns below --
  // built once from the atoll reference data rather than the two-step
  // atoll-then-island picker, to match how item search works: type,
  // see matches immediately, tap one.
  const flatIslandList = Object.keys(MALDIVES_ATOLLS).flatMap(atoll =>
    MALDIVES_ATOLLS[atoll].map(island => ({ island, atoll }))
  );
  function wireIslandSearchDropdown(inputId, resultsId, onPick){
    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);
    if(!input || !results) return;
    const draw = () => {
      const q = input.value.trim().toLowerCase();
      const matches = q ? flatIslandList.filter(x => x.island.toLowerCase().includes(q)) : flatIslandList;
      results.innerHTML = matches.length ? matches.slice(0, 60).map(x => `
        <button type="button" class="item-result-row" data-pick-search-island="${escapeHtml(x.island)}">
          <span>${escapeHtml(x.island)}</span><span class="tag-meta">${escapeHtml(x.atoll)}</span>
        </button>
      `).join('') : `<div class="empty" style="padding:10px 0;font-size:13px;">No matching island \u2014 whatever you've typed will be used as-is.</div>`;
      results.querySelectorAll('[data-pick-search-island]').forEach(b => b.addEventListener('mousedown', (e) => {
        e.preventDefault(); // keep focus/blur ordering predictable on tap
        onPick(b.dataset.pickSearchIsland);
        results.style.display = 'none';
      }));
    };
    input.addEventListener('focus', () => { draw(); results.style.display = ''; });
    input.addEventListener('input', () => { draw(); results.style.display = ''; });
    // Short delay so a tap on a result (mousedown above) fires before the
    // dropdown hides -- standard pattern for this, works reliably on touch.
    input.addEventListener('blur', () => { setTimeout(() => { results.style.display = 'none'; }, 150); });
  }
  wireIslandSearchDropdown('trip-origin-other', 'trip-origin-results', (islandName) => {
    const originSelect = document.getElementById('trip-origin');
    const otherInput = document.getElementById('trip-origin-other');
    if(originSelect){ originSelect.value = '__other'; }
    otherInput.value = islandName;
    otherInput.dispatchEvent(new Event('blur'));
    otherInput.blur();
  });
  wireIslandSearchDropdown('trip-dests-search', 'trip-dests-results', (islandName) => {
    const destsField = document.getElementById('trip-dests');
    const existing = destsField.value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!existing.includes(islandName)) existing.push(islandName);
    destsField.value = existing.join('\n');
    document.getElementById('trip-dests-search').value = '';
  });

  document.getElementById('create-trip-btn').addEventListener('click', async () => {
    const originSelect = document.getElementById('trip-origin');
    const origin = (originSelect && originSelect.value !== '__other' ? originSelect.value : document.getElementById('trip-origin-other').value).trim();
    const destinations = document.getElementById('trip-dests').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;
    const departureTime = document.getElementById('trip-departure').value;
    const location = document.getElementById('trip-location').value.trim();
    const fresh = state.settings.tripDefaults || {};
    const boatContacts = fresh.boatContacts || '';
    const trackingLink = fresh.trackingLink || '';
    const viberLink = fresh.viberLink || '';
    if(!origin || destinations.length === 0 || !date){ alert('Origin, at least one destination, and a date are required.'); return; }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    // Remember this loading location against this origin, regardless of
    // whether it came from a saved route or was typed by hand -- so next
    // time this origin is picked (including return trips with no saved
    // route at all), it's already filled in.
    if(location){
      const updatedSettings = Object.assign({}, state.settings, {
        originLoadingLocations: Object.assign({}, state.settings.originLoadingLocations || {}, { [origin]: location })
      });
      state.settings = updatedSettings;
      saveSettings(updatedSettings);
    }
    renderDashboard();
    createGoogleSheetForTrip(trip);
  });
  } // end ongoingTrip guard

  const list = panel.querySelector('#trip-list');
  if(trips.length === 0){ list.innerHTML = `<div class="empty">No trips planned yet.</div>`; return; }

  list.innerHTML = trips.map(t => {
    const loadedCount = state.shipments.filter(s => s.tripId === t.id && s.status === 'loaded').length;
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    // 'pending' shipments were checked in but never actually loaded onto
    // the boat -- they aren't real cargo on this trip, so there's nothing
    // to warn about here (they're dropped entirely once the trip finishes,
    // see finishTrip).
    const undelivered = tripShipments.filter(s => s.status !== 'delivered' && s.status !== 'pending');
    const delivered = tripShipments.filter(s => s.status === 'delivered');
    const statusClass = t.finished ? 'status-delivered' : (t.departed ? 'status-in_transit' : (t.active?'status-delivered':'status-pending'));
    const statusLabel = t.finished ? 'Finished' : (t.departed ? 'In Transit' : (t.active?'Active':'Past'));
    return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill ${statusClass}">${statusLabel}</span>
          ${t.arrivedIsland && !t.finished ? `<span class="status-pill status-arrived">Boat Arrived ${escapeHtml(t.arrivedIsland)}</span>` : ''}
        </div>
      </div>
      <div class="tag-meta">${escapeHtml(t.location||'')}</div>
      ${t.finished ? `<div class="tag-meta">${delivered.length} delivered \u00b7 ${undelivered.length} undelivered</div>` : ''}
      ${t.departed && !t.finished ? `
        <div style="margin-top:10px;">
          <label style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:4px;">Boat arrived at</label>
          <select data-arrived-select="${t.id}">
            <option value="" ${!t.arrivedIsland ? 'selected' : ''}>Not arrived yet</option>
            ${(t.destinations||[]).map(isl => `<option value="${escapeHtml(isl)}" ${t.arrivedIsland===isl ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="tag-actions">
        ${!t.active && !t.finished ? `<button class="btn btn-amber" data-set-active="${t.id}">Set Active</button>` : ''}
        ${t.active && !t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-transit="${t.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-finish="${t.id}">Mark Trip Finished</button>` : ''}
        ${!t.finished ? `<button class="btn btn-ghost" data-copy-ann="${t.id}">Copy Announcement</button>` : ''}
        <button class="btn btn-danger" data-del-trip="${t.id}">Delete</button>
      </div>
      ${!t.finished ? `<textarea readonly rows="9" style="margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;">${escapeHtml(buildAnnouncement(t))}</textarea>` : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-mark-transit]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.')) return;
    const tripId = b.dataset.markTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    let moved;
    try{
      moved = await markTripInTransit(tripId);
    }catch(e){
      console.error('markTripInTransit failed', e);
      alert('Could not mark this trip in transit. Check your connection and try again.');
      return;
    }
    if(trip) downloadTripManifest(trip, tripShipments);
    alert(`Trip marked in transit. ${moved} shipment(s) updated.`);
    renderTrips();
  }));

  list.querySelectorAll('[data-mark-finish]').forEach(b => b.addEventListener('click', () => {
    openFinishTripPopup(b.dataset.markFinish);
  }));

  list.querySelectorAll('[data-arrived-select]').forEach(sel => sel.addEventListener('change', () => {
    const tripId = sel.dataset.arrivedSelect;
    const island = sel.value || null;
    // Optimistic: apply the change locally and re-render immediately so it
    // feels instant, then persist safely (fetch-fresh + merge + save) in
    // the background. This is a simple find-by-id field update, so
    // applying it twice (once to the live state, once to the freshly
    // fetched copy inside withFreshTrips) is safe -- unlike an "add new
    // item" mutation, there's no risk of creating a duplicate.
    const localTrip = (state.trips || []).find(t => t.id === tripId);
    if(localTrip){ localTrip.arrivedIsland = island; localTrip.arrivedAt = island ? new Date().toISOString() : null; }
    state.dashIslandView = island;
    renderTrips();
    withFreshTrips(l => {
      const t = l.find(x => x.id === tripId);
      if(t){ t.arrivedIsland = island; t.arrivedAt = island ? new Date().toISOString() : null; }
    }).then(() => renderTrips());
  }));

  list.querySelectorAll('[data-set-active]').forEach(b => b.addEventListener('click', () => {
    const targetId = b.dataset.setActive;
    state.trips.forEach(t => t.active = (t.id === targetId));
    renderTrips();
    withFreshTrips(l => { l.forEach(t => t.active = (t.id === targetId)); }).then(() => renderTrips());
  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Delete this trip?')) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    const t = trips.find(x => x.id === b.dataset.copyAnn);
    const text = buildAnnouncement(t);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => alert('Announcement copied.')).catch(() => alert('Could not copy \u2014 select the text box manually.'));
    } else { alert('Select the text in the box and copy manually.'); }
  }));
}

async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){ needsSave = true; }
  });
  if(needsSave){
    await withFreshShipments(list => {
      list.forEach(s => {
        if(s.items && s.items.length && !s.invoiceId){
          s.invoiceId = invoiceId();
          if(s.paid === undefined) s.paid = false;
        }
      });
    });
  }

  // The three summary stats cover every invoice ever generated, so the
  // numbers always add up (Total Invoiced = Paid + Unpaid) regardless of
  // whether the trip that carried them has since finished -- money owed
  // doesn't stop counting just because its trip moved to Reports. The
  // detailed list below stays focused on the current/active trip only,
  // matching "Invoices from finished trips move to Reports".
  const allInvoices = state.shipments.filter(s => s.invoiceId && !s.voided);
  const total = allInvoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = allInvoices.filter(s => !s.paid);
  const paid = allInvoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId && !isTripFinished(s.tripId)).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  const unpaidTotal = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const paidTotal = paid.reduce((sum,s) => sum + (s.total||0), 0);

  panel.innerHTML = `
    <h2>Invoices</h2>
    <p class="sub">Generated automatically when a shipment's items are logged. Invoices from finished trips move to Reports.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <button type="button" class="stat-card" id="unpaid-stat-card" style="text-align:left;cursor:${unpaid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Unpaid${unpaid.length ? ` (${unpaid.length})` : ''}</div>
        <div class="sval" style="color:var(--red);">${unpaid.length ? fmtMoney(unpaidTotal) : '0'}</div>
      </button>
      <button type="button" class="stat-card" id="paid-stat-card" style="text-align:left;cursor:${paid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Paid${paid.length ? ` (${paid.length})` : ''}</div>
        <div class="sval" style="color:var(--green);">${paid.length ? fmtMoney(paidTotal) : '0'}</div>
      </button>
    </div>
    <div id="invoice-list"></div>
  `;

  if(unpaid.length){
    document.getElementById('unpaid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Unpaid Invoices', unpaid,
      () => ({ title: 'Unpaid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && !s.paid) })
    ));
  }
  if(paid.length){
    document.getElementById('paid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Paid Invoices', paid,
      () => ({ title: 'Paid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && s.paid) })
    ));
  }

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">No invoices yet.</div>`; return; }

  list.innerHTML = sorted.map(s => {
    return `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">Share</button>
        ${!s.voided && !s.paid ? `
          <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">Mark Unpaid</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">Void</button>` : ''}
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { openInvoicePopup(b.dataset.invPrint); }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invPay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invPay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    openCashPopup(b.dataset.cashOpen);
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invUnpay);
      if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invUnpay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Void this invoice? It will be excluded from totals.')) return;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invVoid);
      if(s) s.voided = true;
    });
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  if(state.reportTripView && state.reportIslandView) return renderReportIslandDetail();
  if(state.reportTripView) return renderReportTripIslands();

  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided && s.paid);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.paidAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.paidAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

  const finishedTrips = (state.trips||[]).filter(t => t.finished).sort((a,b) => new Date(b.finishedAt) - new Date(a.finishedAt));

  panel.innerHTML = `
    <button type="button" class="btn btn-ghost" id="reports-back-to-settings-btn" style="margin-bottom:12px;">\u2190 Back to Settings</button>
    <h2>Revenue Reports</h2>
    <p class="sub">Owner-only view. Revenue reflects collected (paid) payments only.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat-card"><div class="slabel">This Week</div><div class="sval">${fmtMoney(revWeek)}</div></div>
      <div class="stat-card"><div class="slabel">Today</div><div class="sval">${fmtMoney(revToday)}</div></div>
      <div class="stat-card"><div class="slabel">Shipments Logged</div><div class="sval">${state.shipments.length}</div></div>
    </div>
    <div class="settings-block">
      <h3>By Destination Island</h3>
      ${islandRows.length === 0 ? '<div class="empty">No invoiced shipments yet.</div>' : `
        <div class="invoice" style="padding:14px 18px;">
          <table>
            <thead><tr><th>Island</th><th class="num">Shipments</th><th class="num">Revenue</th></tr></thead>
            <tbody>
              ${islandRows.map(isl => `<tr><td>${escapeHtml(isl)}</td><td class="num">${byIsland[isl].count}</td><td class="num">${fmtMoney(byIsland[isl].revenue)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
    <div class="settings-block">
      <h3>Trip Reports</h3>
      <p class="sub" style="margin-bottom:12px;">Finished trips. Select one to see delivered/undelivered by destination island.</p>
      <div id="trip-report-list"></div>
    </div>
  `;

  document.getElementById('reports-back-to-settings-btn').addEventListener('click', () => {
    state.reportTripView = null; state.reportIslandView = null;
    renderSettings();
  });

  const listEl = panel.querySelector('#trip-report-list');
  if(finishedTrips.length === 0){
    listEl.innerHTML = `<div class="empty">No finished trips yet.</div>`;
    return;
  }
  listEl.innerHTML = finishedTrips.map(t => {
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    const delivered = tripShipments.filter(s => s.status === 'delivered').length;
    const undelivered = tripShipments.length - delivered;
    const unpaid = tripShipments.filter(s => !s.paid).length;
    return `
      <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:8px;">
        <button type="button" class="item-result-row" data-open-trip="${t.id}" style="flex:1;margin-bottom:0;">
          <span>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))} \u00b7 ${fmtDMY(t.date)}</span>
          <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
        </button>
      </div>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-trip]').forEach(b => b.addEventListener('click', () => {
    state.reportTripView = b.dataset.openTrip;
    state.reportIslandView = null;
    renderReports();
  }));
}

function renderReportTripIslands(){
  const panel = document.getElementById('panel');
  const t = (state.trips||[]).find(x => x.id === state.reportTripView);
  if(!t){ state.reportTripView = null; renderReports(); return; }
  const tripShipments = state.shipments.filter(s => s.tripId === t.id);

  panel.innerHTML = `
    <button class="btn btn-ghost" id="back-to-reports-btn" style="margin-bottom:14px;">\u2190 Back to Reports</button>
    <h2>${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</h2>
    <p class="sub">${fmtDMY(t.date)} \u00b7 Finished ${t.finishedAt ? fmtDate(t.finishedAt) : ''}</p>
    <div id="island-list"></div>
  `;
  document.getElementById('back-to-reports-btn').addEventListener('click', () => { state.reportTripView = null; renderReports(); });

  const islands = (t.destinations && t.destinations.length) ? t.destinations : [...new Set(tripShipments.map(s => s.island))];
  const listEl = document.getElementById('island-list');
  if(islands.length === 0){ listEl.innerHTML = `<div class="empty">No destination islands on this trip.</div>`; return; }

  listEl.innerHTML = islands.map(isl => {
    const forIsland = tripShipments.filter(s => s.island === isl);
    const delivered = forIsland.filter(s => s.status === 'delivered').length;
    const undelivered = forIsland.length - delivered;
    const unpaid = forIsland.filter(s => !s.paid).length;
    return `
      <button type="button" class="item-result-row" data-open-island="${escapeHtml(isl)}" style="margin-bottom:8px;">
        <span>${escapeHtml(isl)}</span>
        <span class="rprice">${delivered} delivered \u00b7 ${undelivered} undelivered \u00b7 ${unpaid} unpaid</span>
      </button>
    `;
  }).join('');
  listEl.querySelectorAll('[data-open-island]').forEach(b => b.addEventListener('click', () => {
    state.reportIslandView = b.dataset.openIsland;
    renderReports();
  }));
}

      </div>

      <div class="party-block"><span class="party-role">Sender</span><span class="party-name">${escapeHtml(s.name)}</span></div>
      ${s.items && s.items.length ? `<div class="tag-items">Items: ${s.items.map(i=>`${i.qty}\u00d7 ${escapeHtml(i.name)}`).join(', ')}</div>` : ''}
    </div>

  const invoiced = shipments.filter(s => s.invoiceId);

  const isOwner = state.role === 'owner' || state.role === 'manager';

  const renderInvoiceRow = (s) => {
    return `
    <div class="tag">
      ${isOwner ? `<button class="corner-delete" data-report-inv-delete="${s.id}" title="Delete">\u00d7</button>` : ''}
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.paid ? 'status-delivered' : 'status-in_transit'}">${s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid'}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      ${isOwner ? `
        <div class="tag-actions">
          <button class="btn btn-ghost" data-report-inv-share="${s.id}">Share</button>
          ${!s.paid ? `
            <button class="btn btn-primary" data-cash-open="${s.id}">Collect \u2014 Cash</button>
            <button class="btn btn-primary" data-report-inv-pay="${s.id}" data-method="transfer">Collect \u2014 Transfer</button>
          ` : ''}

}

// Filenames use both parties' name + mobile, sanitized for the filesystem.
function safeFilenamePart(str){
  return (str||'').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'') || 'unknown';
}
function photoFilename(s){
  const senderPart = `${safeFilenamePart(s.name)}-${safeFilenamePart(s.mobile)}`;
  const receiverPart = `${safeFilenamePart(s.receiverName)}-${safeFilenamePart(s.receiverMobile)}`;
  return `${senderPart}_${receiverPart}.jpg`;
}
// Shows the photo as a tappable filename link rather than an inline image --
// nobody has to scroll past a photo they didn't ask to see; tapping expands
// it right here on the page instead of navigating away to a new tab.
function photoLinkHtml(s){
  if(!s.photo) return '';
  return `
    <details class="items-details" style="margin-top:8px;">
      <summary>\ud83d\udcf7 ${escapeHtml(photoFilename(s))}</summary>
      <div class="items-body">
        <img src="${s.photo}" alt="Loading photo" style="max-width:100%;border-radius:8px;margin-top:8px;display:block;">
      </div>
    </details>
  `;
}
function downloadPhoto(s){
  if(!s.photo) return;
  const a = document.createElement('a');
  a.href = s.photo;
  a.download = photoFilename(s);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari often ignores the download attribute for data URLs and just
  // navigates instead -- opening it in a new tab too means there's always a
  // way to save it (long-press -> Save Image) even if the click above does
  // nothing visible.
  window.open(dataUrl, '_blank');
}

// Trip manifest export -- a self-contained HTML report of every cargo item
// on the trip, including each shipment's loading photo (a CSV can't embed
// images meaningfully, so HTML is used instead -- it opens in any browser
// or photo viewer and saves straight to the device). No external service
// involved, whoever marks the trip in transit (owner or manager) gets this
// on their own phone.
function buildTripManifestHTML(trip, shipments){
  const rows = shipments.map(s => {
    const items = (s.items||[]).map(i => `${i.qty}x ${escapeHtml(i.name)}`).join(', ');
    return `
      <tr>
        <td>${escapeHtml(s.id)}</td>
        <td>${escapeHtml(s.name)}<br><span class="muted">${escapeHtml(s.mobile||'')}</span></td>
        <td>${escapeHtml(s.receiverName||'\u2014')}<br><span class="muted">${escapeHtml(s.receiverMobile||'')}</span></td>
        <td>${escapeHtml(s.island||'')}</td>
        <td>${items}</td>
        <td>${fmtMoney(s.total||0)}</td>
        <td>${s.paid ? 'Paid' : 'Unpaid'}</td>
        <td>${s.photo ? `<img src="${s.photo}" alt="Loading photo for ${escapeHtml(s.id)}">` : '<span class="muted">No photo</span>'}</td>
      </tr>
    `;
  }).join('');
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trip Manifest</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#1a2e22;}
  h1{font-size:20px;margin-bottom:2px;}
  p.sub{color:#6b7a70;margin-top:0;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;}
  th{background:#0f3d2e;color:#fff;}
  .muted{color:#888;font-size:12px;}
  img{max-width:140px;max-height:140px;border-radius:6px;display:block;}
</style></head>
<body>
  <h1>${escapeHtml(trip.origin)} \u2192 ${escapeHtml((trip.destinations||[]).join(', '))}</h1>
  <p class="sub">${escapeHtml(fmtDMY(trip.date))} \u00b7 ${shipments.length} shipment(s)</p>
  <table>
    <thead><tr><th>Tracking Code</th><th>Sender</th><th>Receiver</th><th>Island</th><th>Items</th><th>Total</th><th>Payment</th><th>Photo</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
</body></html>`;
}
function downloadTripManifest(trip, shipments){
  if(!shipments.length) return;
  const html = buildTripManifestHTML(trip, shipments);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const rawName = `${trip.origin}-to-${(trip.destinations||[]).join('-')}-${trip.date}-manifest.html`;
  const filename = rawName.replace(/[^a-zA-Z0-9.\-]+/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
