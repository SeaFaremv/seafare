<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaFare — Owner Sign In</title>
<meta http-equiv="refresh" content="0; url=https://seafare.github.io/#org">
<script>
  // Absolute path, not relative -- this file lives at /owner/index.html,
  // so a relative "#org" would resolve to /owner/#org and never reach the
  // actual app. location.replace (not .href) so this redirect doesn't
  // leave a junk entry in browser history.
  location.replace('https://seafare.github.io/#org');
</script>
</head>
<body>
  <p>Redirecting to sign in&hellip; if nothing happens, <a href="https://seafare.github.io/#org">tap here</a>.</p>
</body>
</html>
